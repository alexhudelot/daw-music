# "Haustorium (Sculpted)": Haustorium's journey and bass lines, every sound above them engineered and placed in depth.
# "Haustorium": the thread a parasitic fungus pushes through a host's wall, to feed from inside it.
#
# Written against Sclerotium's verdict: a jarring bass melody, a basic bass sound with no modulation, repetition that
# made it sound old. The bass stays on F: a round, steady body, with the movement in a layer above it. The harmony is
# moved by the parts above it. Fewer notes and sounds, cells crossing the barline, slow timbre.
#
#   1-32     intro: the spore breathing in a large space; the moving bass layer alone; no kick
#   33-96    first run: gallop held on F; the 7-cell; riffs at 61 and 89, each followed by space; figure from 65
#   97-108   break: the space opens, the spore answers a far melody
#   109-168  second run: a gallop figure; one 3+3+2 cell for 32 bars, one 5-cell for 24; the spore a hollow throat at 133
#   169-180  break, the largest: the spore sings nearly pure, in a cloud
#   181-248  third run, the peak: two new cells held 32 and 28 bars, a new melody at 197, an 8-bar riff at 229
#   249-256  short break
#   257-280  the last run, then out into the space
format = "daw-song 1"
title = "Haustorium (Sculpted)"
publish = true
tempo = 145
meter = "4/4"
seed = 93

[instruments]
kick = { synth = "kick", base = "Ab1", bus = "punch" }
bass = { synth = "bass", bus = "bass" }
bmove = { synth = "bmove", bus = "bmove", octave = 1 }
hat = { synth = "hat", base = "F6", bus = "hats", pan = 0.15 }
ohat = { synth = "ohat", base = "F6", bus = "hats", pan = -0.12, gain = 1 }
tick = { synth = "tick", base = "C5", bus = "ticks" }
ride = { sound = "ride", gain = -18, pan = 0.25, bus = "hats", cut = true, release = 0.3 }
clap = { sound = "clap", gain = -9, bus = "drums" }
snare = { synth = "snare", base = "D3", gain = -5, bus = "drums" }
roller = { synth = "snare", base = "D3", bus = "roll" }
crash = { sound = "crash", gain = -17, bus = "hats" }
rcrash = { sound = "crash", gain = -15, bus = "hats", reverse = true }
chop1 = { sample = "samples/haustorium-sculpted/chop1.flac", base = "C4", gain = -6, bus = "chop", cut = true, release = 0.01 }
chop2 = { sample = "samples/haustorium-sculpted/chop2.flac", base = "C4", gain = -6, bus = "chop", cut = true, release = 0.02, reverse = true }
chop3 = { sample = "samples/haustorium-sculpted/chop3.flac", base = "C4", gain = -7, bus = "chop", cut = true, release = 0.02 }
chop4 = { sample = "samples/haustorium-sculpted/chop4.flac", base = "C4", gain = -7, bus = "chop", reverse = true }
impact = { sound = "impact", gain = -12 }
clang = { sample = "samples/sclerotium/clang.flac", base = "A3", gain = -14, bus = "ticks", cut = true, release = 0.2 }
cell = { synth = "cell", bus = "cell" }
lead = { synth = "lead", bus = "lead", glide = 0.03 }
far = { synth = "lead", bus = "far", glide = 0.04 }
riff = { synth = "riff", bus = "riff", glide = 0.012 }
spore = { synth = "spore", bus = "spore", glide = 0.05 }
drone = { synth = "drone", bus = "pads" }
wind = { synth = "wind", bus = "wind" }
air = { synth = "air", bus = "wind", gain = -3 }
riser = { synth = "riser", bus = "build" }
fall = { synth = "fall", bus = "build" }

# --- the low end ---------------------------------------------------------------------------------------------

# Sclerotium's kick (a clean sine falling slowly through 100 Hz), now landing on Ab, the minor third over the root, 52 Hz:
# its energy sits above the bass fundamental, and the bass rests under its tail.
[synths.kick]
osc = [{ wave = "sine", to = "dry" }, { wave = "noise", level = -70 }]
filter = { type = "band12", cutoff = 3500, resonance = 0.2 }
shape = { drive = 2, asym = 0.08 }
level = -2
env = [
  { attack = 0.0005, hold = 0.125, decay = 0.065, curve = 1, release = 0.005 },
  { decay = 0.009, curve = 5 },
  { decay = 0.085, curve = 3 },
  { decay = 0.004 },
]
mod = [["env2", "pitch", 23], ["env3", "pitch", 22], ["env4", "osc2.level", 62]]

# the body: round and steady, no filter and no movement. A sine, its octave close under it (the warmth), a little
# triangle. Up in 18 ms and level through the note.
[synths.bass]
osc = [
  { wave = "sine", level = -2, to = "dry" },
  { wave = "sine", octave = 1, level = -6, to = "dry" },
  { wave = "saw", level = -3 },
]
filter = { type = "low24", cutoff = 300, resonance = 0.1 }
level = -2.5
env = [{ attack = 0.016, attack_curve = 3, hold = 0.076, decay = 0.01, curve = -1, release = 0.006 }]

# the moving layer: FM into a saw, a pulse, through a lowpass and then a moving vowel, folded. Its settings are
# automated on cycles of 5, 7, 9, 11 and 13 bars over the sections' own arcs; a dotted-quarter LFO and a per-note
# snap run on top.
[synths.bmove]
osc = [
  { wave = "sine", octave = 1, semi = 7, mute = true },
  { wave = "triangle", fm = 2, fm_by = 1 },
  { wave = "pulse", width = 0.45, detune = 7, fm = 1, fm_by = 1, level = -5 },
  { wave = "triangle", octave = 1, level = -16, to = "dry" },
]
filter = { type = "comb", cutoff = 500, resonance = 0.45 }
filter2 = { type = "formant", vowel = 2, resonance = 0.4 }
shape = { fold = 4, asym = 0.3, mix = 0.6 }
level = -5
env = [
  { attack = 0.012, hold = 0.05, decay = 0.03, curve = -1, release = 0.01 },
  { decay = 0.05, curve = 3 },
]
lfo = [{ shape = "triangle", rate = "q.", free = true }, { shape = "smooth", rate = "3w", free = true }]
mod = [
  ["env2", "filter.cutoff", 1.5],
  ["velocity", "filter.cutoff", 0.7],
  ["lfo1", "filter2.vowel", 0.5],
  ["lfo1", "osc2.fm", 0.7],
  ["lfo2", "filter.resonance", 0.15],
  ["random", "filter.cutoff", 0.15],
]

# --- the parts above ------------------------------------------------------------------------------------------

# the cell: a pulse moved by a sine, snapping through a resonant lowpass, hollow in the low mids
[synths.cell]
osc = [
  { wave = "sine", octave = 3, semi = 5, mute = true },
  { wave = "triangle", fm = 1.2, fm_by = 1 },
  { wave = "noise", level = -20 },
]
filter = { type = "comb", cutoff = 700, resonance = 0.5 }
filter2 = { type = "formant", vowel = 1, resonance = 0.3 }
shape = { fold = 6, asym = 0.2, mix = 0.6 }
level = -6.5
env = [{ attack = 0.002, decay = 0.09, curve = 3, release = 0.012 }, { decay = 0.05, curve = 3 }]
lfo = [{ shape = "smooth", rate = "5w", free = true }]
mod = [["env2", "osc2.fm", 3], ["env2", "filter2.vowel", 1.5], ["lfo1", "filter2.vowel", 1.2], ["velocity", "filter.cutoff", 0.25]]

# the melody: a soft FM tone with breath, through a slowly moving vowel; no unison, no vibrato
[synths.lead]
osc = [
  { wave = "sine", octave = 1, semi = 6, mute = true },
  { wave = "triangle", fm = 2.5, fm_by = 1 },
  { wave = "noise", level = -22 },
]
filter = { type = "formant", vowel = 2.5, resonance = 0.7 }
filter2 = { type = "low12", cutoff = 1800, resonance = 0.1 }
shape = { fold = 5, mix = 0.5 }
level = -9
env = [{ attack = 0.004, decay = 0.16, sustain = 0.3, release = 0.04 }, { decay = 0.12, curve = 2 }]
lfo = [{ shape = "smooth", rate = "2w", free = true }, { shape = "triangle", rate = "t", delay = 0.06 }]
mod = [["env2", "filter.vowel", -2.5], ["env2", "osc2.fm", 3], ["lfo1", "filter.vowel", 1], ["lfo2", "filter.vowel", 0.3]]

# the riff: a thin hard edge, quick; FM and a resonance that follow the note
[synths.riff]
osc = [
  { wave = "sine", octave = 2, semi = 1, mute = true },
  { wave = "triangle", fm = 1.5, fm_by = 1 },
  { wave = "noise", level = -14 },
]
filter = { type = "band24", cutoff = 2200, resonance = 0.55, drive = 8 }
filter2 = { type = "comb", cutoff = 900, resonance = 0.6 }
shape = { drive = 6, fold = 6, mix = 0.6 }
level = -7
env = [{ attack = 0.001, decay = 0.05, sustain = 0.25, release = 0.02 }, { decay = 0.03, curve = 3 }]
mod = [["env2", "filter.cutoff", 1.2], ["note", "filter.cutoff", 0.5], ["note", "filter2.cutoff", 1], ["random", "pan", 0.4], ["velocity", "level", 3]]

# the spore, the sound no earlier track has: noise phase-modulating a sine and a thin pulse, through a comb tuned to the
# note. FM high: a breath in a pipe. FM low and the comb nearly self-ringing: a tone condensing out of it. The comb's
# feedback turned negative: a hollow throat, sounding an octave lower. Automated across the whole track.
[synths.spore]
osc = [
  { wave = "noise", mute = true },
  { wave = "sine", fm = 14, fm_by = 1 },
  { wave = "pulse", width = 0.12, fm = 5, fm_by = 1, level = -8, pan = 0.3 },
]
filter = { type = "comb", cutoff = 262, resonance = 0.7 }
filter2 = { type = "formant", vowel = 1.5, resonance = 0.35 }
shape = { fold = 1, mix = 0.5 }
level = -12
env = [{ attack = 0.03, decay = 0.35, sustain = 0.55, release = 0.3 }, { decay = 0.2, curve = 3 }]
lfo = [{ shape = "steps", rate = "t", free = true }, { shape = "smooth", rate = "w.", free = true }]
mod = [
  ["note", "filter.cutoff", 1],
  ["lfo1", "filter.cutoff", 0.012],
  ["lfo2", "filter2.vowel", 0.8],
  ["lfo2", "pan", 0.5],
  ["env2", "filter2.vowel", -1],
  ["env2", "osc2.fm", 4],
]

[synths.tick]
osc = [{ wave = "pulse", width = 0.3, octave = 1 }, { wave = "noise", level = -8 }]
filter = { type = "band12", cutoff = 3200, resonance = 0.55 }
level = -18
env = [{ attack = 0.0005, decay = 0.022, curve = 3, release = 0.004 }]
mod = [["note", "filter.cutoff", 1], ["random", "filter.cutoff", 0.3], ["velocity", "level", 5]]

[synths.hat]
osc = [
  { wave = "noise", level = -5 },
  { wave = "pulse", width = 0.4, level = -6 },
  { wave = "pulse", width = 0.4, semi = 6, detune = 31, level = -8 },
  { wave = "pulse", width = 0.5, semi = 15, detune = -17, level = -9, fm = 1.5, fm_by = 2 },
]
filter = { type = "high24", cutoff = 7500, resonance = 0.25 }
level = -12
env = [{ attack = 0.0005, decay = 0.05, curve = 4, release = 0.01 }]
mod = [["random", "filter.cutoff", 0.25], ["random", "level", 1.5], ["velocity", "level", 6]]

[synths.ohat]
osc = [
  { wave = "noise", level = -5 },
  { wave = "pulse", width = 0.4, level = -6 },
  { wave = "pulse", width = 0.4, semi = 6, detune = 31, level = -8 },
  { wave = "pulse", width = 0.5, semi = 15, detune = -17, level = -9, fm = 1.5, fm_by = 2 },
]
filter = { type = "high24", cutoff = 6500, resonance = 0.3 }
level = -12
env = [{ attack = 0.002, decay = 0.2, curve = 3, release = 0.02 }]
mod = [["random", "filter.cutoff", 0.2], ["velocity", "level", 6]]

[synths.snare]
osc = [{ wave = "triangle", level = -4, to = "dry" }, { wave = "noise" }]
filter = { type = "band12", cutoff = 3500, resonance = 0.3 }
level = -8
env = [{ attack = 0.0005, decay = 0.13, curve = 4, release = 0.02 }, { decay = 0.025, curve = 4 }]
mod = [["env2", "pitch", 10], ["velocity", "level", 8], ["velocity", "filter.cutoff", 1]]

[synths.drone]
osc = [
  { wave = "sine", octave = 1, semi = 1, mute = true },
  { wave = "triangle", fm = 3, fm_by = 1, unison = { voices = 3, detune = 12, spread = 1 } },
  { wave = "noise", level = -14 },
]
filter = { type = "comb", cutoff = 300, resonance = 0.6 }
filter2 = { type = "low12", cutoff = 900, resonance = 0.2 }
level = -14
env = [{ attack = 2.5, release = 4 }]
lfo = [{ shape = "smooth", rate = "7w", free = true }]
mod = [["note", "filter.cutoff", 1], ["lfo1", "osc2.fm", 2]]

[synths.wind]
osc = [{ wave = "noise" }]
filter = { type = "band12", cutoff = 650, resonance = 0.75 }
filter2 = { type = "band12", cutoff = 1900, resonance = 0.6 }
filters = "parallel"
level = -14
env = [{ attack = 3, release = 4 }]
lfo = [{ shape = "smooth", rate = "w", free = true }, { shape = "smooth", rate = "h.", free = true }]
mod = [["lfo1", "filter.cutoff", 1.1], ["lfo2", "filter2.cutoff", 1.1], ["lfo1", "pan", 0.7], ["lfo2", "level", 4]]

[synths.air]
osc = [{ wave = "noise" }]
filter = { type = "high12", cutoff = 7000 }
level = -22
env = [{ attack = 2, release = 4 }]
lfo = [{ shape = "smooth", rate = "2w", free = true }]
mod = [["lfo1", "level", 6]]

[synths.riser]
osc = [{ wave = "noise" }, { wave = "saw", octave = -1, level = -10, unison = { voices = 5, detune = 30, spread = 0.8 } }]
filter = { type = "band12", cutoff = 400, resonance = 0.5 }
level = -14
env = [{ attack = "note", attack_curve = -3, release = 0.05 }, { attack = "note", attack_curve = -2 }]
mod = [["env2", "filter.cutoff", 4.5], ["env2", "pitch", 12]]

[synths.fall]
osc = [{ wave = "noise" }, { wave = "saw", level = -12, unison = { voices = 5, detune = 30, spread = 0.8 } }]
filter = { type = "band12", cutoff = 400, resonance = 0.5 }
level = -16
env = [{ decay = "note", curve = 3 }, { decay = "note", curve = 2 }]
mod = [["env2", "filter.cutoff", 4.5], ["env2", "pitch", 12]]

# --- the returns: nothing under 400 Hz, wide ------------------------------------------------------------------

[buses.chop]
crush = { rate = 8000, bits = 8, wet = 0.5 }
filter = { highpass = 500, lowpass = 10000, q = 0 }
transient = { attack = 6, sustain = -3, length = 0.005 }
autopan = { steps = [-0.8, 0.5, -0.2, 0.9, -0.5], step = "s" }
