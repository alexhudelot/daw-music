# Rhizomorph: three and a half minutes of dark full-on psytrance, the first track made after Sporadic's verdict,
# on the DAW's newer parts: every sound but the ride, the clap and the crash programmed with the synth (F33), a
# sidechain keyed by the kick's sound (F32), automation moving the sounds themselves (F34), an atmosphere made
# for the space (F25: wind, a granular cloud, reversed crashes) and spaces of the DAW's own (F26: halls whose
# tails move, a shimmer, a freeze, a reverse reverb before each call, a tape echo). 145 BPM, on F.
#
# What it does that Sporadic didn't (songs/reviews/sporadic.toml):
# - one idea for each section, developed: the call (two bars, rests between its notes, an octave dive, a scoop
#   into the flat third, the sharp fourth leaning into the fifth, a bend down from the flat seventh) stated,
#   varied (rising to a two-octave dive), answered (by the acid in its rhythm), then taken apart (its first
#   gesture alone, again and again, into the echoes); the second drop answers it in B flat major (F, F, Bb, Bb)
# - builds of 16 and 8 bars: the snare roll from quarters to 32nds, a riser pitched up an octave, the echoes'
#   feedback running away, the mix thinning from below; the bass taken out, then the kick, then the halls frozen
#   on the last chord and a moment's silence before the drop
# - the bass gets out of the kick's way: a short kick (gone by 100 ms) and a sidechain keyed by its sound; the
#   bass's pluck lengthening over each section, its 16ths stopping at the ends of phrases, a gallop in drop 2
# - an atmosphere always there: wind through two wandering bands and a hiss, louder where the parts thin; the
#   call far off an octave down in its own hall and a cloud of grains; chords in a huge shimmering hall
# - fewer, longer sounds: open hats and a few closed ones, a sustained haze in the mids under the drops
#
#   1-8     the bed: wind, Fm7, Dbmaj7, Fm7 and Bbm9 in the shimmering hall, chirps far off, the call far off
#   9-24    the groove: the kick, hats from 13, the bass from 13 (its filter opening), claps, the acid and the
#           haze from 17, the call far off again from 21
#   25-40   the first build: the call teased under a closed filter; from 33 the roll, the riser and the pad;
#           the bass out from 35, the kick out from 39; the halls frozen in 40, then silence
#   41-72   the first drop: the call stated, varied, answered by the acid, taken apart (41-56); then with a
#           ride, the squeaks answering, the acid under it, the call running on into four bars (57-72)
#   73-80   the break: no kick, Dbmaj7, Bbm9, Eb, Eb7, Fsus4, F; the call slowed down on a whistle
#   81-88   the second build, into a freeze and a silence
#   89-120  the second drop: the bass galloping on F, F, Bb, Bb, half time every 8th bar; the call answered in
#           B flat major by the sync lead, which then doubles it an octave up (105-120)
#   121-128 the groove thinning out, the call far off, a tape stop
format = "daw-song 1"
title = "Rhizomorph"
publish = true
tempo = 145
meter = "4/4"
seed = 41

[instruments]
kick = { synth = "kick", gain = 4, bus = "punch" }
bass = { synth = "roll", gain = 1.5, bus = "bass" }
hat = { synth = "hat", base = "F6", gain = 4, pan = 0.2, bus = "drums" }
ohat = { synth = "ohat", base = "F6", gain = 2, pan = -0.1, bus = "drums" }
ride = { sound = "ride", gain = -12, pan = 0.3, bus = "drums", cut = true, release = 0.3 }
clap = { sound = "clap", gain = -10, bus = "drums" }
crash = { sound = "crash", gain = -15, bus = "drums" }
rcrash = { sound = "crash", gain = -13, bus = "drums", reverse = true }
impact = { sound = "impact", gain = -10 }
snare = { synth = "snare", base = "D3", bus = "roll" }
fillsn = { synth = "snare", base = "D3", gain = -6, bus = "drums" }
call = { synth = "call", gain = 3, bus = "call", glide = 0.05 }
rip = { synth = "rip", bus = "call", gain = 1, glide = 0.05 }
ripup = { synth = "rip", bus = "call", gain = -3, octave = 1, glide = 0.05 }
farcall = { synth = "call", bus = "far", octave = -1, glide = 0.05 }
acid = { synth = "acid", gain = -3.5, bus = "acid", glide = 0.06 }
chirp = { synth = "chirp", bus = "squeak" }
bloop = { synth = "bloop", bus = "squeak" }
haze = { synth = "haze", gain = -3, bus = "pads" }
pad = { synth = "pad", gain = -10, bus = "pads" }
whistle = { synth = "whistle", gain = -6, bus = "whistle", glide = 0.2, vibrato = { depth = 0.25, rate = 5, delay = 0.4 } }
wind = { synth = "wind", gain = 4, bus = "air" }
air = { synth = "air", bus = "air", gain = -8 }
riser = { synth = "riser", bus = "build" }
fall = { synth = "fall", bus = "build" }

# --- the drums ---------------------------------------------------------------------------------------------

# a sine swept down from 2 kHz to the note in two falls, saturated, with a click of noise; held 45 ms and gone
# by 95 ms, before the bass's first 16th (103 ms)
[synths.kick]
osc = [
  { wave = "sine", to = "dry" },
  { wave = "noise", level = -66 },
]
filter = { type = "high12", cutoff = 3000 }
shape = { drive = 3 }
level = -2.5
env = [
  { attack = 0.0006, hold = 0.045, decay = 0.05, curve = -1 },   # env1: the amp
  { decay = 0.03, curve = 6 },                                    # env2: the click's sweep
  { decay = 0.11, curve = 6 },                                    # env3: the body's
  { decay = 0.008 },                                              # env4: the click
]
mod = [
  ["env2", "pitch", 36],
  ["env3", "pitch", 30],
  ["env4", "osc2.level", 60],
  ["env3", "level", 2.5],
]

# a closed hat: noise and two pulses a tritone and some cents apart, through a high band; each a little
# different (its cutoff and level at random)
[synths.hat]
osc = [
  { wave = "noise", level = -5 },
  { wave = "pulse", width = 0.4, level = -6 },
  { wave = "pulse", width = 0.4, semi = 6, detune = 31, level = -8 },
  { wave = "pulse", width = 0.5, semi = 15, detune = -17, level = -9, fm = 1.5, fm_by = 2 },
]
filter = { type = "high24", cutoff = 7500, resonance = 0.25 }
level = -12
env = [{ attack = 0.0005, decay = 0.05, curve = 4, release = 0.01 }]
mod = [["random", "filter.cutoff", 0.25], ["random", "level", 1.5], ["velocity", "level", 6]]

# the open hat: the same, ringing for 200 ms
[synths.ohat]
osc = [
  { wave = "noise", level = -5 },
  { wave = "pulse", width = 0.4, level = -6 },
  { wave = "pulse", width = 0.4, semi = 6, detune = 31, level = -8 },
  { wave = "pulse", width = 0.5, semi = 15, detune = -17, level = -9, fm = 1.5, fm_by = 2 },
]
filter = { type = "high24", cutoff = 6500, resonance = 0.3 }
level = -12
env = [{ attack = 0.002, decay = 0.2, curve = 3, release = 0.02 }]
mod = [["random", "filter.cutoff", 0.2], ["velocity", "level", 6]]

# a snare: a triangle dropping into its note, and noise through a band
[synths.snare]
osc = [
  { wave = "triangle", level = -4, to = "dry" },
  { wave = "noise" },
]
filter = { type = "band12", cutoff = 3500, resonance = 0.3 }
level = -8
env = [
  { attack = 0.0005, decay = 0.13, curve = 4, release = 0.02 },
  { decay = 0.025, curve = 4 },
]
mod = [["env2", "pitch", 10], ["velocity", "level", 8], ["velocity", "filter.cutoff", 1]]

# --- the bass ----------------------------------------------------------------------------------------------

# two saws 14 cents apart through a lowpass following the note, plucked open, and a sine at the note past it,
# all saturated; an accent opens it further, and each note a little differently
[synths.roll]
osc = [
  { wave = "saw", detune = 7, level = -2.5 },
  { wave = "saw", detune = -7, level = -2.5, phase = 0.37 },
  { wave = "sine", level = -1.5, to = "dry" },
]
filter = { type = "low24", cutoff = 785, resonance = 0.3, drive = 4 }
shape = { drive = 5 }
env = [
  { attack = 0.0015, decay = 0.1, curve = -2, release = 0.012 },   # env1: the amp
  { decay = 0.09, curve = 2 },                                     # env2: the pluck, longer as sections go on
]
mod = [
  ["note", "filter.cutoff", 1],
  ["env2", "filter.cutoff", 3.6],
  ["velocity", "filter.cutoff", 1.2],
  ["random", "filter.cutoff", 0.15],
  ["env2", "pitch", 0.3],
]

# --- the call and its answers ------------------------------------------------------------------------------

# the call: two saws and a pulse through a vowel that opens and closes in each note ("wow"), folded at its
# start, a sine an octave down for weight; long notes chatter in 16ths
[synths.call]
osc = [
  { wave = "saw", detune = 7 },
  { wave = "saw", detune = -7, phase = 0.4 },
  { wave = "pulse", width = 0.25, octave = 1, level = -8 },
  { wave = "sine", octave = -1, level = -10, to = "dry" },
]
filter = { type = "formant", vowel = 3.6, resonance = 0.5 }
filter2 = { type = "low12", cutoff = 4500, resonance = 0.1 }
shape = { drive = 6, fold = 2, mix = 0.4 }
level = -4
env = [
  { attack = 0.003, decay = 0.4, sustain = 0.75, release = 0.06 },  # env1: the amp
  { attack = 0.04, decay = 0.22, curve = 2 },                       # env2: the vowel
  { decay = 0.08, curve = 4 },                                      # env3: the fold
]
lfo = [{ shape = "triangle", rate = "s", delay = 0.15, fade = 0.2 }]
mod = [
  ["env2", "filter.vowel", -3.6],
  ["lfo1", "filter.vowel", 0.4],
  ["velocity", "filter.cutoff", 0.5],
  ["env3", "shape.fold", 6],
  ["env3", "pitch", 0.5],
]

# the answer in drop 2, and its double an octave up: a saw hard-synced to one it can't hear, the sync's pitch
# falling over each note so its harmonics sweep, and a vibrato in it; a third saw for body
[synths.rip]
osc = [
  { wave = "saw", mute = true },
  { wave = "saw", sync = true, semi = 12 },
  { wave = "saw", detune = 9, level = -6 },
]
filter = { type = "low24", cutoff = 2500, resonance = 0.35, drive = 6 }
shape = { drive = 4 }
level = -10
env = [
  { attack = 0.004, decay = 0.3, sustain = 0.7, release = 0.05 },
  { decay = 0.3, curve = 2 },
]
lfo = [{ shape = "sine", rate = 5.5, delay = 0.2, fade = 0.2 }]
mod = [
  ["env2", "osc2.pitch", 14],
  ["lfo1", "osc2.pitch", 3],
  ["env2", "filter.cutoff", 1.5],
  ["note", "filter.cutoff", 0.5],
]

# the acid: a saw and a square through a resonant, driven lowpass, plucked open; accents open it and ring it
[synths.acid]
osc = [{ wave = "saw" }, { wave = "pulse", width = 0.5, level = -8, detune = 4 }]
filter = { type = "low24", cutoff = 320, resonance = 0.72, drive = 8 }
shape = { drive = 6, asym = 0.25 }
level = -8
env = [
  { attack = 0.002, decay = 0.25, sustain = 0.6, release = 0.02 },
  { decay = 0.14, curve = 3 },
]
mod = [
  ["env2", "filter.cutoff", 3.2],
  ["velocity", "filter.cutoff", 1.4],
  ["note", "filter.cutoff", 0.4],
  ["velocity", "filter.resonance", 0.12],
]

# a chirp: a sine moved by one at a ratio drawn for each note, falling an octave as its FM dies
[synths.chirp]
osc = [
  { wave = "sine", octave = 1, semi = 7, mute = true },
  { wave = "sine", fm = 2.5, fm_by = 1 },
]
filter = { type = "high12", cutoff = 300 }
level = -8
env = [
  { attack = 0.002, decay = 0.16, curve = 3, release = 0.03 },
  { decay = 0.09, curve = 3 },
]
mod = [
  ["env2", "pitch", 12],
  ["env2", "osc2.fm", 5],
  ["random", "pitch", 2],
  ["random", "osc1.pitch", 7],
]

# a bloop: rising a fifth, its FM wobbling
[synths.bloop]
osc = [
  { wave = "sine", octave = 1, mute = true },
  { wave = "sine", fm = 1.5, fm_by = 1 },
  { wave = "triangle", octave = -1, level = -8 },
]
filter = { type = "low12", cutoff = 2500, resonance = 0.5 }
level = -9
env = [
  { attack = 0.003, decay = 0.25, curve = 2, release = 0.05 },
  { attack = 0.12, attack_curve = -2 },
]
lfo = [{ shape = "sine", rate = 14 }]
mod = [
  ["env2", "pitch", 7],
  ["lfo1", "osc2.fm", 2],
  ["lfo1", "pitch", 0.4],
  ["env1", "filter.cutoff", 1.5],
]

# --- the mids and the space --------------------------------------------------------------------------------

# the haze under the drops: four saws spread wide and a breath of noise through a resonant band that wanders
[synths.haze]
osc = [
  { wave = "saw", unison = { voices = 4, detune = 22, spread = 0.5 } },
  { wave = "noise", level = -14 },
]
filter = { type = "band12", cutoff = 900, resonance = 0.45 }
level = -10
env = [{ attack = 0.8, release = 1.5 }]
lfo = [
  { shape = "smooth", rate = "w", free = true },
  { shape = "triangle", rate = "2w", free = true },
]
mod = [["lfo1", "filter.cutoff", 1.2], ["lfo2", "filter.resonance", 0.2], ["lfo2", "pan", 0.3]]

# the chords: five saws, a pulse an octave up and a sine an octave down, slowly opening and closing
[synths.pad]
osc = [
  { wave = "saw", unison = { voices = 5, detune = 16, spread = 0.9 } },
  { wave = "pulse", width = 0.35, octave = 1, level = -10, unison = { voices = 3, detune = 10, spread = 0.9 } },
  { wave = "sine", octave = -1, level = -10 },
]
filter = { type = "low12", cutoff = 1100, resonance = 0.15 }
level = -12
env = [{ attack = 1.5, release = 3 }]
lfo = [{ shape = "smooth", rate = "4w", free = true }]
mod = [["lfo1", "filter.cutoff", 0.7]]

# the break's whistle: a sine and a triangle, and breath through a band at the note
[synths.whistle]
osc = [
  { wave = "sine", to = "dry" },
  { wave = "triangle", octave = 1, level = -16, to = "dry" },
  { wave = "noise", level = -8 },
]
filter = { type = "band12", cutoff = 262, resonance = 0.7 }
level = -8
env = [{ attack = 0.08, decay = 0.4, sustain = 0.8, release = 0.4 }]
mod = [["note", "filter.cutoff", 1]]

# wind: noise through two resonant bands side by side, each wandering on a random LFO, the gusts panning
[synths.wind]
osc = [{ wave = "noise" }]
filter = { type = "band12", cutoff = 450, resonance = 0.75 }
filter2 = { type = "band12", cutoff = 1300, resonance = 0.6 }
filters = "parallel"
level = -8
env = [{ attack = 3, release = 4 }]
lfo = [
  { shape = "smooth", rate = "w", free = true },
  { shape = "smooth", rate = "h.", free = true },
]
mod = [
  ["lfo1", "filter.cutoff", 1.3],
  ["lfo2", "filter2.cutoff", 1.1],
  ["lfo1", "pan", 0.5],
  ["lfo2", "level", 4],
]

# a hiss at the top, breathing
[synths.air]
osc = [{ wave = "noise" }]
filter = { type = "high12", cutoff = 7000 }
level = -20
env = [{ attack = 2, release = 4 }]
lfo = [{ shape = "smooth", rate = "2w", free = true }]
mod = [["lfo1", "level", 6]]

# noise and a wide saw up a bandpass, both rising over the whole note
[synths.riser]
osc = [
  { wave = "noise" },
  { wave = "saw", octave = -1, level = -10, unison = { voices = 5, detune = 30, spread = 0.8 } },
]
filter = { type = "band12", cutoff = 300, resonance = 0.5 }
level = -10
env = [
  { attack = "note", attack_curve = -3, release = 0.05 },
  { attack = "note", attack_curve = -2 },
]
mod = [["env2", "filter.cutoff", 5], ["env2", "pitch", 12]]

# the same falling over its note
[synths.fall]
osc = [
  { wave = "noise" },
  { wave = "saw", level = -12, unison = { voices = 5, detune = 30, spread = 0.8 } },
]
filter = { type = "band12", cutoff = 300, resonance = 0.5 }
level = -12
env = [
  { decay = "note", curve = 3 },
  { decay = "note", curve = 2 },
]
mod = [["env2", "filter.cutoff", 5], ["env2", "pitch", 12]]

# --- the returns -------------------------------------------------------------------------------------------

[buses.room]                    # a small room for the drums
hall = { size = 0.6, decay = 0.8, damp = 0.45, predelay = 0.004, early = 0.9, highpass = 300, width = 0.5, wet = 1, dry = 0 }
eq = [{ hz = 450, gain = -3, q = 0.8 }, { type = "highshelf", hz = 6000, gain = -3 }]
sidechain = { by = "kick", threshold = -10, ratio = 2, release = 0.1 }

[buses.hall]                    # the leads' hall: long in the bed and the break, short in the drops
hall = { size = 1.8, decay = 3.5, damp = 0.5, predelay = 0.025, mod = 0.4, highpass = 400, width = 0.8, wet = 1, dry = 0 }
eq = [{ hz = 2800, gain = -2.5, q = 0.9 }, { type = "highshelf", hz = 5000, gain = -4 }]
stereo = { cross = [400], width = [0, 1.15] }
sidechain = { by = "kick", threshold = -12, ratio = 3, release = 0.15 }

[buses.space]                   # the atmosphere's: huge, shimmering, frozen at the builds' ends
hall = { size = 3.5, decay = 9, damp = 0.35, predelay = 0.05, early = 0.3, mod = 0.6, highpass = 450, shimmer = 0.25, width = 0.8, wet = 1, dry = 0 }
eq = [{ hz = 2800, gain = -3, q = 0.8 }, { type = "highshelf", hz = 4500, gain = -4 }]
stereo = { cross = [450], width = [0, 1.25] }
sidechain = { by = "kick", threshold = -15, ratio = 2, release = 0.25 }

[buses.echo]                    # a tape echo of dotted 8ths, wavering, each repeat darker; all wet
tape = { time = "e.", feedback = 0.45, wow = 0.35, flutter = 0.12, drive = 6, tone = 3000, lowcut = 300, wet = 1, dry = 0 }
stereo = { cross = [400], width = [0, 1.2] }
sidechain = { by = "kick", threshold = -12, ratio = 3, release = 0.12 }
send = { hall = 0.25 }

[buses.cloud]                   # grains of what is sent, some an octave or a fifth off, some backwards
filter = { highpass = 300 }
grains = { size = 0.09, density = 24, spread = 1.5, intervals = [0, 0, 12, 7, -12], pitch = 0.05, reverse = 0.35, feedback = 0.45, wet = 1 }
send = { space = 0.5 }

# --- the low end: in the middle, dry, out of the kick's way ------------------------------------------------

# the kick: its start sharpened, then clipped, so it holds less peak for its weight
[buses.punch]
transient = { attack = 3, length = 0.01 }
drive = { type = "clip", gain = 3, level = -3 }

# the bass: its pluck sharpened and its tail dried, through tape; its low mids out from under the call and
# the haze, its fundamental up
[buses.bass]
transient = { attack = 3, sustain = -3, length = 0.012 }
drive = { type = "tape", gain = 5, level = -3, asym = 0.15 }
eq = [{ hz = 90, gain = 2, q = 0.9 }, { hz = 320, gain = -3.5, q = 1.1 }]
width = { steps = [0] }
sidechain = { by = "kick", threshold = -35, ratio = 8, knee = 6, attack = 0.0005, release = 0.012 }

# --- the rest ----------------------------------------------------------------------------------------------

[buses.drums]                   # hats, ride, claps, crashes, fills: snappier, less boxy
transient = { attack = 5, sustain = -3, length = 0.008 }
filter = { highpass = 180 }
eq = [{ hz = 500, gain = -3, q = 1 }]
sidechain = { by = "kick", threshold = -8, ratio = 2, release = 0.08 }
send = { room = 0.25, hall = 0.06 }

[buses.roll]                    # the builds' snare roll
filter = { highpass = 200 }
send = { hall = 0.35, echo = 0.2 }

# the call: saturated, compressed, slowly flanged and doubled; a reverse reverb leading into each note; its
# lowpass closed in the builds' teases
[buses.call]
transient = { attack = 4, length = 0.015 }
drive = { type = "fold", gain = 2, level = -3, mix = 0.4 }
filter = { highpass = 220, lowpass = 12000, q = 0 }
eq = [{ hz = 450, gain = -2.5, q = 1 }, { hz = 2800, gain = 2, q = 0.9 }]
compressor = { threshold = -20, ratio = 3, attack = 0.004, release = 0.1 }
multiband = { depth = 0.35, output = -4 }
flanger = { delay = 0.003, depth = 0.002, rate = 0.08, feedback = 0.3, wet = 0.15 }
doubler = { delay = 0.011, depth = 0.0015, rate = 0.25, wet = 0.3 }
swell = { size = 1.2, decay = 0.8, wet = 0.35 }
sidechain = { by = "kick", threshold = -10, ratio = 2.5, release = 0.09 }
send = { echo = 0.2, hall = 0.35, cloud = 0.1 }

[buses.far]                     # the call far off: dark, mostly its own long hall, and grains of it
filter = { highpass = 200, lowpass = 1400, q = 0 }
hall = { size = 3, decay = 6, damp = 0.5, predelay = 0.06, mod = 0.6, wet = 1, dry = 0.25 }
send = { cloud = 0.6, echo = 0.2 }

[buses.acid]                    # to the left and right by 8ths; clipped, leant; out of the call's presence
drive = { type = "clip", gain = 8, level = -8, asym = 0.2 }
filter = { highpass = 120 }
eq = [{ hz = 280, gain = -3, q = 0.8 }, { hz = 2800, gain = -1.5, q = 1.2 }]
autopan = { steps = [-0.2, 0.15], step = "e", smooth = 0.02 }
sidechain = { by = "kick", threshold = -12, ratio = 3, release = 0.08 }
send = { echo = 0.25, hall = 0.15 }

[buses.squeak]                  # thrown about each 16th, into the echoes and the cloud
filter = { highpass = 400 }
autopan = { steps = [-0.5, 0.4, -0.2, 0.6, -0.6, 0.2], step = "s" }
sidechain = { by = "kick", threshold = -10, ratio = 2.5, release = 0.1 }
send = { echo = 0.4, hall = 0.3, cloud = 0.3 }

[buses.pads]                    # the haze and the chords, behind: darker, wide above the low mids, into the space
filter = { highpass = 150 }
eq = [{ hz = 300, gain = -3, q = 0.8 }, { hz = 2600, gain = -4, q = 0.7 }, { type = "highshelf", hz = 7000, gain = -3 }]
stereo = { cross = [300], width = [0.3, 1.3] }
chorus = { delay = 0.018, depth = 0.004, rate = 0.15, wet = 0.3 }
sidechain = { by = "kick", threshold = -15, ratio = 3, release = 0.18 }
send = { space = 0.5 }

[buses.whistle]
doubler = { delay = 0.013, depth = 0.002, rate = 0.2, wet = 0.5 }
send = { space = 0.8, echo = 0.35, cloud = 0.3 }

[buses.air]                     # wind and hiss: louder where the parts thin
filter = { highpass = 150 }
send = { space = 0.35 }

[buses.build]                   # the risers and falls, pitched up over the builds' ends
pitch = {}
filter = { highpass = 150 }
send = { hall = 0.4, echo = 0.15 }

# --- the master, in stages: a little saturation, a slow compressor, then the limiter -----------------------

[master]
drive = { gain = 2, level = -2 }
filter = { highpass = 25 }
stereo = { cross = [110], width = [0, 1] }
compressor = { threshold = -12, knee = 8, ratio = 1.6, attack = 0.03, release = 0.2 }
limiter = { ceiling = -0.3, release = 0.1 }
loudness = -8.8

[master.stutter.bars]
"40" = "xxxx xxxx xxxx xx.."
"56" = "xxxx xxxx xxxx rrRR"
"64" = "xxxx xxxx xxxx <<<<"
"72" = "xxxx xxxx vvvv vvvv"
"88" = "xxxx xxxx xxxx xx.."
"104" = "xxxx xxxx xxxx rrRR"
