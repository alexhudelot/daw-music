# DROP 2: zap's syncopated answer in each second bar: the mirror's head DISPLACED BY AN 8TH (16ths 3, 6, 9), then its last two (B flat, C6) on 13 and 15
[patterns.l2_sync]
zap = [
  "r w",
  "r e C6@0.85 e r s Eb5@0.76 e r s F5@0.81 e r e Bb5@0.78 e C6@0.81 e",
  "r w",
  "r e C6@0.85 e r s Eb5@0.76 e r s F5@0.81 e r e Bb5@0.78 e C6@0.81 e",
  "r w",
  "r e C6@0.85 e r s Eb5@0.76 e r s F5@0.81 e r e Bb5@0.78 e C6@0.81 e",
  "r w",
  "r e C6@0.85 e r s Eb5@0.76 e r s F5@0.81 e r e Bb5@0.78 e C6@0.81 e",
]

# CALL AND ANSWER on the sequence: its head (C5 G5 A flat 5); the fourth cell its DIMINUTION
[patterns.l1_callc]
glint = [
  "C5@0.80 e. G5@0.86 e. Ab5<-2%0.05!0.3@0.95 q Ab5~ s r q r s",
  "r w",
  "C5@0.80 e. G5@0.86 e. Ab5<-2%0.05!0.3@0.95 q Ab5~ s r q r s",
  "r w",
  "C5@0.80 e. G5@0.86 e. Ab5<-2%0.05!0.3@0.95 q Ab5~ s r q r s",
  "r w",
  "C5@0.80 s G5@0.86 e Ab5<-2%0.05!0.3@0.85 s C5@0.80 s G5@0.86 e Ab5<-2%0.05!0.3@0.95 q Ab5~ s r q",
  "r w",
]

# CALL AND ANSWER on the sequence: zap's mirror TRUNCATED before its last note, left hanging on the leaning B flat
[patterns.l2_ansc]
zap = [
  "r w",
  "C6@0.90 e r s Eb5@0.80 e r s F5@0.85 e r e. Ab5@0.65 s Bb5@0.85 e r e",
  "r w",
  "C6@0.90 e r s Eb5@0.80 e r s F5@0.85 e r e. Ab5@0.65 s Bb5@0.85 e r e",
  "r w",
  "C6@0.90 e r s Eb5@0.80 e r s F5@0.85 e r e. Ab5@0.65 s Bb5@0.85 e r e",
  "r w",
  "C6@0.90 e r s Eb5@0.80 e r s F5@0.85 e r e. Ab5@0.65 s Bb5@0.85 e r e",
]

# INVERSION OF THE LAST INTERVAL on the sequence: D flat up to E flat, so each cell ends open, asking; the fourth cell in straight 8ths
[patterns.l1_inv]
glint = [
  "C5@0.80 e. G5@0.86 e. Ab5<-2%0.05!0.3@0.95 q Ab5~ s Eb5@0.62 s Db5@0.80 e Eb5@0.80 e",
  "r w",
  "C5@0.80 e. G5@0.86 e. Ab5<-2%0.05!0.3@0.95 q Ab5~ s Eb5@0.62 s Db5@0.80 e Eb5@0.80 e",
  "r w",
  "C5@0.80 e. G5@0.86 e. Ab5<-2%0.05!0.3@0.95 q Ab5~ s Eb5@0.62 s Db5@0.80 e Eb5@0.80 e",
  "r w",
  "C5@0.80 e G5@0.86 q Ab5<-2%0.05!0.3@0.95 e Eb5@0.62 e Db5@0.80 e Eb5@0.80 q",
  "r w",
]

# INVERSION OF THE LAST INTERVAL on the answer: the mirror closes down (B flat to A flat) where the call ended open
[patterns.l2_inv]
zap = [
  "r w",
  "C6@0.85 e r s Eb5@0.76 e r s F5@0.81 e r e. Ab5@0.62 s Bb5@0.78 e Ab5@0.76 e",
  "r w",
  "C6@0.85 e r s Eb5@0.76 e r s F5@0.81 e r e. Ab5@0.62 s Bb5@0.78 e Ab5@0.76 e",
