# zap: light downsampling first, then the second and third stages of saturation (the bus's tanh rounds the crushed
# steps, then a fast compressor), the
# tutorials' high-pass and low-pass; placed to the side and swaying round the listener (automation), so the answer comes
# from somewhere else than the call
[buses.l2]
order = ["crush", "drive"]
drive = { type = "tanh", gain = 9, level = -8 }
crush = { rate = 11000, bits = 12, wet = 0.3 }
filter = { highpass = 220, lowpass = 9500, q = 0 }
eq = [{ hz = 450, gain = -2, q = 0.8 }, { hz = 2200, gain = 0.5, q = 0.8 }, { type = "highshelf", hz = 6000, gain = -2 }]
compressor = { threshold = -16, ratio = 6, attack = 0.0005, release = 0.03, knee = 2 }
place = { azimuth = 30, elevation = 8, distance = 1.2, room = 0.12 }
sidechain = { by = "kbody", threshold = -20, ratio = 2, release = 0.05 }
send = { l2e = 0.42, lhall = 0.28 }

# the chops: placed, jumping from side to side (automation)
[buses.chop]
filter = { highpass = 250, lowpass = 12000, q = 0 }
place = { azimuth = 0, distance = 1, room = 0.15 }
send = { l2e = 0.2, room = 0.1 }

# --- the returns -------------------------------------------------------------------------------------------------------

[buses.room]
hall = { size = 0.6, decay = 0.7, damp = 0.45, predelay = 0.004, early = 0.9, highpass = 400, width = 1, wet = 1, dry = 0 }
stereo = { cross = [500], width = [0.6, 1.3] }

# glint's echoes: diffused, the left a dotted 8th, the right a quarter, dark, wavering, smeared into a wash, then the hall;
# the return widened above 600 Hz (the core stays near the middle, the echoes go out to the sides)
[buses.l1e]
echoes = { left = "e.", right = "q", cross = 0.15, lowpass = 3800, highpass = 400, diffusion = 0.2, depth = 1, rate = 0.3, feedback = 0.36, wet = 1, dry = 0 }
stereo = { cross = [600], width = [0.8, 2.2] }
sidechain = { by = "kbody", threshold = -22, ratio = 3, release = 0.08 }
send = { lhall = 0.2 }

# zap's echoes: the tutorials' dotted 8th, crossing side to side as a ping-pong does, band-passed in the loop
[buses.l2e]
echoes = { left = "e.", right = "q.", cross = 0.55, lowpass = 4500, highpass = 450, diffusion = 0.3, depth = 1.5, rate = 0.4, feedback = 0.4, wet = 1, dry = 0 }
sidechain = { by = "kbody", threshold = -22, ratio = 3, release = 0.08 }
send = { lhall = 0.3 }

[buses.lhall]
hall = { size = 2.4, decay = 3.8, damp = 0.5, predelay = 0.02, early = 0.3, mod = 0.5, highpass = 350, width = 1, wet = 1, dry = 0 }
eq = [{ type = "highshelf", hz = 6000, gain = -3 }]
stereo = { cross = [500], width = [0.8, 1.4] }

[buses.vast]
hall = { size = 3.4, decay = 6, damp = 0.42, predelay = 0.05, early = 0.25, mod = 0.6, highpass = 180, shimmer = 0.12, width = 1, wet = 1, dry = 0 }
eq = [{ hz = 2800, gain = -2, q = 0.8 }, { type = "highshelf", hz = 6000, gain = -2 }]
stereo = { cross = [300], width = [0.5, 1.4] }
sidechain = { by = "kbody", threshold = -24, ratio = 2.5, release = 0.12 }

[master]
gain = -7
drive = { type = "tanh", gain = 0, level = 0, oversample = 4 }
eq = [{ hz = 350, gain = -0.8, q = 0.8 }, { type = "highshelf", hz = 9500, gain = 1.2 }]
