# "Sastrugi": the hard ridges the wind carves in snow, all leaning one way. Drum and bass, the DAW's fourth, 174 BPM, 176
# bars, about four minutes. A liquid roller that leans neuro in its drops: one chord field (F minor 9) struck in a rhythm,
# an eight-bar bass loop that re-colours it, and one six-note motif developed by rule, a leap up and a falling line,
# every lead phrase a named transformation of it, answered from above by a squelch that plays it turned over. Every sound
# is made here; the glitches are our own sounds resampled and cut in the spectral editor.
#
# Written out by songs/samples/sastrugi/make.py, which holds the motif, its transformations and the three candidates.
#
#   1-8      the field alone, dark, struck in the motif's rhythm; wind far off, coming nearer
#   9-16     the hint: the motif's leap alone, two notes (TRUNCATION), quiet and filtered; the break's top
#   17-24    half-time; the bass loop's upper voice, no sub; 24 the tail reversed
#   25-32    the head DISPLACED BY AN 8TH, the filter opening; 16th hats, snare 8ths, 16ths, 32nds; 32 the master stutter
#   33-48    DROP 1: the sub at last; the motif STATED, EXACT REPETITION; at 42 and 46 the zap's two-note hint of its
#            answer; the tail's stuttered echo at 48. In every drop the fourth cell of each eight bars is varied
#            (EXTENSION, DIMINUTION of the head, straight 8ths, the contour lifted), so a phrase runs eight bars
#   49-56    CALL AND ANSWER: glint the head, zap (the squelch) the motif's MIRROR an octave above; the shaker
#   57-64    RHYTHMIC DISPLACEMENT BY A 16TH, the answer with it; shuffled 16th hats, the ride
#   65-72    EXACT REPETITION, zap the mirror's climb (TRUNCATION); 71-72 SEGUE 1: the bold fill, toms crossing, the glitch
#   73-80    BREAKDOWN: no drums, no sub. The epic pad; its top voice the motif's AUGMENTATION, four times as long
#   81-88    CALL AND ANSWER, augmented by two
#   89-96    half-time, the bass loop's upper voice back; zap's syncopated head, DISPLACED BY AN 8TH
#   97-104   the build: the head once a bar, then the sequence's head; 103-104 SEGUE 2: the fill, the glitch, zap alone
#   105-120  DROP 2: the SEQUENCE TO C with its contour changed, higher; zap's syncopated answers; the drums lean, then up
#            at 113 with the bass's drive
#   121-128  CALL AND ANSWER on the sequence; the ride; two bars of half-time at 125
#   129-136  INVERSION OF THE LAST INTERVAL: the call ends open, the answer closes; the most ghosts, ratchets; the last
#            two beats of 136 a drop-out, no drums, sub or growl
#   137-144  THE CLIMAX: the SEQUENCE TO E FLAT three times, B flat 5 its high point, then lifted to C6; zap above it;
#            the epic pad back, its top voice holding the high point; the second kick; the leads drier
#   145-152  HOME: the motif as stated, the answers; 152 the tape stop
#   153-168  no sub; the drums leave by layers; the hint again, closing
#   169-176  the field alone, softer each time; the last chord without its 9, the wind going far away
format = "daw-song 1"
title = "Sastrugi"
publish = true
tempo = 174
meter = "4/4"
seed = 1741
humanise = 1.2

[instruments]
kbody = { synth = "kbody", base = "Ab1", bus = "kick" }
kclick = { synth = "kclick", base = "Ab1", bus = "kick" }
sbody = { synth = "sbody", base = "G3", bus = "snare" }
snoise = { synth = "snoise", base = "G3", bus = "snare" }
sclap = { sound = "clap", gain = -19, bus = "snare" }
ghost = { synth = "ghost", base = "G3", bus = "brk" }
rim = { synth = "rim", base = "C5", bus = "brk", pan = 0.18 }
hat = { synth = "hat", base = "C6", bus = "hats", pan = -0.15 }
hatl = { synth = "hat", base = "C6", bus = "late", pan = 0.2 }
ohat = { synth = "ohat", base = "C6", bus = "hats", pan = -0.1 }
shk = { synth = "shk", base = "C6", bus = "shkb" }
ride = { sound = "ride", gain = -24, pan = 0.25, bus = "hats", cut = true, release = 0.3 }
tom = { sound = "tom", gain = -9, bus = "toms" }
sub = { synth = "sub", bus = "sub", glide = 0.1, glide_curve = 3 }
growl = { synth = "growl", bus = "mid", glide = 0.09, glide_curve = 2 }
field = { synth = "field", bus = "field" }
aurora = { synth = "aurora", bus = "aurora" }
auratop = { synth = "aurora", bus = "aurora", gain = 8, glide = 0.2, glide_curve = 3, legato = true }
wind = { synth = "wind", bus = "atmos" }
riser = { synth = "riser", bus = "rise" }
rcrash = { sound = "crash", gain = -14, bus = "fx", reverse = true, cut = true, release = 0.01 }
crash = { sound = "crash", gain = -17, bus = "fx" }
impact = { sound = "impact", gain = -12, bus = "fx" }
glint = { synth = "glint", bus = "l1", glide = 0.05, glide_curve = 3 }
zap = { synth = "zap", bus = "l2", glide = 0.04, glide_curve = 3 }
chC = { sample = "samples/sastrugi/tailc.flac", base = "C4", bus = "chop", cut = true, release = 0.004, gain = -3 }
chR = { sample = "samples/sastrugi/tail.flac", base = "C4", bus = "chop", reverse = true, cut = true, release = 0.01, gain = -4 }
chF = { sample = "samples/sastrugi/fillb.flac", base = "C4", bus = "chop", cut = true, release = 0.004, gain = -4 }
chP = { sample = "samples/sastrugi/padc.flac", base = "C4", bus = "chop", cut = true, release = 0.006, gain = -4 }
chPr = { sample = "samples/sastrugi/padc.flac", base = "C4", bus = "aurora", reverse = true, cut = true, release = 0.01, gain = -2 }

# --- drums: every hit is two or three layers -------------------------------------------------------------------------

# the kick's body: a sine falling from two and a half octaves up onto A flat 1 in 30 ms, a second, slower fall of 9
# semitones under it (the knock), held 50 ms, gone in 0.25 s
[synths.kbody]
osc = [{ wave = "sine", to = "dry" }, { wave = "sine", octave = 1, level = -20, to = "dry" }]
shape = { drive = 4, asym = 0.1 }
env = [{ attack = 0.0005, hold = 0.05, decay = 0.2, curve = 2.5, release = 0.01 }, { decay = 0.028, curve = 5 }, { decay = 0.11, curve = 2 }]
mod = [["env2", "pitch", 30], ["env3", "pitch", 9], ["velocity", "level", 4], ["random", "pitch", 0.2]]
level = -1

# its click: noise and a high triangle through a band-pass, 14 ms
[synths.kclick]
osc = [{ wave = "noise" }, { wave = "triangle", octave = 3, level = -6 }]
filter = { type = "band12", cutoff = 3600, resonance = 0.3 }
filter2 = { type = "high12", cutoff = 1200 }
env = [{ attack = 0.0002, decay = 0.014, curve = 4, release = 0.003 }]
mod = [["velocity", "level", 6], ["random", "filter.cutoff", 0.2]]
level = -13

# the snare's body: a triangle and a fifth over it, tuned to G 3, knocked down 9 semitones in 25 ms
[synths.sbody]
osc = [{ wave = "triangle", to = "dry" }, { wave = "sine", semi = 7, level = -9, to = "dry" }]
shape = { drive = 5, asym = 0.1 }
env = [{ attack = 0.0003, decay = 0.11, curve = 4, release = 0.01 }, { decay = 0.025, curve = 3 }]
mod = [["env2", "pitch", 9], ["velocity", "level", 6], ["random", "pitch", 0.3]]
level = -14

# its crack: noise through a band-pass at 3 kHz, opening at the hit, 0.2 s
[synths.snoise]
osc = [{ wave = "noise" }]
filter = { type = "band12", cutoff = 3000, resonance = 0.12 }
filter2 = { type = "high12", cutoff = 800 }
shape = { drive = 4 }
env = [{ attack = 0.0004, decay = 0.2, curve = 4, release = 0.02 }, { decay = 0.04, curve = 3 }]
mod = [["env2", "filter.cutoff", 0.8], ["random", "filter.cutoff", 0.2], ["random", "level", 1], ["velocity", "level", 8]]
level = -12

# the ghost: the snare touched, darker, shorter, falling away fast as the touch lightens (14 dB of velocity)
[synths.ghost]
osc = [{ wave = "noise" }, { wave = "triangle", octave = 1, level = -14, to = "dry" }]
filter = { type = "band12", cutoff = 3400, resonance = 0.2 }
filter2 = { type = "high12", cutoff = 1000 }
env = [{ attack = 0.0008, decay = 0.07, curve = 4, release = 0.01 }, { decay = 0.02 }]
mod = [["env2", "pitch", 5], ["random", "filter.cutoff", 0.35], ["random", "level", 2], ["velocity", "filter.cutoff", 1], ["velocity", "level", 14]]
level = -8

[synths.rim]
osc = [{ wave = "triangle" }, { wave = "pulse", semi = 7, level = -8 }]
filter = { type = "band12", cutoff = 1800, resonance = 0.55 }
env = [{ attack = 0.0003, decay = 0.035, curve = 4, release = 0.005 }]
mod = [["random", "filter.cutoff", 0.15], ["random", "level", 3], ["velocity", "level", 8]]
level = -14

[synths.hat]
osc = [{ wave = "noise", level = -5 }, { wave = "pulse", width = 0.4, level = -6 }, { wave = "pulse", width = 0.4, semi = 6, detune = 31, level = -8 }, { wave = "pulse", width = 0.5, semi = 15, detune = -17, level = -9, fm = 1.5, fm_by = 2 }]
filter = { type = "high24", cutoff = 7600, resonance = 0.22 }
env = [{ attack = 0.0005, decay = 0.042, curve = 4, release = 0.01 }]
mod = [["random", "filter.cutoff", 0.25], ["random", "level", 1.5], ["velocity", "level", 9], ["velocity", "filter.cutoff", -0.4]]
level = -14

[synths.ohat]
osc = [{ wave = "noise", level = -5 }, { wave = "pulse", width = 0.4, level = -6 }, { wave = "pulse", width = 0.4, semi = 6, detune = 31, level = -8 }, { wave = "pulse", width = 0.5, semi = 15, detune = -17, level = -9, fm = 1.5, fm_by = 2 }]
filter = { type = "high24", cutoff = 6300, resonance = 0.28 }
env = [{ attack = 0.002, decay = 0.19, curve = 3, release = 0.02 }]
mod = [["random", "filter.cutoff", 0.2], ["velocity", "level", 6]]
level = -17

[synths.shk]
osc = [{ wave = "noise" }]
filter = { type = "band12", cutoff = 8500, resonance = 0.4 }
env = [{ attack = 0.006, attack_curve = -2, decay = 0.03, curve = 3, release = 0.006 }]
mod = [["random", "filter.cutoff", 0.3], ["velocity", "level", 9]]
level = -19


# --- the low end ------------------------------------------------------------------------------------------------------

# the sub: two sines, a little drive; it carries the loop and never moves in timbre
[synths.sub]
osc = [{ wave = "sine" }, { wave = "sine", octave = 1, level = -18 }]
shape = { drive = 3, asym = 0.1 }
env = [{ attack = 0.004, release = 0.04 }]
level = -4.5

# the growl, the loop an octave up: two saws and a pulse an octave under them, through a driven low-pass that plucks at
# each note, then a formant. Its timbre is stepped: seq1 moves the cutoff and seq2 the vowel on every 16th, counted from
# the song's start, so each step of the bar has its own colour, the same each time round. Drift on the oscillators and
# the cutoff, a fold in the shaper; the fold grows over the song by automation.
[synths.growl]
osc = [{ wave = "saw", detune = -7 }, { wave = "saw", detune = 7, phase = 0.3 }, { wave = "pulse", width = 0.35, octave = -1, level = -6 }]
drift = { pitch = 5, rate = 0.4, cutoff = 0.12 }
filter = { type = "low24", cutoff = 420, resonance = 0.36, drive = 10 }
filter2 = { type = "formant", vowel = 0.5, resonance = 0.4 }
shape = { drive = 6, fold = 2, asym = 0.15, mix = 0.6 }
env = [{ attack = 0.003, release = 0.03 }, { attack = 0.002, decay = 0.13, curve = 3 }]
seq = [{ steps = [0, 0.9, 0.3, 1.2, 0.1, 0.7, 1.4, 0.2, 0.5, 0, 1.0, 0.4, 0.8, 0.2, 1.3, 0.6], step = "s", glide = 0.012, free = true }, { steps = [0, 2.5, 1, 3.5, 0.5, 2, 3, 1.5], step = "s", glide = 0.02, free = true }]
mod = [["env2", "filter.cutoff", 1.6], ["seq1", "filter.cutoff", 1.0], ["seq2", "filter2.vowel", 1], ["velocity", "filter.cutoff", 0.6], ["velocity", "level", 3]]
level = -9


# --- the field: the chord struck in a rhythm (on the motif's 1 and 11 and the next bar's 7), falling 10 dB in about
# 1.5 s to a quarter. Pulses in spread voices, a quiet saw and a triangle under it, dark; weight at 150-550 Hz
[synths.field]
osc = [{ wave = "pulse", width = 0.45, unison = { voices = 3, detune = 9, spread = 0.6 } }, { wave = "saw", detune = 6, level = -11 }, { wave = "triangle", octave = -1, level = -9 }]
drift = { pitch = 4, rate = 0.25, cutoff = 0.1 }
filter = { type = "low24", cutoff = 650, resonance = 0.12, drive = 2 }
env = [{ attack = 0.006, decay = 1.7, sustain = 0.28, curve = 2, release = 0.9 }, { attack = 0.01, decay = 1.0, curve = 2 }]
mod = [["env2", "filter.cutoff", 1.1], ["velocity", "filter.cutoff", 0.7], ["velocity", "level", 4]]
level = -17

# the epic pad, for the breakdown only: hollow pulses in five wide voices and three saws, filtered at 1.5 kHz and
# breathing on two bars, a sine under it; it swells in over 1.2 s. Its top voice sings the motif augmented.
[synths.aurora]
osc = [{ wave = "pulse", width = 0.38, unison = { voices = 5, detune = 16, spread = 0.8 } }, { wave = "saw", level = -10, unison = { voices = 3, detune = 11, spread = 0.8 } }, { wave = "sine", octave = -1, level = -11 }]
drift = { pitch = 6, rate = 0.2, cutoff = 0.15 }
filter = { type = "low24", cutoff = 3000, resonance = 0.12 }
env = [{ attack = 1.2, attack_curve = -1, decay = 2, sustain = 0.8, release = 2.5 }]
lfo = [{ shape = "smooth", rate = "2w", free = true }]
mod = [["lfo1", "filter.cutoff", 0.35], ["note", "filter.cutoff", 0.3]]
level = -32

# wind: noise through two resonant band-passes side by side, each wandering
[synths.wind]
osc = [{ wave = "noise" }]
filter = { type = "band12", cutoff = 450, resonance = 0.75 }
filter2 = { type = "band12", cutoff = 1500, resonance = 0.6 }
filters = "parallel"
env = [{ attack = 3, release = 4 }]
lfo = [{ shape = "smooth", rate = "w", free = true }, { shape = "smooth", rate = "h.", free = true }]
mod = [["lfo1", "filter.cutoff", 1.3], ["lfo2", "filter2.cutoff", 1.1], ["lfo1", "pan", 0.5], ["lfo2", "level", 4]]
level = -26

# a riser: noise through a band-pass opening four octaves over its note
[synths.riser]
osc = [{ wave = "noise" }, { wave = "saw", unison = { voices = 3, detune = 20, spread = 0.9 }, level = -16 }]
filter = { type = "band12", cutoff = 400, resonance = 0.45 }
env = [{ attack = "note", attack_curve = -2, release = 0.25 }, { attack = "note", attack_curve = -2 }]
mod = [["env2", "filter.cutoff", 4], ["env2", "pitch", 12]]
level = -22


# --- the leads ---------------------------------------------------------------------------------------------------------

# glint, the theme's voice, in the approved "lead fixes" direction: a triangle, a narrow pulse in three voices barely
# spread, and a sine past the filter; a dry core near mono, the width from the echoes and the hall. A keytracked
# low-pass at about the 4th to 6th harmonic, its pluck shutting in 85 ms, no shaper after it, so nothing buzzes.
# seq1 is its per-step timbre: counted from the song's start, the 16ths where the hook syncopates (4 and 7, and the
# pickup at 12) open the filter more than the others. Drift on the pitch and the cutoff; a vibrato that waits. The
# pluck's depth scaled by the velocity (a fourth element on the route): the soft notes open less, the accents more.
[synths.glint]
osc = [{ wave = "triangle" }, { wave = "pulse", width = 0.3, detune = 5, level = -5, unison = { voices = 3, detune = 8, spread = 0.15 } }, { wave = "sine", level = -6, to = "dry" }]
drift = { pitch = 4, rate = 0.35, cutoff = 0.1 }
filter = { type = "low24", cutoff = 1050, resonance = 0.3, drive = 2 }
env = [{ attack = 0.004, decay = 0.45, sustain = 0.62, release = 0.28 }, { attack = 0.006, decay = 0.055, curve = 3 }]
lfo = [{ shape = "sine", rate = 5.2, delay = 0.25, fade = 0.25 }]
seq = [{ steps = [0.2, 0, 0, 0.7, 0, 0, 0.9, 0, 0.1, 0, 0.3, 0.6, 0.4, 0, 0.1, 0], step = "s", glide = 0.01, free = true }]
mod = [["env2", "filter.cutoff", 0.6], ["env2", "filter.cutoff", 0.8, "velocity"], ["note", "filter.cutoff", 0.8], ["seq1", "filter.cutoff", 0.8], ["velocity", "filter.cutoff", 0.6], ["velocity", "level", 5], ["lfo1", "pitch", 0.12]]
level = -15

# zap, the answering voice: the tutorials' squelch. One saw (and a quiet triangle past the filter for the note's body)
# through a 24 dB band-pass; env2 throws the pitch 17 semitones up and lets it fall onto the note in about 60 ms, and
# the same envelope dips the cutoff 1.3 octaves the other way (inverted). Saturation in three stages: the filter's
# drive before it, the shaper after it, a tanh on the bus; light downsampling on the bus. Its timbre is stepped:
# seq1 the band-pass's centre and seq2 its resonance, a value a 16th; and each note's cutoff is shifted at random,
# and the zap's length jumps every 16th (automation), so no two hits are the same. The pitch throw is 9 semitones
# and up to 14 more, a height of its own each note (`random+`), so the swoop from above is never twice the same.
[synths.zap]
osc = [{ wave = "saw" }, { wave = "triangle", level = -9, to = "dry" }]
drift = { pitch = 3, rate = 0.3, cutoff = 0.15 }
filter = { type = "band24", cutoff = 1300, resonance = 0.28, drive = 8 }
shape = { drive = 5, asym = 0.12, mix = 0.5 }
env = [{ attack = 0.0015, hold = 0.05, decay = 0.14, sustain = 0.4, curve = 3, release = 0.06 }, { decay = 0.06, curve = 4 }]
seq = [{ steps = [0, 0.5, -0.3, 0.8, 0.2, -0.2, 0.9, 0, 0.4, -0.4, 0.6, 0.1, 0.7, -0.1, 0.3, 0.5], step = "s", glide = 0.008, free = true }, { steps = [0, 0.15, 0.05, 0.22], step = "s", free = true }]
mod = [["env2", "pitch", 9], ["env2", "pitch", 14, "random+"], ["env2", "filter.cutoff", -1.3], ["seq1", "filter.cutoff", 0.7], ["seq2", "filter.resonance", 1], ["random", "filter.cutoff", 0.3], ["note", "filter.cutoff", 0.5], ["velocity", "filter.cutoff", 0.5], ["velocity", "level", 5]]
level = -7.5


# --- drums -------------------------------------------------------------------------------------------------------------

[buses.kick]
transient = { attack = 4, sustain = -2, length = 0.008 }
drive = { type = "clip", gain = 2.5, level = -2, oversample = 4 }
eq = [{ hz = 60, gain = 1.5, q = 1 }, { hz = 300, gain = -2.5, q = 1.2 }, { hz = 3500, gain = 1.5, q = 1 }]
width = { steps = [0] }

[buses.snare]
stutter = { bars = { "103" = "xxxx xxxx xxxx rrRR", "120" = "xxxx xxxx rrrr RRRR" } }
filter = { highpass = 120 }
transient = { attack = 3, sustain = -3, length = 0.01 }
drive = { type = "clip", gain = 2, level = -1.5, oversample = 4 }
eq = [{ hz = 200, gain = 1.5, q = 1.4 }, { hz = 2500, gain = 2, q = 0.8 }, { type = "highshelf", hz = 7000, gain = 1.5 }]
hall = { size = 0.5, decay = 0.6, damp = 0.35, predelay = 0.004, early = 0.8, highpass = 1200, width = 1, wet = 0.1, dry = 1 }
send = { room = 0.1 }

[buses.brk]
stutter = { bars = { "128" = "xxxx xxxx xxxx rrRR" } }
filter = { highpass = 300 }
eq = [{ type = "highshelf", hz = 6000, gain = 2 }]
stereo = { cross = [2500], width = [0.9, 1.4] }
send = { room = 0.16 }

[buses.hats]
filter = { highpass = 450 }
eq = [{ type = "highshelf", hz = 11000, gain = -1 }]
stereo = { cross = [3000], width = [1.1, 1.6] }
send = { room = 0.06 }

# the off 16ths, 11 ms late: the shuffle
[buses.late]
filter = { highpass = 450 }
delay = { time = 0.011, feedback = 0, wet = 1, dry = 0 }
stereo = { cross = [3000], width = [1.1, 1.6] }
send = { room = 0.06 }

[buses.shkb]
filter = { highpass = 3000 }
autopan = { steps = [-0.3, 0.55, -0.55, 0.3, -0.45, 0.45], step = "s" }
send = { room = 0.1 }

# the toms, placed: their azimuth swept across each bold fill (automation)
[buses.toms]
transient = { attack = 3, sustain = -2, length = 0.01 }
filter = { highpass = 70 }
place = { azimuth = 0, distance = 1.4, room = 0.3 }
send = { room = 0.18 }

# --- the low end -------------------------------------------------------------------------------------------------------

[buses.sub]
drive = { type = "tape", gain = 2.5, level = -2, asym = 0.12, oversample = 2 }
filter = { lowpass = 180, highpass = 26, q = 0 }
width = { steps = [0] }
sidechain = { by = "kbody", threshold = -26, ratio = 8, knee = 4, attack = 0.001, release = 0.09 }

[buses.mid]
stutter = { bars = { "64" = "xxxx xxxx xxxx rrRR", "144" = "xxxx xxxx xxxx vvvv" } }
filter = { highpass = 110, lowpass = 7000, q = 0 }
drive = { type = "tape", gain = 4, level = -3, asym = 0.15, oversample = 2 }
eq = [{ hz = 400, gain = -2, q = 1 }, { hz = 900, gain = -1.5, q = 1 }]
multiband = { cross = [250, 2500], depth = 0.3 }
stereo = { cross = [260], width = [0, 1.25] }
sidechain = { by = "kbody", threshold = -24, ratio = 4, attack = 0.001, release = 0.07 }
send = { room = 0.03 }

# --- pads and air ------------------------------------------------------------------------------------------------------

[buses.field]
stutter = { bars = { "168" = "xxxx xxxx <<<< <<<<" } }
filter = { highpass = 140, lowpass = 2600, q = 0 }
eq = [{ hz = 240, gain = 1, q = 0.9 }]
stereo = { cross = [320], width = [0.5, 1.15] }
sidechain = { by = "kbody", threshold = -24, ratio = 2, release = 0.15 }
send = { vast = 0.28, room = 0.05 }

# the epic pad: led in by its own reverb backwards (swell), chorused, its top half widened, into the big hall
[buses.aurora]
filter = { highpass = 150, lowpass = 9000, q = 0 }
eq = [{ hz = 350, gain = -1.5, q = 0.8 }, { type = "highshelf", hz = 5000, gain = -2 }]
chorus = { delay = 0.018, depth = 0.003, rate = 0.4, wet = 0.2 }
swell = { size = 1.8, decay = 3, damp = 0.4, wet = 0.7 }
stereo = { cross = [400], width = [0.8, 1.2] }
send = { vast = 0.45 }

# the wind, placed far off and circling slowly; it comes nearer through the intro (automation)
[buses.atmos]
filter = { highpass = 250 }
place = { azimuth = -40, elevation = 15, distance = 8, orbit = 0.03, radius = 3, room = 0.6 }
send = { vast = 0.3 }

[buses.rise]
filter = { highpass = 300 }
place = { azimuth = 0, distance = 0, orbit = 0.45, radius = 1.4, room = 0.3, doppler = 0.4 }
send = { vast = 0.3 }

[buses.fx]
filter = { highpass = 180 }
send = { vast = 0.25 }

# --- the leads ---------------------------------------------------------------------------------------------------------

# glint: a dry core near mono (width 0.7); its low-pass closes it in the intro and outro (automation); the width comes
# from the echoes (dotted 8th left, quarter right) and the hall
[buses.l1]
stutter = { bars = { "151" = "xxxx xxrr rrRR ...." } }
filter = { highpass = 280, lowpass = 9500, q = 0 }
eq = [{ hz = 450, gain = -1.5, q = 0.9 }, { hz = 2200, gain = 1.5, q = 0.8 }, { type = "highshelf", hz = 7500, gain = -1.5 }]
sidechain = { by = "kbody", threshold = -20, ratio = 1.6, release = 0.06 }
