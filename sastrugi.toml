  "C5@0.80 e. G5@0.86 e. Ab5<-2%0.05!0.3@0.95 q Ab5~ s Eb5@0.62 s Db5@0.80 e C5@0.72 e",
  "r w",
  "C5@0.80 e G5@0.86 q Ab5<-2%0.05!0.3@0.95 e Eb5@0.62 e Db5@0.80 e C5@0.72 q",
  "r w",
