chP = "C4@0.8 s r s C4@0.7 s C4@0.6 s r s Eb4@0.7 s C4@0.6 s r h r s"

# GLITCH: the pad chop in 16ths over the bar's last beat, stepping up the field
[patterns.ch_pad]
chP = "r h. C4@0.7 s Eb4@0.7 s G4@0.75 s C5@0.8 s"

