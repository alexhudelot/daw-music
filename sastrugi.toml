  "C6@0.85 e r s Eb5@0.76 e r s F5@0.81 e r e. Ab5@0.62 s Bb5@0.78 e Ab5@0.76 e",
  "r w",
  "C6@0.85 e r s Eb5@0.76 e r s F5@0.81 e r e. Ab5@0.62 s Bb5@0.78 e Ab5@0.76 e",
]

# THE CLIMAX: SEQUENCE TO E FLAT in three cells, B flat 5 its high point; the fourth its contour lifted to C6, the glint's highest note
[patterns.l1_climax]
glint = [
  "Eb5@0.85 e. Bb5<-3%0.07!0.35@1.00 e. Ab5@0.88 q Ab5~ s F5@0.66 s Db5@0.82 e Eb5@0.80 e",
