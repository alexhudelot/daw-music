  "G4^1800 e. G5>-12^3500 s r e Bb4<-3^1200 e r s C5^1500 s Db5>-1^2600 e. r e.",
  "G4^1400 s G4^900 r G5>-5^3000 e r s Bb5^2600 s r C6^3000 e. Db6^3400 s D6>-24^3600 q",
  "r w",
  "r w",
]
grit = [
  "G4^2400 e. G5>-12^3000 s r e Bb4<-3^1600 e r s C5^1800 s Db5>-1^2800 e. r e.",
  "G4^2000 s G4^1200 r G5>-5^3000 e r s Bb5^2800 s r C6^3000 e. Db6^3400 s D6>-24^3600 q",
  "r w",
  "r w",
