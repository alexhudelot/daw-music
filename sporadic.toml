# --- the call and its answers ----------------------------------------------------------------------------
# The call: G, the octave leap diving back, Bb scooped up into, C, and the flat fifth bent down; then G twice,
# the octave leap falling a fourth, and down F, Eb, D to the flat fifth, diving an octave.

[patterns.call]                 # the call and the acid's answer, the motif in a new rhythm, over G, G, Bb, C
lead = [
  "G4^1800 e. G5>-12^3500 s r e Bb4<-3^1200 e r s C5^1500 s Db5>-1^2600 e. r e.",
  "G4^1400 s G4^900 r G5>-5^3000 e r s F5^2200 s r Eb5^1800 e. D5^1300 s Db5>-12^2400 q",
  "r w",
  "r w",
]
grit = [
  "G4^2400 e. G5>-12^3000 s r e Bb4<-3^1600 e r s C5^1800 s Db5>-1^2800 e. r e.",
  "G4^2000 s G4^1200 r G5>-5^3000 e r s F5^2400 s r Eb5^2000 e. D5^1600 s Db5>-12^2600 q",
  "r w",
  "r w",
]
bite = [
  "G4 e. G5>-12 s r e Bb4<-3 e r s C5 s Db5>-1 e. r e.",
  "G4 s G4 r G5>-5 e r s F5 s r Eb5 e. D5 s Db5>-12 q",
  "r w",
  "r w",
]
acid = [
  "r w",
  "r w",
  "r e G3^500 s G3^800 Bb3~^1600 e r s C4^700 e. Db4~^1900 e C4^900 s r e.",
  "G4^2200 s r G3^600 e r s F3^500 s G3^900 e Bb3^1400 s r e C4~^2000 e Bb3^1100 e r s",
]

