rvs = { sample = "samples/halocline/sx.flac", base = "C4", gain = -8, bus = "brk", reverse = true, cut = true, release = 0.005 }
kick = { synth = "kick", gain = -5, bus = "punch" }
snare = { synth = "snare", gain = -8, bus = "crack" }
hat = { synth = "hat", gain = -20, pan = 0.28, bus = "top", base = "C7" }
tick = { synth = "tick", gain = -18, pan = -0.3, bus = "tick", base = "C5" }
sub = { synth = "sub", gain = -7, bus = "sub", glide = 0.05 }
reese = { synth = "reese", gain = -19, bus = "reese", glide = 0.09 }
boom = { synth = "boom", gain = -8, bus = "sub" }
pad = { synth = "pad", gain = -22, bus = "pads" }
glass = { synth = "glass", gain = -24, bus = "pads" }
stepped = { synth = "glass", gain = -17, bus = "stepped", octave = 1 }
strings = { synth = "strings", gain = -19, bus = "strings" }
keys = { synth = "keys", gain = -17, bus = "keys" }
lead = { synth = "keys", gain = -14, bus = "lead", vibrato = { depth = 0.06, rate = 4.4, delay = 0.5 } }
bell = { synth = "bell", gain = -20, bus = "bell" }
vox = { synth = "vox", gain = -17, bus = "vox", glide = 0.22, legato = false }
sea = { synth = "sea", gain = -19, bus = "sea" }
swirl = { synth = "swirl", gain = -21, bus = "swirl" }
rain = { synth = "rain", gain = -24, bus = "rain" }
wind = { synth = "wind", gain = -26, bus = "wind" }
drip = { synth = "drip", gain = -22, bus = "drip" }
riser = { synth = "riser", gain = -18, bus = "fx" }

# --- drums on top of the chopped break -----------------------------------------------------------------------------

# a short, round punch: the break's own kick has the room, this has the weight
[synths.kick]
osc = [{ wave = "sine", to = "dry" }, { wave = "noise", level = -62 }]
filter = { type = "band12", cutoff = 3400, resonance = 0.2 }
shape = { drive = 3, asym = 0.08 }
env = [
  { attack = 0.0004, hold = 0.035, decay = 0.1, curve = 3, release = 0.006 },
  { decay = 0.005 },
  { decay = 0.05, curve = 6 },
  { decay = 0.005 },
]
mod = [["env2", "pitch", 14], ["env3", "pitch", 24], ["env4", "osc2.level", 52], ["random", "pitch", 0.25], ["velocity", "level", 3]]

# the crack: a thin shell at 196 Hz and tight noise, dry, placed by the transient shaper; the break gives the room
[synths.snare]
osc = [{ wave = "triangle", to = "dry", level = -9 }, { wave = "sine", octave = 1, semi = 2, to = "dry", level = -16 }, { wave = "noise", level = 0 }]
filter = { type = "band12", cutoff = 3800, resonance = 0.1 }
filter2 = { type = "high12", cutoff = 1300 }
shape = { drive = 7, asym = 0.1 }
env = [
  { attack = 0.0003, decay = 0.17, curve = 5, release = 0.008 },
  { decay = 0.05, curve = 3 },
  { decay = 0.016 },
]
mod = [["env2", "osc1.level", 9], ["env3", "pitch", 6], ["random", "filter.cutoff", 0.25], ["random", "pitch", 0.35], ["random", "level", 1], ["velocity", "filter.cutoff", 0.6]]

# a dry hat for the top of the groove, moving against the break's own
[synths.hat]
osc = [{ wave = "pulse", width = 0.3 }, { wave = "pulse", semi = 13, detune = 27, width = 0.4, level = -3 }, { wave = "noise", level = -4 }]
filter = { type = "high24", cutoff = 8200, resonance = 0.12 }
filter2 = { type = "low12", cutoff = 16000 }
env = [{ attack = 0.0005, decay = 0.038, curve = 5, release = 0.005 }]
mod = [["random", "filter.cutoff", 0.3], ["random", "level", 3], ["velocity", "level", 6]]

# a soft tick, off the centre, far back: the small movement of a 90s techno loop
[synths.tick]
osc = [{ wave = "sine", octave = 2 }, { wave = "noise", level = -10 }]
filter = { type = "band12", cutoff = 2600, resonance = 0.55 }
env = [{ attack = 0.0005, decay = 0.028, curve = 4, release = 0.005 }, { decay = 0.012 }]
mod = [["env2", "pitch", 11], ["random", "filter.cutoff", 0.5], ["random", "pan", 0.25], ["random", "level", 3]]

# --- the low end ----------------------------------------------------------------------------------------------------

# a sine with a little of its octave, rounded by an even-harmonic clip. It never moves in timbre: the reese does that.
[synths.sub]
osc = [{ wave = "sine" }, { wave = "sine", octave = 1, level = -20 }, { wave = "triangle", level = -22 }]
shape = { drive = 2.5, asym = 0.12 }
env = [{ attack = 0.007, release = 0.05 }]

# two saws beating slowly and a pulse an octave up, through a lowpass that drifts; all above the sub, none of it the sub
[synths.reese]
osc = [
  { wave = "saw", detune = 9 },
  { wave = "saw", detune = -11, phase = 0.4 },
  { wave = "pulse", octave = 1, width = 0.35, level = -9, detune = 4 },
  { wave = "triangle", level = -10, fm = 0.0, fm_by = 1 },
]
filter = { type = "low24", cutoff = 520, resonance = 0.28, drive = 7 }
filter2 = { type = "notch12", cutoff = 900, resonance = 0.35 }
shape = { drive = 4, asym = 0.2 }
env = [{ attack = 0.03, release = 0.09 }, { decay = 0.35, curve = 3 }]
lfo = [{ shape = "smooth", rate = "3w", free = true }, { shape = "sine", rate = "5w", free = true }]
mod = [
  ["lfo1", "filter.cutoff", 0.6], ["env2", "filter.cutoff", 0.9], ["lfo2", "filter2.cutoff", 1.3],
  ["lfo2", "osc1.detune", 5], ["lfo1", "osc3.width", 0.2], ["random", "filter.cutoff", 0.2], ["velocity", "filter.cutoff", 0.5],
]

# a sine falling three octaves: the weight under a re-entry
[synths.boom]
osc = [{ wave = "sine" }, { wave = "sine", octave = 1, level = -18 }]
shape = { drive = 3 }
env = [{ attack = 0.001, decay = "note", curve = 1.5, release = 0.05 }, { decay = "note", curve = 5 }]
mod = [["env2", "pitch", 26]]

# --- the harmony ----------------------------------------------------------------------------------------------------

# the long pad: slowly beating saws and a triangle above, closed down, breathing. Its attack is longer than a bar.
[synths.pad]
osc = [
  { wave = "saw", detune = -8 },
  { wave = "saw", detune = 7, phase = 0.3 },
  { wave = "saw", detune = 15, phase = 0.7, level = -5 },
  { wave = "triangle", octave = 1, level = -8 },
]
filter = { type = "low24", cutoff = 950, resonance = 0.14 }
env = [{ attack = 2.4, attack_curve = -1, release = 3.5 }]
lfo = [{ shape = "smooth", rate = "7w", free = true }, { shape = "sine", rate = "11w", free = true }]
mod = [["lfo1", "filter.cutoff", 0.55], ["lfo2", "osc4.level", 3], ["random", "filter.cutoff", 0.25], ["note", "filter.cutoff", 0.4]]
level = -6

# a hollow, glassy layer: FM sines, the index wandering, shimmer not brightness. The stepped filter works on this one.
[synths.glass]
osc = [
  { wave = "sine", semi = 12, mute = true },
  { wave = "sine", fm = 1.4, fm_by = 1 },
  { wave = "sine", semi = 19, detune = 5, mute = true },
  { wave = "sine", detune = -4, fm = 0.9, fm_by = 3 },
]
env = [{ attack = 0.9, release = 2.6 }, { attack = 3, decay = 5, sustain = 0.25 }]
lfo = [{ shape = "smooth", rate = "5w", free = true }, { shape = "sine", rate = 0.17, free = true }]
mod = [["env2", "osc2.fm", 1.6], ["lfo1", "osc4.fm", 1.1], ["lfo2", "level", 1.5]]
level = -8

# strings: only in the openings. Slight vibrato per voice, a rosin of noise.
[synths.strings]
osc = [
  { wave = "saw", detune = -6 },
  { wave = "saw", detune = 6, phase = 0.6 },
  { wave = "saw", detune = 13, phase = 0.2, level = -4 },
  { wave = "noise", level = -34 },
]
filter = { type = "low12", cutoff = 3200, resonance = 0.1 }
filter2 = { type = "high12", cutoff = 330 }
env = [{ attack = 1.6, attack_curve = -1, release = 2.8 }]
lfo = [{ shape = "sine", rate = 4.6, fade = 1.6 }, { shape = "smooth", rate = "3w", free = true }]
mod = [["lfo1", "pitch", 0.09], ["lfo2", "filter.cutoff", 0.4], ["random", "pitch", 0.05], ["note", "filter.cutoff", 0.3]]
level = -10

# electric piano: a tine and a bar by FM, the brightness dying as a struck tine does; a tremolo that widens as it rings
[synths.keys]
osc = [
  { wave = "sine", mute = true },
  { wave = "sine", fm = 1.8, fm_by = 1 },
  { wave = "sine", octave = 3, semi = 7, mute = true },
  { wave = "sine", octave = 1, fm = 1.2, fm_by = 3, level = -14 },
]
shape = { drive = 2, asym = 0.15 }
env = [{ attack = 0.002, decay = 3.2, curve = 3.5, release = 0.5 }, { decay = 0.7, curve = 3 }, { decay = 0.09, curve = 4 }]
lfo = [{ shape = "sine", rate = 3.1, delay = 0.2, fade = 0.8 }, { shape = "sine", rate = 0.21, free = true }]
mod = [["env2", "osc2.fm", 2.2], ["env3", "osc4.level", 10], ["lfo1", "level", 1.2], ["velocity", "osc2.fm", 1.6], ["lfo2", "pitch", 0.05], ["random", "osc2.fm", 0.3]]
level = -5

# a far bell: inharmonic and soft, for the sequence
[synths.bell]
osc = [
  { wave = "sine", semi = 21, detune = 7, mute = true },
  { wave = "sine", fm = 1.1, fm_by = 1 },
  { wave = "triangle", octave = 2, level = -24 },
]
filter = { type = "low12", cutoff = 5200, resonance = 0.1 }
env = [{ attack = 0.002, decay = 1.3, curve = 4, release = 0.4 }, { decay = 0.22, curve = 3 }]
mod = [["env2", "osc2.fm", 2.4], ["velocity", "osc2.fm", 1.5], ["random", "pan", 0.5], ["random", "filter.cutoff", 0.35]]
level = -6

# a voice that isn't one: a saw and a narrow pulse through vowels that move, a breath in it, a slow human vibrato
[synths.vox]
osc = [{ wave = "saw" }, { wave = "pulse", width = 0.2, level = -7, detune = 5 }, { wave = "noise", level = -24 }]
filter = { type = "formant", vowel = 3, resonance = 0.55 }
filter2 = { type = "low12", cutoff = 3400 }
env = [{ attack = 0.28, attack_curve = -1, release = 0.9 }, { attack = 1.5, decay = 2, sustain = 0.3 }]
lfo = [{ shape = "sine", rate = 4.9, delay = 0.5, fade = 0.7 }, { shape = "smooth", rate = 0.33 }]
mod = [["lfo1", "pitch", 0.16], ["env2", "filter.vowel", -2.2], ["lfo2", "filter.vowel", 0.6], ["env2", "filter2.cutoff", 0.7], ["random", "filter.vowel", 0.5]]
level = -6

# the swirl above everything: a resonant band sweeping over detuned saws, nearly all reverb by the time it's heard
[synths.swirl]
osc = [{ wave = "saw", detune = -14 }, { wave = "saw", detune = 12, phase = 0.5 }, { wave = "pulse", octave = 1, width = 0.15, level = -6 }]
filter = { type = "band12", cutoff = 3200, resonance = 0.72 }
filter2 = { type = "high12", cutoff = 1500 }
env = [{ attack = 1.2, release = 3 }]
lfo = [{ shape = "smooth", rate = "e3", free = true }, { shape = "sine", rate = "7w", free = true }]
mod = [["lfo1", "filter.cutoff", 1.1], ["lfo2", "filter.cutoff", 0.9], ["lfo2", "filter.resonance", 0.1]]
level = -12

# the singing water, the track's own sound: noise through a comb tuned to the note, so air becomes pitch as the comb's
# feedback rises (automated over the whole track, from hiss with a tone in it to something near a bowed string)
[synths.sea]
osc = [{ wave = "noise" }, { wave = "noise", level = -6 }]
filter = { type = "comb", cutoff = 261.6, resonance = 0.9 }
filter2 = { type = "low12", cutoff = 2600, resonance = 0.1 }
env = [{ attack = 3.2, attack_curve = -1, release = 4 }]
lfo = [{ shape = "smooth", rate = "5w", free = true }, { shape = "smooth", rate = "w", free = true }]
mod = [["note", "filter.cutoff", 1], ["lfo1", "filter2.cutoff", 0.9], ["lfo2", "level", 3], ["random", "filter2.cutoff", 0.4]]
level = -12

# --- weather --------------------------------------------------------------------------------------------------------

[synths.rain]
osc = [{ wave = "noise" }, { wave = "noise", level = -3 }]
filter = { type = "band12", cutoff = 4800, resonance = 0.14 }
filter2 = { type = "high12", cutoff = 1700 }
env = [{ attack = 4, release = 6 }]
lfo = [{ shape = "smooth", rate = "9w", free = true }, { shape = "smooth", rate = "2w", free = true }]
mod = [["lfo1", "filter.cutoff", 0.5], ["lfo2", "level", 1.5], ["lfo1", "level", 2]]
level = -12

[synths.wind]
osc = [{ wave = "noise" }]
filter = { type = "band12", cutoff = 420, resonance = 0.72 }
filter2 = { type = "band12", cutoff = 1150, resonance = 0.62 }
filters = "parallel"
env = [{ attack = 5, release = 7 }]
lfo = [{ shape = "smooth", rate = "3w", free = true }, { shape = "smooth", rate = "2w", free = true }]
mod = [["lfo1", "filter.cutoff", 1.2], ["lfo2", "filter2.cutoff", 1.0], ["lfo2", "level", 4]]
level = -10

# single drops: a sine falling a little, at a random pitch and place
[synths.drip]
osc = [{ wave = "sine" }]
env = [{ attack = 0.0005, decay = 0.05, curve = 4, release = 0.01 }, { decay = 0.04, curve = 3 }]
mod = [["env2", "pitch", 9], ["random", "pitch", 9], ["random", "pan", 0.9], ["random", "level", 8]]

# --- movement between sections ----------------------------------------------------------------------------------------

[synths.riser]
osc = [{ wave = "noise" }, { wave = "saw", octave = -1, level = -22 }]
filter = { type = "band12", cutoff = 500, resonance = 0.42 }
filter2 = { type = "high12", cutoff = 300 }
env = [{ attack = "note", attack_curve = -3, release = 0.02 }, { attack = "note", attack_curve = -2 }]
mod = [["env2", "filter.cutoff", 4], ["env2", "pitch", 12]]
level = -8

# --- the one shared space; rooms and echoes sit on the buses that use them -------------------------------

[buses.vast]                    # the far water: pads, voice and swirl mostly live here
hall = { size = 3.8, decay = 9, damp = 0.35, predelay = 0.07, early = 0.2, mod = 0.65, highpass = 170, shimmer = 0.08, width = 1, wet = 1, dry = 0 }
eq = [{ hz = 320, gain = -2, q = 0.8 }, { hz = 2900, gain = -2, q = 0.8 }, { type = "highshelf", hz = 7000, gain = -2 }]
stereo = { cross = [350], width = [0.5, 1.45] }
duck = { by = "kick", depth = -1.5, hold = 0.01, release = 0.16 }

# --- drums ------------------------------------------------------------------------------------------------------------

[buses.brk]                     # the chopped break: its lows cleared for the kick and the sub
filter = { highpass = 150, q = 0 }
eq = [{ hz = 420, gain = -2.5, q = 1 }, { hz = 2600, gain = -0.5, q = 0.7 }, { type = "highshelf", hz = 9000, gain = -1 }]
transient = { attack = 2, sustain = -1, length = 0.012 }
compressor = { threshold = -16, knee = 8, ratio = 2.2, attack = 0.008, release = 0.1 }
stereo = { cross = [3500], width = [0.9, 1.25] }
hall = { size = 0.55, decay = 0.65, damp = 0.5, predelay = 0.004, early = 0.8, highpass = 350, width = 1, wet = 0.14, dry = 1 }
send = { vast = 0.025 }

[buses.punch]
transient = { attack = 3, sustain = 0, length = 0.006 }
drive = { type = "tape", gain = 2.5, level = -2 }
width = { steps = [0] }

[buses.crack]
transient = { attack = 3, sustain = -3, length = 0.01 }
filter = { highpass = 150 }
eq = [{ hz = 210, gain = 1.5, q = 1.4 }, { hz = 3300, gain = 0.5, q = 0.9 }]
hall = { size = 0.55, decay = 0.65, damp = 0.5, predelay = 0.004, early = 0.8, highpass = 350, width = 1, wet = 0.32, dry = 1 }
send = { vast = 0.05 }

[buses.top]
filter = { highpass = 2500 }
eq = [{ type = "highshelf", hz = 11000, gain = -2 }]
autopan = { steps = [0.3, 0.1, -0.1, 0.25, -0.2, 0.05, 0.3, -0.25], step = "s", smooth = 0.02 }

[buses.tick]
filter = { highpass = 900, lowpass = 7000, q = 0 }
send = { vast = 0.08 }

# --- the low end ------------------------------------------------------------------------------------------------------

[buses.sub]                     # mono, warm, clear of the kick and just under the snare's start
drive = { type = "tape", gain = 2.5, level = -2, asym = 0.15 }
filter = { lowpass = 700, highpass = 28, q = 0 }
width = { steps = [0] }
duck = { by = "kick", depth = -9, hold = 0.012, release = 0.055 }

[buses.reese]                   # the sub's movement, all above 190 Hz, wide above 400
filter = { highpass = 190, lowpass = 3400, q = 0 }
drive = { type = "tape", gain = 5, level = -5, asym = 0.2 }
eq = [{ hz = 750, gain = -4, q = 0.7 }]
