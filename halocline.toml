a14 = { sample = "samples/halocline/a14.flac", base = "C4", gain = -2, bus = "brk", cut = true, release = 0.006 }
a15 = { sample = "samples/halocline/a15.flac", base = "C4", gain = -2, bus = "brk", cut = true, release = 0.006 }
a16 = { sample = "samples/halocline/a16.flac", base = "C4", gain = -2, bus = "brk", cut = true, release = 0.006 }
b01 = { sample = "samples/halocline/b01.flac", base = "C4", gain = -2, bus = "brk", cut = true, release = 0.006 }
b02 = { sample = "samples/halocline/b02.flac", base = "C4", gain = -2, bus = "brk", cut = true, release = 0.006 }
b03 = { sample = "samples/halocline/b03.flac", base = "C4", gain = -2, bus = "brk", cut = true, release = 0.006 }
b04 = { sample = "samples/halocline/b04.flac", base = "C4", gain = -2, bus = "brk", cut = true, release = 0.006 }
b05 = { sample = "samples/halocline/b05.flac", base = "C4", gain = -2, bus = "brk", cut = true, release = 0.006 }
b06 = { sample = "samples/halocline/b06.flac", base = "C4", gain = -2, bus = "brk", cut = true, release = 0.006 }
b07 = { sample = "samples/halocline/b07.flac", base = "C4", gain = -2, bus = "brk", cut = true, release = 0.006 }
b08 = { sample = "samples/halocline/b08.flac", base = "C4", gain = -2, bus = "brk", cut = true, release = 0.006 }
b09 = { sample = "samples/halocline/b09.flac", base = "C4", gain = -2, bus = "brk", cut = true, release = 0.006 }
b10 = { sample = "samples/halocline/b10.flac", base = "C4", gain = -2, bus = "brk", cut = true, release = 0.006 }
b11 = { sample = "samples/halocline/b11.flac", base = "C4", gain = -2, bus = "brk", cut = true, release = 0.006 }
b12 = { sample = "samples/halocline/b12.flac", base = "C4", gain = -2, bus = "brk", cut = true, release = 0.006 }
b13 = { sample = "samples/halocline/b13.flac", base = "C4", gain = -2, bus = "brk", cut = true, release = 0.006 }
b14 = { sample = "samples/halocline/b14.flac", base = "C4", gain = -2, bus = "brk", cut = true, release = 0.006 }
b15 = { sample = "samples/halocline/b15.flac", base = "C4", gain = -2, bus = "brk", cut = true, release = 0.006 }
b16 = { sample = "samples/halocline/b16.flac", base = "C4", gain = -2, bus = "brk", cut = true, release = 0.006 }
