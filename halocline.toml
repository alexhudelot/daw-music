# "Halocline": the layer in a sea where the salt changes sharply; below it, the water is another water.
#
# Atmospheric drum and bass, the DAW's first: 170 BPM, 336 bars. Written from a study of arcologies (refs/arcology.toml), with none of
# their notes, progressions or sections taken from a track. Every sound is synthesised here. The drums are a break played by a
# small synthesised kit in a synthesised room (samples/halocline/breaks.toml), rendered and cut into beats, then chopped bar
# by bar with a kick and a crack layered on the hits that matter. Written out by samples/halocline/make.py.
#
#   1-32     rain and wind; the singing water and a far chord opening under them; drops, the first far voice
#   33-64    the long chords of theme A; from 49 the break's top alone, under a highpass, coming nearer
#   65-80    the break and the kick, the chords; no bass yet
#   81-128   the sub; keys from 97; a tick and more hats from 113
#   129-136  a mini breakdown: the drums thin to hats, the sub alone in the middle
#   137-168  first opening: drums gone, the sub gone from 153; strings, a voice, the whole space opening
#   169-184  the strip-back: drums and sub alone, rain again: the room cleared
#   185-216  theme B: the broken break, chords cut by a stepped filter, the reese under them
#   217-224  the bass out, only break and chords, for eight bars
#   225-248  theme B's second half: bell sequence, the swirl, melody
#   249-280  second opening, the largest: strings and keys and voice, no drums; the sub returns for its second half
#   281-320  last run: theme A against the breaks of both themes, everything held
#   321-336  out: the break's top, then rain, and the last chord in the space
format = "daw-song 1"
title = "Halocline"
publish = true
tempo = 170
meter = "4/4"
seed = 2718
humanise = 1.6

[instruments]
a01 = { sample = "samples/halocline/a01.flac", base = "C4", gain = -2, bus = "brk", cut = true, release = 0.006 }
a02 = { sample = "samples/halocline/a02.flac", base = "C4", gain = -2, bus = "brk", cut = true, release = 0.006 }
a03 = { sample = "samples/halocline/a03.flac", base = "C4", gain = -2, bus = "brk", cut = true, release = 0.006 }
a04 = { sample = "samples/halocline/a04.flac", base = "C4", gain = -2, bus = "brk", cut = true, release = 0.006 }
a05 = { sample = "samples/halocline/a05.flac", base = "C4", gain = -2, bus = "brk", cut = true, release = 0.006 }
a06 = { sample = "samples/halocline/a06.flac", base = "C4", gain = -2, bus = "brk", cut = true, release = 0.006 }
a07 = { sample = "samples/halocline/a07.flac", base = "C4", gain = -2, bus = "brk", cut = true, release = 0.006 }
a08 = { sample = "samples/halocline/a08.flac", base = "C4", gain = -2, bus = "brk", cut = true, release = 0.006 }
a09 = { sample = "samples/halocline/a09.flac", base = "C4", gain = -2, bus = "brk", cut = true, release = 0.006 }
a10 = { sample = "samples/halocline/a10.flac", base = "C4", gain = -2, bus = "brk", cut = true, release = 0.006 }
