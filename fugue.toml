# Black Spore Fugue: 30 seconds of dark psytrance after Infected Mushroom's first records, "Classical
# Mushroom" (2000) and "B.P. Empire" (2001). 145 BPM, in A: the bass on A with its flat second (Bb) as their
# drops have it, and A minor's classical cadence (Am, Dm, E, a diminished seventh) for the harpsichord.
# Built on the DAW's own sounds (crates/daw-engine/src/psy.rs).
#
# What it takes from those records, rather than from goa: no sung hook. The melody is a baroque figure in
# 16ths on a harpsichord, through a minor-key progression with a lament's chromatic turns; the mids are a
# metallic FM sequence whose five-note cell runs against the bar's twelve off-kick 16ths (so it never repeats
# the same way twice in four bars), its filter on a three-step cycle, ring-modulated and crushed; an acid line
# crawls in the low mids with slides and the tritone; an eerie singing lead wails a semitone either side of a
# note and dives, and another squiggles a minor third either way; gates leave holes in every layer; and the
# whole mix is cut up at phrase ends: 32nd and 64th repeats, a beat played backwards, tape stops
# ([master.stutter]).
#
#   1-2   the harpsichord alone (Am, Dm) and the wail; the mix stutters into
#   3-6   the groove on an A pedal: kick, rolling bass, the FM sequence, the acid, clicks, data glitches
#   7-10  the classical drop: the bass follows Am, Dm, E, Am, the harpsichord over it; a tape stop into
#   11-12 the break: no kick or bass; the harpsichord in 8ths, the wail diving two octaves
#   13-16 the main drop: the progression again with everything, the figure doubled an octave up, screams
#   17-18 the pedal and the acid, cut up, and a tape stop to silence
format = "daw-song 1"
title = "Black Spore Fugue"
publish = true
tempo = 145
meter = "4/4"
seed = 13

[instruments]
kick = { sound = "psykick", gain = 0 }      # played on E1, under the bass's A: deeper than its own G1
bass = { sound = "psybass", gain = 2, bus = "bass", dive = -1 }
chat = { sound = "chat", gain = -10, pan = 0.2, bus = "hats" }
ohat = { sound = "ohat", gain = -13, pan = -0.2, bus = "hats" }
clap = { sound = "clap", gain = -13, bus = "drums" }
metal = { sound = "metal", gain = -24, bus = "metal", cut = true, release = 0.02, filter = { lowpass = 1500, q = 3, env = 1.2, decay = 0.04 } }
acid = { sound = "squelch", gain = -22, bus = "acid", cut = true, release = 0.02, glide = 0.05, filter = { lowpass = 800, q = 3, env = 1.5, decay = 0.07 } }
harpsi = { sound = "harpsi", gain = -20, bus = "harpsi" }
harp8 = { sound = "harpsi", gain = -24, octave = 1, pan = 0.3, bus = "harpsi" }
eerie = { sound = "eerie", gain = -20, bus = "eerie", cut = true, release = 0.08, glide = 0.22, vibrato = { depth = 0.3, rate = 5.5, delay = 0.4 } }
squig = { sound = "eerie", gain = -23, bus = "eerie", cut = true, release = 0.05, vibrato = { depth = 4, rate = 4.833, delay = 0 } }   # a minor third either way, twice a beat
data = { sound = "data", gain = -25, bus = "glitch" }
zap = { sound = "zap", gain = -19, bus = "fx" }
yoy = { sound = "yoy", gain = -17, bus = "fx" }
gurgle = { sound = "gurgle", gain = -17, bus = "fx" }
uplift = { sound = "uplift", gain = -17, bus = "sweeps" }
downlift = { sound = "downlift", gain = -17, bus = "sweeps" }
impact = { sound = "impact", gain = -9 }

[buses.bass]                    # tight: the gate shuts the second half of each 16th
drive = { gain = 5, level = -2 }
filter = { lowpass = 380, q = 0 }
gate = { steps = "x.x.x.x. x.x.x.x. x.x.x.x. x.x.x.x.", step = "t" }
width = { steps = [0] }
duck = { by = "kick", depth = -14, release = 0.09 }

[buses.hats]
filter = { highpass = 600 }
width = { steps = [1.6, 0.4, 1.6, 1.0] }

[buses.drums]
reverb = { size = 0.5, decay = 4, damp = 0.6, wet = 0.07, dry = 1 }

# The FM sequence: ring-modulated against a C#, crushed to 6 bits at 12 kHz, doubled wide, thrown left and
# right each 16th.
[buses.metal]
ring = { hz = 277, wet = 0.3 }
doubler = { delay = 0.009, depth = 0.0015, rate = 0.4, wet = 0.5 }
crush = { bits = 6, rate = 12000, wet = 0.35 }
filter = { highpass = 250, lowpass = 6000, q = 0 }
delay = { time = 0.3103, feedback = 0.3, wet = 0.14, pingpong = true }
gate = { steps = ".xxx .xx. .xxx .x.x" }
autopan = { steps = [-0.8, 0.5, -0.3, 0.8, -0.5, 0.3, 0.8, -0.8] }
width = { steps = [1.6] }
duck = { by = "kick", depth = -8, release = 0.12 }

[buses.metal.stutter.bars]      # the sequence glitches on its own, every other phrase
"5" = "xxxx xxxx xxRR xxxx"
"14" = "xxxx xx<< xxxx rrrr"

[buses.acid]
drive = { gain = 8, level = -5 }
filter = { highpass = 200, lowpass = 3200, q = 1 }
delay = { time = 0.2069, feedback = 0.2, wet = 0.1, pingpong = true }
gate = { steps = ".xxx .xxx .xx. .xxx" }
autopan = { steps = [-0.7, 0.7], step = "e" }
width = { steps = [1.4] }
duck = { by = "kick", depth = -8, release = 0.12 }

# The harpsichord: a slow phaser, dotted-8th echoes left and right, a small room, a gate leaving a hole at the
# end of each half bar; opening up over the intro.
[buses.harpsi]
phaser = { rate = 0.15, low = 500, high = 4000, stages = 4, feedback = 0.4, wet = 0.35 }
doubler = { delay = 0.012, depth = 0.001, rate = 0.25, wet = 0.4 }
filter = { highpass = 180, lowpass = 8000, q = 0 }
delay = { time = 0.3103, feedback = 0.35, wet = 0.2, pingpong = true }
reverb = { size = 1.5, decay = 3, damp = 0.5, wet = 0.12, dry = 1 }
gate = { steps = "xxxx xxx. xxxx xx.x" }
width = { steps = [1.7] }
duck = { by = "kick", depth = -5, release = 0.12 }

[buses.eerie]
doubler = { delay = 0.013, depth = 0.002, rate = 0.2, wet = 0.6 }
delay = { time = 0.4138, feedback = 0.45, wet = 0.28, pingpong = true }
reverb = { size = 2.5, decay = 3, damp = 0.5, wet = 0.25, dry = 1 }

[buses.glitch]
crush = { bits = 4, rate = 8000 }
filter = { highpass = 300 }
autopan = { steps = [-0.9, 0.7, 0.2, -0.6, 0.9, -0.2] }

[buses.fx]
phaser = { rate = 0.5, low = 400, high = 5000, stages = 6, feedback = 0.5, wet = 0.5 }
delay = { time = 0.3103, feedback = 0.35, wet = 0.25, pingpong = true }
reverb = { size = 1.5, decay = 3, damp = 0.4, wet = 0.15, dry = 1 }

[buses.sweeps]
filter = { highpass = 150 }
reverb = { size = 1.5, decay = 3, damp = 0.3, wet = 0.15, dry = 1 }
autopan = { steps = [-1, -0.7, -0.4, -0.1, 0.1, 0.4, 0.7, 1], step = "q", smooth = 0.05 }

# The whole mix cut up at the ends of phrases (r: a 32nd over and over, R: a 64th, <: backwards, v: a tape
# stop, .: silence).
[master.stutter.bars]
"2" = "xxxx xxxx xxxx rrRR"
"4" = "xxxx xxxx xxxx xxRR"
"6" = "xxxx xxxx xx<< <<rr"
"8" = "xxxx xxxx xxxx rrrr"
"10" = "xxxx xxxx xxxx vvvv"
"12" = "xxxx xxxx RRRR ...."
"14" = "xxxx xxxx xxxx <<RR"
"16" = "xxxx xxxx rrrr RRRR"
"17" = "xxxx rrxx xxxx <<<<"
"18" = "xxxx vvvv vvvv ...."
"19-21" = "................"      # and the echoes stay shut

[automation]
"harpsi.filter.lowpass" = [[1, 700], [3, 8000]]
"acid.filter.lowpass" = [[3, 900], [7, 3200], [13, 1500], [17, 5000]]

# --- drums ---------------------------------------------------------------------------------------------

[patterns.beat]
kick = "E1 q E1 E1 E1"
chat = "..x. ..xx ..x. .x.x"
ohat = "..x. ..x. ..x. ..x."
clap = ".... x... .... x..."

[patterns.data]                 # computer noise off the beat, never the same in two bars
data = ["...x .... ..x. ....", ".... .x.. .... x.x.", "..x. .... ...x ....", ".... ..x. x... .xx."]

# --- bass ----------------------------------------------------------------------------------------------

[patterns.pedal]                # kick, bass, bass, bass on A; the second bar pops up an octave at its end
bass = [
  "r s A1 A1 A1 r A1 A1 A1 r A1 A1 A1 r A1 A1 A1",
  "r s A1 A1 A1 r A1 A1 A1 r A1 A1 A1 r A1 A2 A1",
]

[patterns.cadence]              # the bass follows the harpsichord: Am, Dm, E, Am to the diminished seventh
bass = [
  "r s A1 A1 A1 r A1 A1 A1 r A1 A1 A1 r A1 A1 A1",
  "r s D2 D2 D2 r D2 D2 D2 r D2 D2 D2 r D2 D2 D2",
  "r s E2 E2 E2 r E2 E2 E2 r E2 E2 E2 r E2 E2 E2",
  "r s A1 A1 A1 r A1 A1 A1 r G#1 G#1 G#1 r G#1 B1 D2",
]

# --- the harpsichord -----------------------------------------------------------------------------------

[patterns.figure]               # a baroque figure in 16ths: Am, Dm (turning on Bb), E (with an F over it), Am falling in 32nds down a diminished seventh
harpsi = [
  "A3 s E4 A4 C5 E5 C5 A4 E4 A3 E4 A4 C5 E5 F5 E5 C5",
  "D4 s F4 A4 D5 F5 D5 A4 F4 D4 F4 A4 D5 F5 E5 D5 Bb4",
  "E4 s G#4 B4 E5 G#5 E5 B4 G#4 E4 G#4 B4 D5 F5 E5 D5 B4",
  "A3 s E4 A4 C5 E5 C5 A4 E4 G#5 t F5 D5 B4 G#4 F4 D4 B3 G#3 s B3 D4 F4",
]

[patterns.figure8]              # the figure an octave up as well, for the main drop
harp8 = [
  "A3 s E4 A4 C5 E5 C5 A4 E4 A3 E4 A4 C5 E5 F5 E5 C5",
  "D4 s F4 A4 D5 F5 D5 A4 F4 D4 F4 A4 D5 F5 E5 D5 Bb4",
  "E4 s G#4 B4 E5 G#5 E5 B4 G#4 E4 G#4 B4 D5 F5 E5 D5 B4",
  "A3 s E4 A4 C5 E5 C5 A4 E4 G#5 t F5 D5 B4 G#4 F4 D4 B3 G#3 s B3 D4 F4",
]

[patterns.intro]                # the figure's first two bars
harpsi = [
  "A3 s E4 A4 C5 E5 C5 A4 E4 A3 E4 A4 C5 E5 F5 E5 C5",
  "D4 s F4 A4 D5 F5 D5 A4 F4 D4 F4 A4 D5 F5 E5 D5 Bb4",
]
eerie = ["r h A5<-7 h", "Bb5~ q. A5~ e G#5~ q A5>-12 q"]

[patterns.break]                # the figure in 8ths over Am and E; the wail, then a dive of two octaves
harpsi = ["A3 e E4 A4 C5 E5 C5 A4 E4", "G#3 e E4 G#4 B4 E5 D5 B4 G#4"]
eerie = ["E5<-12 h. F5~ q", "E5~ q D#5~ q E5>-24 h"]

# --- the FM sequence and the acid ----------------------------------------------------------------------

[patterns.metal]                # a cell of five (A3 A4 Bb3 A3 E4) on the twelve 16ths between the kicks, the cutoff on a cycle of three
metal = [
  "r s A3^700 A4^2600 Bb3^1300 r A3^700 E4^2600 A3^1300 r A4^700 Bb3^2600 A3^1300 r E4^700 A3^2600 A4^1300",
  "r s Bb3^700 A3^2600 E4^1300 r A3^700 A4^2600 Bb3^1300 r A3^700 E4^2600 A3^1300 r A4^700 Bb3^2600 A3^1300",
  "r s E4^700 A3^2600 A4^1300 r Bb3^700 A3^2600 E4^1300 r A3^700 A4^2600 Bb3^1300 r A3^700 E4^2600 A3^1300",
  "r s A4^700 Bb3^2600 A3^1300 r E4^700 A3^2600 A4^1300 r Bb3^700 A3^2600 E4^1300 r A3^700 A4^2600 Bb3^1300",
]

[patterns.acid]                 # low, sliding (~), each note's cutoff (^); the flat second, the minor third and the tritone
acid = [
  "A3^400 s r A3^700 A4~^1400 r Bb3^600 r A3^500 C4~^1100 r A3^400 r E4^1800 r Bb3~^900 A3^500",
  "A3^400 s r A3^700 G4~^1600 r A3^500 r Bb3^700 r A3^400 C4^1300 r D#4~^2000 E4~^1500 r A3^500",
]

# --- the wail ------------------------------------------------------------------------------------------

[patterns.screams]              # high, scooping in from an octave below, a semitone either side; between them a squiggle
eerie = ["r w", "r h E6<-12 q. F6~ e", "r w", "r h A5<-12 q G#5~ e A5~ e"]
squig = ["E5 h. r q", "r w", "Bb4 h r e D5 q.", "r w"]

# --- effects -------------------------------------------------------------------------------------------

[patterns.zaps]
zap = ["x... .... .... ....", ".... .... ..x. ...."]

[patterns.uplift]
uplift = "x... .... .... ...."

[patterns.impact]
impact = "x... .... .... ...."
downlift = "x... .... .... ...."

[patterns.yoy]
yoy = ["r w", "r h. A2 e3 C3 D#3"]

[patterns.gurgle]
gurgle = "r h. A3 e Bb3"

[patterns.end]
kick = "E1 q E1 E1 r"
bass = "r s A1 A1 A1 r A1 A1 A1 r A1 A1 A1 r q"
eerie = "E6>-36 w"

# --- arrangement ---------------------------------------------------------------------------------------

[arrangement]
"1-2" = ["intro", "uplift"]
"3" = ["impact"]
"3-6" = ["beat", "pedal", "metal", "acid", "data", "zaps"]
"6" = ["gurgle"]
"7-10" = ["beat", "cadence", "figure", "metal", "data"]
"11-12" = ["break", "yoy", "uplift"]
"13" = ["impact"]
"13-16" = ["beat", "cadence", "figure", "figure8", "metal", "acid", "data", "screams", "zaps"]
"17" = ["beat", "pedal", "metal", "acid", "data", "figure", "gurgle"]
"18" = ["end", "impact"]
