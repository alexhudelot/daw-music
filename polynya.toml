# --- the drums on top of the chopped break ------------------------------------------------------------------------------------

[synths.kick]
osc = [{ wave = "sine", to = "dry" }, { wave = "noise", level = -62 }]
filter = { type = "band12", cutoff = 3400, resonance = 0.2 }
shape = { drive = 3, asym = 0.08 }
env = [{ attack = 0.0004, hold = 0.035, decay = 0.1, curve = 3, release = 0.006 }, { decay = 0.005 }, { decay = 0.05, curve = 6 }, { decay = 0.005 }]
mod = [["env2", "pitch", 14], ["env3", "pitch", 24], ["env4", "osc2.level", 52], ["random", "pitch", 0.25], ["velocity", "level", 3]]

[synths.snare]
osc = [{ wave = "triangle", to = "dry", level = -9 }, { wave = "sine", octave = 1, semi = 2, to = "dry", level = -9 }, { wave = "noise", level = 0 }]
filter = { type = "band12", cutoff = 2800, resonance = 0.1 }
filter2 = { type = "high12", cutoff = 600 }
shape = { drive = 7, asym = 0.1 }
env = [{ attack = 0.0003, decay = 0.2, curve = 4, release = 0.008 }, { decay = 0.05, curve = 3 }, { decay = 0.016 }]
mod = [["env2", "osc1.level", 9], ["env3", "pitch", 6], ["random", "filter.cutoff", 0.25], ["random", "pitch", 0.35], ["random", "level", 1], ["velocity", "filter.cutoff", 0.6]]

# --- the low end ---------------------------------------------------------------------------------------------------------------

# the sub: it carries the line and never moves in timbre
[synths.sub]
osc = [{ wave = "sine" }, { wave = "sine", octave = 1, level = -20 }, { wave = "triangle", level = -22 }]
shape = { drive = 2.5, asym = 0.12 }
env = [{ attack = 0.007, release = 0.05 }]

# the same line an octave's worth of harmonics up: saws through a lowpass that plucks at each new note, then a vowel that
# moves across the eight bars of the loop, so the line says the same thing in the same place each time round
[synths.bm]
osc = [{ wave = "saw", level = -3, unison = { voices = 2, detune = 7, spread = 0.3 } }, { wave = "pulse", width = 0.3, octave = 1, level = -13 }, { wave = "triangle", level = -4 }]
filter = { type = "low24", cutoff = 340, resonance = 0.28, drive = 8 }
filter2 = { type = "formant", vowel = 2 }
shape = { drive = 3, asym = 0.12 }
env = [{ attack = 0.008, release = 0.08 }, { attack = 0.02, decay = 0.7, curve = 2 }]
lfo = [{ shape = "triangle", rate = "8w", free = true }]
mod = [["env2", "filter.cutoff", 1.3], ["velocity", "filter.cutoff", 0.6], ["lfo1", "filter2.vowel", 1.6]]
level = -6

# the line said higher up, at the returns: not a lead, a thin reed behind the strikes
[synths.voc]
osc = [{ wave = "saw", level = -6 }, { wave = "triangle" }]
filter = { type = "low24", cutoff = 800, resonance = 0.1, drive = 2 }
env = [{ attack = 0.012, release = 0.09 }, { attack = 0.02, decay = 0.5, curve = 2 }]
mod = [["env2", "filter.cutoff", 0.8]]
level = -6

# --- the chord bending: the only time the pad is live ------------------------------------------------------------------------

[synths.morph]
osc = [{ wave = "saw", detune = -9, unison = { voices = 3, detune = 9, spread = 0.5 } }, { wave = "saw", detune = 8, phase = 0.4, unison = { voices = 3, detune = 13, spread = 0.8 } }, { wave = "triangle", octave = -1, level = -8 }, { wave = "noise", level = -27 }]
filter = { type = "low24", cutoff = 900, resonance = 0.12, drive = 4 }
filter2 = { type = "notch12", cutoff = 340, resonance = 0.15 }
env = [{ attack = 0.25, release = 1.0 }]
level = -17

# --- what happens rarely ---------------------------------------------------------------------------------------------------------

# a long note, nearly a sine
[synths.high]
osc = [{ wave = "sine" }, { wave = "triangle", level = -14, detune = 4 }, { wave = "noise", level = -44 }]
filter = { type = "low12", cutoff = 4000, resonance = 0.05 }
env = [{ attack = 0.05, attack_curve = -1, release = 0.6 }]
mod = [["velocity", "level", 4]]
level = -16

[synths.chirp]
