# "Polynya": open water that stays open inside the sea ice. Atmospheric drum and bass, the DAW's second, 168 BPM, 348 bars,
# G minor with one turn into E flat minor and back. The theme is one chord, struck in a rhythm, and an eight-bar bass line under it.
# Written from the study in out/arcology-study: its structure and measures, none of the references' notes, loops or chords. Every
# sound is made here. The strikes are rendered from samples/polynya/pads.toml; the textures are those strikes with the time taken out of
# them; the drums are a break (samples/polynya/breaks.toml) cut into beats. Written out by samples/polynya/make.py.
#
#   1-16     the strikes alone, dark and low in level, and dust; the breath comes in at 9
#   17-32    the bass melody under them, in its upper voice only, forward: the whole theme, sixteen bars, no drums
#   33-46    the break's top comes up through a highpass; the high line, once. No sub yet
#   47-48    the top gone: strikes and the bass melody only
#   49-64    the sub, the kick and the whole break, all at once. 49-80 the theme under break A
#   65-80    the upper half opens
#   81-96    the strikes dark, low and narrow, the low pulse in; 81-84 the sub out too, the upper bass carrying the line
#   97-112   the high line, with its floor
#   113-128  half-time and bare: kick, a single snare, bass, the strikes low
#   129-160  first opening: drums and sub gone, the strikes bright and falling. 145: the bass melody alone, then the high line
#   161-176  the theme returns under the drums, said again two octaves up
#   177-192  the rolling break, the upper half back
#   193-208  strikes low again. 193-196 the sub out; 201-208 the upper bass out; the low pulse under both
#   209-224  most of it: the open voicing, the high line, the cluster
#   224      the mix stops like a tape, then two beats of nothing
#   225-240  THE TURN, quiet and narrow: the chord bends down into E flat minor over no root at all. At 233 the new bass names it, upper voice only
#   241-288  theme B under the drums: 241 half-time, and the sub at its most; 257 the rolling break, the upper half; 265 the high line; the open voicing from 259
#   289-304  second opening, the widest and brightest: the chord bends back into G minor. The open strikes, the high line, then its bass
#   305-328  the peak: the first theme, every strike, the widest, brightest pad, the line said high again, breaks A and B against each other
#   329-336  narrow and dark: bass melody and strikes alone, as at the start
#   337-348  the walk comes home to the root; the high line comes down to G; one last chord without its 7, 9 and 11, left to fall
