env = [{ attack = 0.01, decay = 2.6, sustain = 0.1, curve = 2, release = 0.8 }]
level = -16

[synths.bleep]
osc = [{ wave = "sine", mute = true, octave = 2 }, { wave = "sine", fm = 0.5, fm_by = 1 }, { wave = "triangle", level = -10 }]
env = [{ attack = 0.002, decay = 0.42, curve = 4, release = 0.18 }, { decay = 0.08, curve = 3 }]
mod = [["env2", "osc2.fm", 1.6], ["random", "pan", 0.3], ["velocity", "level", 8]]
level = -19

[synths.bloom]
