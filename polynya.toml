[synths.pulse]
osc = [{ wave = "saw", detune = -6 }, { wave = "saw", detune = 6 }, { wave = "pulse", width = 0.4, octave = 1, level = -12 }]
filter = { type = "low24", cutoff = 420, resonance = 0.25, drive = 6 }
env = [{ attack = 0.003, decay = 0.16, sustain = 0.04, curve = 3, release = 0.06 }, { decay = 0.1, curve = 3 }]
lfo = [{ shape = "triangle", rate = "8w", free = true }]
mod = [["env2", "filter.cutoff", 1.1], ["lfo1", "filter.cutoff", 0.5], ["velocity", "level", 8]]
level = -14

# --- the one room ------------------------------------------------------------------------------------------------------------

[buses.vast]
hall = { size = 2.6, decay = 3.2, damp = 0.45, predelay = 0.05, early = 0.25, mod = 0.6, highpass = 180, width = 1, wet = 1, dry = 0 }
eq = [{ hz = 320, gain = -2, q = 0.8 }, { type = "highshelf", hz = 7000, gain = -1 }]
stereo = { cross = [350], width = [0.5, 1.3] }
duck = { by = "kick", depth = -3, hold = 0.01, release = 0.2 }

# --- drums ---------------------------------------------------------------------------------------------------------------------

[buses.brk]
filter = { highpass = 150, q = 0 }
