# "Velum": the thin veil over a young mushroom's gills, torn as the cap opens. After The Misted Muppet, by technique only.
#
# One riff, E5 and its 3+1+2 cell, stated at half speed in the first bars, played from bar 33, moved to other pivots, run in
# 16ths, displaced, and at its clearest at the top of the main run. Bass on E throughout, its movement in timbre. About two
# lines at once. Gates and glitches as events. No major third over the flat second, no Andalusian cadence. Written by
# songs/samples/velum/gen_velum.py: edit that and run it again.
#
#   1-24     intro, no kick: wash and pad, the hook at half speed
#   25-56    run 1: pedal; hook (33); on other pivots, answered (41); running 16ths (49); glitch and the squelch's reply (55)
#   57-68    break, no kick: a second long line, opening upward; the hook slowed; build
#   69-116   run 2: squelch riff (69), moving on its pivot with the pop in its gaps (77); squelch solo (85);
#            hook and squelch in turn (93); a new riff a fifth up (101); tent and pluck (109); glitch and the pluck's reply (115)
#   117-144  central break, no kick: hook slowed, alone (117); a fifth up over a low line (125); the vibrato fifth (133); the hook (141)
#   145-208  run 3, the main drop: hook with a thin double (145); climbing a register at a time (153); hook's solo (161);
#            squelch answered by the hook's voice (169); gapped riff with the pop (177); 16ths around B5, gated (185);
#            running hook alone, at its clearest (193); gated (201); glitch and the hook's reply (207)
#   209-220  short break, no kick
#   221-256  run 4: hook at once (221); second squelch solo (229); hook against the cascade (237); glitch and the pop's reply (251); pedal out (253)
#   257-264  the hook slowed once more, into the hall
format = "daw-song 1"
title = "Velum"
publish = true
tempo = 145
meter = "4/4"
seed = 41


[instruments]
# long notes first, so that their buses are mixed, and their samples let go, early
wash = { synth = "wash", bus = "washb" }
air = { synth = "air", bus = "windb", gain = -3 }
wind = { synth = "wind", bus = "windb" }
pad = { synth = "pad", bus = "padb" }
padr = { synth = "padr", bus = "padb" }
grit = { synth = "grit", base = "C5", bus = "gritb" }
# the low end: Haustorium (Acid)'s, retuned to E
kick = { synth = "kick", base = "G1", bus = "punch" }
bass = { synth = "bass", bus = "bass" }
bmove = { synth = "bmove", bus = "bmove", octave = 1 }
growl = { synth = "growl", bus = "growl", octave = 1, glide = 0.02 }
hat = { synth = "hat", base = "E6", bus = "hats", pan = 0.15 }
ohat = { synth = "ohat", base = "E6", bus = "hats", pan = -0.12, gain = 1 }
tick = { synth = "tick", base = "C5", bus = "ticks" }
ride = { sound = "ride", gain = -18, pan = 0.25, bus = "hats", cut = true, release = 0.3 }
clap = { sound = "clap", gain = -9, bus = "drums" }
snare = { synth = "snare", base = "D3", gain = -5, bus = "drums" }
roller = { synth = "snare", base = "D3", bus = "roll" }
crash = { sound = "crash", gain = -17, bus = "hats" }
rcrash = { sound = "crash", gain = -15, bus = "hats", reverse = true }
impact = { sound = "impact", gain = -12 }
riser = { synth = "riser", bus = "build" }
fall = { synth = "fall", bus = "build" }
leadkey = { synth = "leadkey" }
# the study's voices
hook = { synth = "stair", bus = "lead", glide = 0.014 }
ans = { synth = "stair", bus = "ansb", gain = -5, pan = -0.08, glide = 0.014 }
ped = { synth = "pedal", bus = "pedb", glide = 0.006 }
pop = { synth = "pedal", bus = "popb", gain = -1, pan = 0.1 }
arc = { synth = "arc", bus = "arcb", glide = 0.09, vibrato = { depth = 0.14, rate = 5.2, delay = 0.2 } }
arclo = { synth = "arc", bus = "arclob", gain = -3, glide = 0.12, vibrato = { depth = 0.1, rate = 4.7, delay = 0.3 } }
vib = { synth = "vib", bus = "vibb", glide = 0.06, vibrato = { depth = 0.46, rate = 8.9, delay = 0.06 } }
tent = { synth = "tent", bus = "tentb" }
pluck = { synth = "pluck", bus = "pluckb" }
sq = { synth = "sq", bus = "sqb", glide = 0.02 }
# the glitch: slices of the hook's and the squelch's own notes, played as a phrase
gl = { sample = "samples/velum/stair.flac", base = "E5", bus = "glitch", pan = -0.75, cut = true, release = 0.004 }
gr = { sample = "samples/velum/stair.flac", base = "E5", bus = "glitch", pan = 0.75, cut = true, release = 0.004 }
grev = { sample = "samples/velum/stair.flac", base = "E5", bus = "glitch", pan = 0.5, cut = true, release = 0.008, reverse = true }
gsq = { sample = "samples/velum/squelch.flac", base = "E4", bus = "glitch", pan = -0.2, cut = true, release = 0.004 }

# --- the low end -------------------------------------------------------------------------------------------------

[synths.kick]
osc = [{ wave = "sine", to = "dry" }, { wave = "noise", level = -70 }]
filter = { type = "band12", cutoff = 3500, resonance = 0.2 }
shape = { drive = 2, asym = 0.08 }
level = -2
env = [
  { attack = 0.0005, hold = 0.125, decay = 0.065, curve = 1, release = 0.005 },
  { decay = 0.009, curve = 5 },
  { decay = 0.085, curve = 3 },
  { decay = 0.004 },
]
mod = [["env2", "pitch", 23], ["env3", "pitch", 22], ["env4", "osc2.level", 62]]

[synths.bass]
osc = [
  { wave = "sine", level = -2, to = "dry" },
  { wave = "sine", octave = 1, level = -6, to = "dry" },
  { wave = "saw", level = -3 },
]
filter = { type = "low24", cutoff = 300, resonance = 0.1 }
level = -2.5
env = [{ attack = 0.016, attack_curve = 3, hold = 0.076, decay = 0.01, curve = -1, release = 0.006 }]

[synths.bmove]
osc = [
  { wave = "sine", octave = 1, semi = 7, mute = true },
  { wave = "triangle", fm = 2, fm_by = 1 },
  { wave = "pulse", width = 0.45, detune = 7, fm = 1, fm_by = 1, level = -5 },
  { wave = "triangle", octave = 1, level = -16, to = "dry" },
]
filter = { type = "comb", cutoff = 500, resonance = 0.45 }
filter2 = { type = "formant", vowel = 2, resonance = 0.4 }
shape = { fold = 4, asym = 0.3, mix = 0.6 }
level = -5
env = [
  { attack = 0.012, hold = 0.05, decay = 0.03, curve = -1, release = 0.01 },
  { decay = 0.05, curve = 3 },
]
lfo = [{ shape = "triangle", rate = "q.", free = true }, { shape = "smooth", rate = "3w", free = true }]
mod = [
  ["env2", "filter.cutoff", 1.5],
  ["velocity", "filter.cutoff", 0.7],
  ["lfo1", "filter2.vowel", 0.8],
  ["lfo1", "filter.cutoff", 1.2],
  ["lfo1", "osc2.fm", 1.2],
  ["lfo2", "filter.resonance", 0.15],
  ["random", "filter.cutoff", 0.15],
]

[synths.growl]
osc = [{ wave = "saw" }, { wave = "pulse", width = 0.35, detune = 9, level = -2 }, { wave = "saw", octave = 1, detune = -6, level = -9 }]
filter = { type = "low24", cutoff = 750, resonance = 0.55, drive = 14 }
filter2 = { type = "formant", vowel = 1, resonance = 0.35 }
shape = { drive = 8, fold = 3, asym = 0.25, mix = 0.8 }
level = -5
env = [{ attack = 0.0008, hold = 0.04, decay = 0.025, curve = -1, release = 0.005 }, { decay = 0.05, curve = 3 }]
lfo = [{ shape = "triangle", rate = "q.", free = true }, { shape = "smooth", rate = "2w", free = true }]
mod = [
  ["env2", "filter.cutoff", 2.8],
  ["velocity", "filter.cutoff", 1.6],
  ["velocity", "level", 10],
  ["velocity", "shape.drive", 6],
  ["lfo1", "filter2.vowel", 1.2],
  ["lfo1", "filter.cutoff", 1.5],
  ["lfo2", "filter.resonance", 0.14],
  ["env2", "filter2.vowel", -1],
]

# silent: its notes are the lead's onsets, and the parts under it duck to them
[synths.leadkey]
osc = [{ wave = "sine", level = -90 }]
level = -60
env = [{ decay = 0.01 }]

# --- the leads, from the Misted study's patches ------------------------------------------------------------------

# stair: the amp open for the whole note; only the brightness dies, so the note keeps its pitch
[synths.stair]
osc = [{ wave = "saw" }, { wave = "pulse", width = 0.3, level = -5 }]
filter = { type = "low24", cutoff = 1000, resonance = 0.55, drive = 6 }
level = -13
env = [{ attack = 0.002, sustain = 1, release = 0.014 }, { decay = 0.08, curve = 3 }]
lfo = [{ shape = "triangle", rate = "e." }]
mod = [["env2", "filter.cutoff", 2.4], ["note", "filter.cutoff", 1], ["lfo1", "filter.cutoff", 0.6], ["velocity", "level", 5], ["velocity", "filter.cutoff", 0.8]]

[synths.pedal]
osc = [{ wave = "pulse", width = 0.45 }, { wave = "saw", level = -1 }]
filter = { type = "low24", cutoff = 2100, resonance = 0.25, drive = 3 }
level = -10
env = [{ attack = 0.0015, hold = 0.035, decay = 0.045, curve = 2, release = 0.01 }, { decay = 0.035, curve = 3 }]
mod = [["env2", "filter.cutoff", 1.6], ["note", "filter.cutoff", 0.8], ["velocity", "level", 6], ["velocity", "filter.cutoff", 0.7]]

[synths.arc]
osc = [{ wave = "saw" }, { wave = "triangle", level = 4, to = "dry" }, { wave = "saw", level = -19, to = "filter2" }]
filters = "parallel"
filter = { type = "low24", cutoff = 620, resonance = 0.1 }
filter2 = { type = "high12", cutoff = 2200 }
level = -9
env = [{ attack = 0.012, sustain = 1, release = 0.09 }, { attack = 0.04, decay = 0.5, sustain = 0.3, curve = 2 }]
mod = [["note", "filter.cutoff", 1], ["env2", "filter.cutoff", 0.5], ["velocity", "level", 4]]

[synths.vib]
osc = [{ wave = "saw" }, { wave = "saw", semi = -7, level = -4 }]
filter = { type = "low12", cutoff = 2200, resonance = 0.1 }
level = -13
env = [{ attack = 0.01, sustain = 1, release = 0.03 }]
mod = [["velocity", "level", 4]]

[synths.tent]
osc = [{ wave = "saw" }, { wave = "saw", detune = 6, level = -6 }]
filter = { type = "low24", cutoff = 300, resonance = 0.4 }
level = -4
env = [{ attack = 0.004, hold = 0.24, decay = 0.1, curve = 2, release = 0.03 }, { attack = 0.1, attack_curve = -1, decay = 0.2, curve = 0.5 }]
mod = [["env2", "filter.cutoff", 4.4], ["note", "filter.cutoff", 0.3], ["velocity", "filter.cutoff", 1.2]]

[synths.pluck]
osc = [{ wave = "sine", to = "dry" }, { wave = "saw", level = -15 }]
filter = { type = "low24", cutoff = 640 }
level = -14
env = [{ attack = 0.003, decay = 1.3, curve = 1, sustain = 0, release = 0.06 }]
mod = [["note", "filter.cutoff", 1], ["velocity", "level", 5]]

[synths.sq]
osc = [{ wave = "saw" }, { wave = "pulse", width = 0.3, level = -10 }]
filter = { type = "low24", cutoff = 600, resonance = 0.74, drive = 3 }
level = -14
env = [{ attack = 0.002, hold = 0.16, decay = 0.09, sustain = 0.4, curve = 2, release = 0.02 }, { decay = 0.13, curve = 1 }]
mod = [["env2", "filter.cutoff", 2.0], ["note", "filter.cutoff", 0.8], ["velocity", "filter.cutoff", 0.8], ["velocity", "level", 3]]

# --- the floor: the mid band never empties -----------------------------------------------------------------------

[synths.pad]
osc = [{ wave = "saw", unison = { voices = 5, detune = 14, spread = 1 } }, { wave = "saw", octave = 1, level = -8, unison = { voices = 3, detune = 10, spread = 1 } }]
filter = { type = "low12", cutoff = 700, resonance = 0.1 }
level = -29
env = [{ attack = 1.2, release = 2.5 }]

# the runs' pad is one note, its fifth built in: a long stereo note is the heaviest thing a render holds
[synths.padr]
osc = [{ wave = "saw", unison = { voices = 3, detune = 14, spread = 1 } }, { wave = "saw", semi = 7, level = -3, unison = { voices = 3, detune = 12, spread = 1 } }]
filter = { type = "low12", cutoff = 800, resonance = 0.1 }
level = -28
env = [{ attack = 1.2, release = 2.5 }]

[synths.wash]
osc = [{ wave = "noise" }]
filter = { type = "band12", cutoff = 2000, resonance = 0.05 }
level = -16.5
env = [{ attack = 0.4, sustain = 1, release = 0.8 }]
lfo = [{ shape = "sine", rate = 0.11 }]
mod = [["lfo1", "filter.cutoff", 1.1]]

[synths.grit]
osc = [{ wave = "noise" }]
filter = { type = "high12", cutoff = 900, resonance = 0.05 }
level = -24
env = [{ attack = 0.0008, decay = 0.05, curve = 3, release = 0.01 }]
mod = [["velocity", "level", 7], ["random", "filter.cutoff", 0.8]]

[synths.wind]
osc = [{ wave = "noise" }]
filter = { type = "band12", cutoff = 650, resonance = 0.75 }
filter2 = { type = "band12", cutoff = 1900, resonance = 0.6 }
filters = "parallel"
level = -16
env = [{ attack = 3, release = 4 }]
lfo = [{ shape = "smooth", rate = "h", free = true }, { shape = "smooth", rate = "q.", free = true }]
mod = [["lfo1", "filter.cutoff", 1.5], ["lfo2", "filter2.cutoff", 1.5], ["lfo1", "pan", 0.7], ["lfo2", "level", 8]]

[synths.air]
osc = [{ wave = "noise" }]
filter = { type = "high12", cutoff = 7000 }
level = -22
env = [{ attack = 2, release = 4 }]
lfo = [{ shape = "smooth", rate = "2w", free = true }]
mod = [["lfo1", "level", 6]]

# --- drums and builds --------------------------------------------------------------------------------------------

[synths.tick]
osc = [{ wave = "pulse", width = 0.3, octave = 1 }, { wave = "noise", level = -8 }]
filter = { type = "band12", cutoff = 3200, resonance = 0.55 }
level = -18
env = [{ attack = 0.0005, decay = 0.022, curve = 3, release = 0.004 }]
mod = [["note", "filter.cutoff", 1], ["random", "filter.cutoff", 0.3], ["velocity", "level", 5]]

[synths.hat]
osc = [
  { wave = "noise", level = -5 },
  { wave = "pulse", width = 0.4, level = -6 },
  { wave = "pulse", width = 0.4, semi = 6, detune = 31, level = -8 },
  { wave = "pulse", width = 0.5, semi = 15, detune = -17, level = -9, fm = 1.5, fm_by = 2 },
]
filter = { type = "high24", cutoff = 7500, resonance = 0.25 }
level = -12
env = [{ attack = 0.0005, decay = 0.05, curve = 4, release = 0.01 }]
mod = [["random", "filter.cutoff", 0.25], ["random", "level", 1.5], ["velocity", "level", 6]]

[synths.ohat]
osc = [
  { wave = "noise", level = -5 },
  { wave = "pulse", width = 0.4, level = -6 },
  { wave = "pulse", width = 0.4, semi = 6, detune = 31, level = -8 },
  { wave = "pulse", width = 0.5, semi = 15, detune = -17, level = -9, fm = 1.5, fm_by = 2 },
]
filter = { type = "high24", cutoff = 6500, resonance = 0.3 }
level = -12
env = [{ attack = 0.002, decay = 0.2, curve = 3, release = 0.02 }]
mod = [["random", "filter.cutoff", 0.2], ["velocity", "level", 6]]

[synths.snare]
osc = [{ wave = "triangle", level = -4, to = "dry" }, { wave = "noise" }]
filter = { type = "band12", cutoff = 3500, resonance = 0.3 }
level = -8
env = [{ attack = 0.0005, decay = 0.13, curve = 4, release = 0.02 }, { decay = 0.025, curve = 4 }]
mod = [["env2", "pitch", 10], ["velocity", "level", 8], ["velocity", "filter.cutoff", 1]]

[synths.riser]
osc = [{ wave = "noise" }, { wave = "saw", octave = -1, level = -10, unison = { voices = 5, detune = 30, spread = 0.8 } }]
filter = { type = "band12", cutoff = 400, resonance = 0.5 }
level = -14
env = [{ attack = "note", attack_curve = -3, release = 0.05 }, { attack = "note", attack_curve = -2 }]
mod = [["env2", "filter.cutoff", 4.5], ["env2", "pitch", 12]]

[synths.fall]
osc = [{ wave = "noise" }, { wave = "saw", level = -12, unison = { voices = 5, detune = 30, spread = 0.8 } }]
filter = { type = "band12", cutoff = 400, resonance = 0.5 }
level = -16
env = [{ decay = "note", curve = 3 }, { decay = "note", curve = 2 }]
mod = [["env2", "filter.cutoff", 4.5], ["env2", "pitch", 12]]

# --- the floor's buses first --------------------------------------------------------------------------------------

[buses.washb]
stereo = { cross = [800], width = [0.8, 1.6] }
sidechain = { by = "kick", threshold = -18, ratio = 2.5, release = 0.09 }
send = { vast = 0.5 }

[buses.windb]
filter = { highpass = 150 }
stereo = { cross = [1000], width = [1.2, 2] }
send = { vast = 0.4 }

[buses.padb]
filter = { highpass = 280 }
eq = [{ hz = 1500, gain = -3, q = 0.7 }]
autopan = { steps = [-0.4, -0.36, -0.3, -0.24, -0.16, -0.08, 0, 0.08, 0.16, 0.24, 0.3, 0.36, 0.4, 0.36, 0.3, 0.24, 0.16, 0.08, 0, -0.08, -0.16, -0.24, -0.3, -0.36], step = "e", smooth = 0.1 }
stereo = { cross = [400], width = [1, 1.8] }
sidechain = { by = "kick", threshold = -18, ratio = 2, release = 0.12 }
send = { vast = 0.55 }

[buses.gritb]
stereo = { cross = [2000], width = [1.0, 1.5] }
send = { vast = 0.1 }

# --- the low end --------------------------------------------------------------------------------------------------

[buses.punch]
drive = { type = "tape", gain = 2, level = -1.5 }

[buses.bass]
drive = { type = "tape", gain = 3, level = -2, asym = 0.2 }
width = { steps = [0] }
sidechain = { by = "kick", threshold = -24, ratio = 5, knee = 6, attack = 0.001, release = 0.022 }

[buses.bmove]
duck = { by = "leadkey", depth = -4, hold = 0.03, release = 0.14 }
filter = { highpass = 150, lowpass = 4200, q = 0 }
