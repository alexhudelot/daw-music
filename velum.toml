eq = [{ hz = 280, gain = 5, q = 0.8 }, { hz = 1700, gain = -2, q = 0.8 }]
multiband = { cross = [500, 2200], depth = 0.3 }
flanger = { delay = 0.002, depth = 0.0015, rate = 0.11, feedback = -0.5, wet = 0.45 }
stereo = { cross = [420], width = [0, 1.05] }
sidechain = { by = "kick", threshold = -24, ratio = 5, attack = 0.001, release = 0.03 }

[buses.growl]
transient = { attack = 6, sustain = -2, length = 0.006 }
drive = { type = "clip", gain = 9, level = -7, asym = 0.2 }
filter = { highpass = 170, lowpass = 5000, q = 0 }
eq = [{ hz = 260, gain = 4, q = 0.9 }, { hz = 1150, gain = 3.5, q = 0.8 }, { hz = 1800, gain = -3, q = 0.9 }]
multiband = { cross = [800, 2600], depth = 0.25 }
stereo = { cross = [500], width = [0, 1.1] }
sidechain = { by = "kick", threshold = -24, ratio = 5, attack = 0.001, release = 0.03 }
duck = { by = "leadkey", depth = -5, hold = 0.03, release = 0.12 }

# --- drums --------------------------------------------------------------------------------------------------------

[buses.drums]
transient = { attack = 4, sustain = -2, length = 0.008 }
filter = { highpass = 220 }
eq = [{ hz = 500, gain = 1, q = 1 }, { hz = 1100, gain = 3, q = 0.8 }, { type = "highshelf", hz = 7000, gain = -2 }]
