[buses.hats]
gain = -4
filter = { highpass = 500 }
eq = [{ type = "highshelf", hz = 9000, gain = -3 }]
stereo = { cross = [3000], width = [1.2, 1.7] }
send = { room = 0.1 }

[buses.ticks]
gain = -4
filter = { highpass = 1200 }
autopan = { steps = [-0.7, 0.7, 0.1], step = "s" }
send = { echo = 0.25, room = 0.1 }

[buses.roll]
filter = { highpass = 300 }
send = { vast = 0.3, echo = 0.2 }

[buses.build]
pitch = {}
filter = { highpass = 300 }
send = { vast = 0.35, echo = 0.15 }

# --- the leads: dry and in the middle; their echoes the only width they get. One effect each, moved as an event ----

[buses.lead]
gain = -8
filter = { highpass = 330 }
doubler = { delay = 0.008, depth = 0.0008, rate = 0.27, wet = 0.45 }
stereo = { cross = [700], width = [0.7, 1.45] }
phaser = { rate = 0.6, low = 600, high = 4000, stages = 4, feedback = 0.6, wet = 0 }
gate = { steps = "x.x. x.x. x.x. x.x. xx.x xx.x x.x. xxxx", step = "t", depth = 0 }
