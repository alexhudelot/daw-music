# the main acid: one saw and one square into a screaming lowpass, overdriven after it. No detune to smear the pitch: each note
# reads, and the filter is what moves. An accent (velocity) opens it far and rings it harder.
[synths.acid]
osc = [{ wave = "saw" }, { wave = "pulse", width = 0.5, level = -5 }]
filter = { type = "low24", cutoff = 380, resonance = 0.86, drive = 7 }
shape = { drive = 3, asym = 0.25, mix = 0.7 }
level = -12
env = [{ attack = 0.001, decay = 0.2, sustain = 0.55, release = 0.016 }, { decay = 0.12, curve = 2 }]
lfo = [{ shape = "smooth", rate = "4w", free = true }]
mod = [
  ["env2", "filter.cutoff", 4.2],
  ["velocity", "filter.cutoff", 1.9],
  ["velocity", "level", 8],
  ["velocity", "filter.resonance", 0.08],
  ["lfo1", "filter.cutoff", 0.2],
]

# the answer: a hard-synced saw through a vowel thrown from "o" to "i". It talks back, four notes at a time
[synths.talk]
osc = [{ wave = "saw", mute = true }, { wave = "saw", sync = true, octave = 1 }, { wave = "pulse", width = 0.3, detune = -8, level = -6 }]
filter = { type = "formant", vowel = 3, resonance = 0.75, drive = 4 }
filter2 = { type = "low12", cutoff = 5200 }
shape = { drive = 3, asym = 0.15, mix = 0.6 }
level = -14
env = [{ attack = 0.002, decay = 0.14, sustain = 0.5, release = 0.02 }, { decay = 0.11, curve = 2 }]
mod = [["env2", "osc2.pitch", 12], ["env2", "filter.vowel", -2.4], ["velocity", "level", 6]]

# the hit: a squelched stab, wide saws and a low square, plucked, folded
[synths.hit]
osc = [{ wave = "saw", unison = { voices = 3, detune = 14, spread = 0.7 } }, { wave = "pulse", width = 0.4, octave = -1, level = -6 }]
filter = { type = "low24", cutoff = 520, resonance = 0.62, drive = 14 }
shape = { drive = 8, fold = 3, mix = 0.75 }
level = -24
env = [{ attack = 0.0008, hold = 0.035, decay = 0.12, curve = 3, release = 0.02 }, { decay = 0.08, curve = 3 }]
mod = [["env2", "filter.cutoff", 4.2], ["env2", "pitch", 3], ["velocity", "level", 6]]

# --- the kit. Each drum is its parts: a transient, a body and a tail, each its own synth ----------------------------------------

# the kick's click: noise and a square, gone in 4 ms
[synths.kT]
osc = [{ wave = "noise" }, { wave = "pulse", width = 0.3, octave = 2, level = -10 }]
filter = { type = "band12", cutoff = 3800, resonance = 0.3 }
env = [{ attack = 0.0002, decay = 0.005, curve = 3, release = 0.002 }]
mod = [["velocity", "level", 10], ["random", "filter.cutoff", 0.15]]

# the kick's weight: a sine falling onto B flat, above the bass's root. Its length is the kit's feel: long in the half-time, short at the peak
[synths.kB]
osc = [{ wave = "sine", to = "dry" }, { wave = "sine", octave = 1, level = -24, to = "dry" }]
shape = { drive = 4, asym = 0.1 }
env = [{ attack = 0.0004, hold = 0.03, decay = 0.15, curve = 3, release = 0.006 }, { decay = 0.006, curve = 4 }, { decay = 0.045, curve = 5 }]
mod = [["env2", "pitch", 16], ["env3", "pitch", 26], ["random", "pitch", 0.2], ["velocity", "level", 5]]

# the kick's chest: a short knock at 185 Hz, the punch on small speakers, clear of the pad because it's over so soon
[synths.kM]
osc = [{ wave = "sine", to = "dry" }, { wave = "triangle", to = "dry", level = -10 }]
env = [{ attack = 0.0005, decay = 0.028, curve = 3, release = 0.004 }, { decay = 0.012, curve = 4 }]
mod = [["env2", "pitch", 9], ["velocity", "level", 8]]

# every snare's front: a hard click of filtered noise
[synths.snT]
osc = [{ wave = "noise" }, { wave = "pulse", width = 0.2, octave = 1, level = -14 }]
filter = { type = "band12", cutoff = 4600, resonance = 0.2, drive = 6 }
env = [{ attack = 0.0002, decay = 0.009, curve = 3, release = 0.002 }]
mod = [["velocity", "level", 12], ["random", "filter.cutoff", 0.2]]

# deep: the half-time's. A big low shell, a long falling tail
[synths.snDb]
osc = [{ wave = "sine", to = "dry" }, { wave = "triangle", semi = 7, to = "dry", level = -9 }]
shape = { drive = 5, asym = 0.15 }
env = [{ attack = 0.0005, decay = 0.17, curve = 3, release = 0.01 }, { decay = 0.03, curve = 4 }]
mod = [["env2", "pitch", 9], ["velocity", "level", 9]]

[synths.snDn]
osc = [{ wave = "noise" }]
filter = { type = "band12", cutoff = 2400, resonance = 0.12 }
filter2 = { type = "high12", cutoff = 500 }
shape = { drive = 4 }
env = [{ attack = 0.001, decay = 0.36, curve = 3, release = 0.02 }, { decay = 0.25, curve = 2 }]
mod = [["env2", "filter.cutoff", 1.2], ["random", "filter.cutoff", 0.2], ["velocity", "level", 9]]

# crack: the two-step's. Tight and high, dry
[synths.snCb]
