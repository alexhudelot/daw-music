# "Frazil": the loose needles of ice that form in water too turbulent to freeze still. Psy and drum and bass, grown from "Polynya"'s theme: the
# same struck chord and eight-bar bass line, heard first without drums, then pushed through a ladder of rhythm so that the track seems to
# accelerate at one fixed tempo, 174 BPM. G minor; one turn into E flat minor, Polynya's own, and back. Every sound is made here. Written out by
# samples/frazil/make.py.
#
#   1-16  the strikes alone, dark, in the distance, and dust
#   17-32  the bass melody, its upper voice only: the theme, sixteen bars, no drums; the breath
#   33-44  metal coming up through a highpass; the high line once; a slow orbit
#   45-48  SEGUE 1, 4 bars: the top gone, a low tom fall, the pad cut up, into the first kick
#   49-76  HALF-TIME: deep kit, one snare a bar, the sub at last. The hit answers
#   77-80  SEGUE 2, 4 bars: the snare doubling to two-step, drums' tape stop, the break backwards, the acid alone
#   81-108  TWO-STEP: crack snare, THE RIFF. Answered by the hit and the glitch. 97: open voicing
#   109-112  SEGUE 3, 4 bars: toms, snare roll, 32nds, master buffer repeats, silence into the burst
#   113-124  FIRST OPENING: epic strike, full width, no drums or sub. The high line, the gated voice
#   125-128  SEGUE 4, 4 bars: ticks crossing, the break backwards and up, mono, one snare into the wide
#   129-148  TWO-STEP, tighter: break A under it, metal second snare, the talker answers
#   149-152  SEGUE 5, 4 bars: triplet fill, drums' tape stop, grain cloud, a riser crossing
#   153-178  ROLLING: ride, shaker, break B, the bass in 8ths then the gallop, pad every 4 bars
#   179-184  SEGUE 6, 6 bars, THE WRONG FOOT: the longest build yet, threes across the bar, and it stops a beat short
#   185-192  THE TURN: nothing lands. E flat minor, narrow, quiet, no drums, the riff whispered
#   193-196  SEGUE 7, 4 bars: five-step displacement, drums where the one isn't, then the real drop a 16th early
#   197-208  ROLLING in E flat: tearing snare, break C
#   209-212  SEGUE 8, 4 bars: chord bends home, toms crossing, buffer, one hit on the last 16th
#   213-224  BUSY: 16th hats, ghost runs, the line at double speed, pad every 4 bars
#   225-228  SEGUE 9, 4 bars: 32nds, triplet snares, chopped pad, all of it cut
#   229-234  SECOND OPENING: the largest pad; the high line at double speed
#   235-236  SEGUE 10, 2 bars: the space collapses to one point, then bursts
#   237-244  BUSIER: the riff in octaves, gated voice, hits
#   245-248  SEGUE 11, 4 bars: triplets to 32nds, glitches alternating with the voices
#   249-256  32NDS: ratchets, the line at four times, pad every 2 bars
#   257-264  32NDS, triplets in the FM
#   265-268  four bars
#   269-272  four bars
#   273-276  four bars
#   277-284  SEGUE 12, 8 bars: blocks of 2, 2, 1, 1, half, quarter: every block a different fill, glitch and pad burst
#   285-292  THE PEAK: everything, every strike the epic one, the high line screaming in two bars
#   293-296  the peak, every bar struck
#   297-298  two bars, every half bar struck
#   299-300  two bars, tearing, then the tape stops
#   301-320  the end: the bass melody alone, slow as at the start, walks home; the high line comes down to G; one last chord
