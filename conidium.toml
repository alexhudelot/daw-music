# "Conidium": a spore pinched off the tip of a hypha, then another behind it, in a chain.
#
# Written after Haustorium (Acid)'s verdict: mix approved, but the leads should be squelchy, syncopated, gated, modulated,
# the acid lead tired over time, and wanted: many effects, glitchy variations, 16ths and 32nds, solos, multi-synth call
# and answer. Main inspiration The Misted Muppet: fast riffs as events, a large wet space, one long central break.
# Kick, round bass body and returns come from Haustorium (Acid), retuned. Everything above them is new.
#
# THE CHAIN, its own voice: a click and a noise burst strike a comb near its own feedback, whose tuning falls two octaves
# onto the note within each note, then a vowel jumping each 32nd, a hard 32nd gate and hops across the field, and a tape
# echo bent at each phrase's end. It plays one contour: a tritone down, a semitone up, over and over. Across the track its
# comb goes from breath to drops (25) to a hollow throat (115) to metal (191), and it is sung slowly in the breaks.
#
# The other leads: sq (squelch, E3-E5), wire (hard sync, E5-E6, whole tone by tritones), gar (FM and vowel, E3-G4, stacked
# fourths), ndl (FM pulse, B5 pedal with leaps). Each runs through two chains (A, B); chain settings jump every few bars.
# Bass stays on E; the upper parts move the harmony.
#
#   1-24     intro: the chain as breath in a large space
#   25-88    first run. Solos: sqB 49-56, wireB 73-80. Trades: 33-40, 41-48, 57-64, 65-72, hocket 81-88
#   89-98    break
#   99-162   second run. Solos: garA 99-106, ndlB 123-130, sqA 139-146. Trades: 107-114, 131-138, relay of four 147-162
#   163-190  the long break: the chain sung, very large; leads return behind a filter at 179
#   191-262  third run. Solos: chain 191-198, wireA 207-214, garB 223-230, sqA 239-246. Trades: 199-206, duel 231-238, 247-262
#   263-268  break
#   269-284  last run, thinning
#   285-288  out
#
# Glitch: gl, gr, grev, gtalk are slices of this song's own lead buses, in samples/conidium.
format = "daw-song 1"
title = "Conidium"
publish = true
tempo = 148
meter = "4/4"
seed = 41

[instruments]
kick = { synth = "kick", base = "G1", bus = "punch" }
bass = { synth = "bass", bus = "bass" }
bmove = { synth = "bmove", bus = "bmove", octave = 1 }
growl = { synth = "growl", bus = "growl", octave = 1, glide = 0.02 }
hat = { synth = "hat", base = "E6", bus = "hats", pan = 0.15 }
ohat = { synth = "ohat", base = "E6", bus = "hats", pan = -0.12, gain = 1 }
tick = { synth = "tick", base = "C5", bus = "ticks" }
ride = { sound = "ride", gain = -18, pan = 0.25, bus = "hats", cut = true, release = 0.3 }
clap = { sound = "clap", gain = -9, bus = "drums" }
snare = { synth = "snare", base = "D3", gain = -5, bus = "drums" }
roller = { synth = "snare", base = "D3", bus = "roll" }
crash = { sound = "crash", gain = -17, bus = "hats" }
rcrash = { sound = "crash", gain = -15, bus = "hats", reverse = true }
impact = { sound = "impact", gain = -12 }
pod = { synth = "pod", bus = "pod" }
stab = { synth = "stab", bus = "stab" }
sky = { synth = "sky", bus = "sky" }
wind = { synth = "wind", bus = "wind" }
air = { synth = "air", bus = "wind", gain = -3 }
riser = { synth = "riser", bus = "build" }
fall = { synth = "fall", bus = "build" }

# the leads: five synths, two chains each but the chain itself
sqA = { synth = "sq", bus = "sqA", pan = -0.12, glide = 0.025 }
sqB = { synth = "sq", bus = "sqB", pan = 0.2, glide = 0.025 }
wireA = { synth = "wire", bus = "wireA", pan = -0.55, glide = 0.012 }
wireB = { synth = "wire", bus = "wireB", pan = 0.5, glide = 0.012 }
garA = { synth = "gar", bus = "garA", pan = 0.32, glide = 0.03 }
garB = { synth = "gar", bus = "garB", pan = -0.36, glide = 0.03 }
ndlA = { synth = "ndl", bus = "ndlA", pan = 0.65, glide = 0.01 }
ndlB = { synth = "ndl", bus = "ndlB", pan = -0.65, glide = 0.01 }
chain = { synth = "chain", bus = "chain", glide = 0.02 }
sung = { synth = "sung", bus = "far", glide = 0.09 }
gl = { sample = "samples/conidium/sq.flac", base = "G3", bus = "glitch", pan = -0.75, cut = true, release = 0.004 }
gr = { sample = "samples/conidium/chain.flac", base = "E6", bus = "glitch", pan = 0.75, cut = true, release = 0.004 }
grev = { sample = "samples/conidium/chain.flac", base = "E6", bus = "glitch", pan = 0.6, cut = true, release = 0.008, reverse = true }
gtalk = { sample = "samples/conidium/gar.flac", base = "E3", bus = "glitch", pan = -0.3, cut = true, release = 0.004 }

# --- the low end: Haustorium's kick and round body, retuned: the kick lands on G, a minor third over the bass's E ---------

[synths.kick]
osc = [{ wave = "sine", to = "dry" }, { wave = "noise", level = -70 }]
filter = { type = "band12", cutoff = 3500, resonance = 0.2 }
shape = { drive = 2, asym = 0.08 }
level = -2
env = [
  { attack = 0.0005, hold = 0.122, decay = 0.065, curve = 1, release = 0.005 },
  { decay = 0.009, curve = 5 },
  { decay = 0.085, curve = 3 },
  { decay = 0.004 },
]
mod = [["env2", "pitch", 24], ["env3", "pitch", 23], ["env4", "osc2.level", 62]]

[synths.bass]
osc = [
  { wave = "sine", level = -2, to = "dry" },
  { wave = "sine", octave = 1, level = -5, to = "dry" },
  { wave = "saw", level = -3 },
]
filter = { type = "low24", cutoff = 320, resonance = 0.1 }
level = -2.5
env = [{ attack = 0.016, attack_curve = 3, hold = 0.074, decay = 0.01, curve = -1, release = 0.006 }]

# the moving layer above the body: FM on a fourth, a comb and a moving vowel, on cycles of its own
[synths.bmove]
osc = [
  { wave = "sine", octave = 1, semi = 5, mute = true },
  { wave = "triangle", fm = 2, fm_by = 1 },
  { wave = "pulse", width = 0.4, detune = 6, fm = 1, fm_by = 1, level = -5 },
  { wave = "triangle", octave = 1, level = -16, to = "dry" },
]
filter = { type = "comb", cutoff = 560, resonance = 0.45 }
filter2 = { type = "formant", vowel = 3, resonance = 0.4 }
shape = { fold = 4, asym = 0.3, mix = 0.6 }
level = -5
env = [
  { attack = 0.012, hold = 0.05, decay = 0.03, curve = -1, release = 0.01 },
  { decay = 0.05, curve = 3 },
]
lfo = [{ shape = "triangle", rate = "e.", free = true }, { shape = "smooth", rate = "5w", free = true }]
mod = [
  ["env2", "filter.cutoff", 1.5],
  ["velocity", "filter.cutoff", 0.7],
  ["lfo1", "filter2.vowel", 0.6],
  ["lfo1", "osc2.fm", 0.7],
  ["lfo2", "filter.resonance", 0.15],
  ["random", "filter.cutoff", 0.15],
]

[synths.growl]
osc = [{ wave = "saw" }, { wave = "pulse", width = 0.35, detune = 9, level = -2 }, { wave = "saw", octave = 1, detune = -6, level = -9 }]
filter = { type = "low24", cutoff = 750, resonance = 0.55, drive = 14 }
filter2 = { type = "formant", vowel = 2, resonance = 0.35 }
shape = { drive = 8, fold = 3, asym = 0.25, mix = 0.8 }
level = -5
env = [{ attack = 0.0008, hold = 0.04, decay = 0.025, curve = -1, release = 0.005 }, { decay = 0.05, curve = 3 }]
lfo = [{ shape = "triangle", rate = "q.", free = true }, { shape = "smooth", rate = "3w", free = true }]
mod = [
  ["env2", "filter.cutoff", 2.8],
  ["velocity", "filter.cutoff", 1.6],
  ["velocity", "level", 10],
  ["velocity", "shape.drive", 6],
  ["lfo1", "filter2.vowel", 0.8],
  ["lfo2", "filter.resonance", 0.12],
  ["env2", "filter2.vowel", -1],
]

# --- the leads. None has a sustain: every voice is gone within about 100 ms, whatever its note's length ------------------

# the squelch: saw, pulse and a chirp of pitch into a screaming 24 dB lowpass with a very fast envelope, a stepped LFO
# moving the cutoff each 32nd, and the pulse's width on a slow cycle. Low and middle: E3 to E5.
[synths.sq]
osc = [{ wave = "saw" }, { wave = "pulse", width = 0.3, level = -3 }, { wave = "saw", detune = 9, octave = -1, level = -8 }]
filter = { type = "low24", cutoff = 380, resonance = 0.84, drive = 8 }
shape = { drive = 5, asym = 0.25, mix = 0.7 }
level = -12
env = [{ attack = 0.0008, hold = 0.018, decay = 0.07, curve = 2, release = 0.008 }, { decay = 0.045, curve = 3 }, { decay = 0.012, curve = 3 }]
lfo = [{ shape = "steps", rate = "t", free = true }, { shape = "sine", rate = "3w", free = true }]
mod = [
  ["env2", "filter.cutoff", 4.6],
  ["velocity", "filter.cutoff", 1.8],
  ["velocity", "level", 7],
  ["velocity", "filter.resonance", 0.08],
  ["lfo1", "filter.cutoff", 0.55],
  ["lfo2", "osc2.width", 0.2],
  ["env3", "pitch", 6],
  ["random", "shape.drive", 3],
]

# the wire: a hard-synced saw whose sync ratio sweeps down with each note and jumps each 32nd, through a screaming bandpass,
# wavefolded. High and thin: E5 to E6. Its lines jump by tritones on a whole-tone set.
[synths.wire]
osc = [{ wave = "saw", mute = true }, { wave = "saw", sync = true, octave = 1 }, { wave = "pulse", width = 0.2, detune = -7, level = -7 }]
filter = { type = "band24", cutoff = 1300, resonance = 0.74, drive = 10 }
shape = { drive = 4, fold = 5, mix = 0.55 }
level = -11
env = [{ attack = 0.0006, hold = 0.008, decay = 0.05, curve = 3, release = 0.006 }, { decay = 0.03, curve = 3 }]
lfo = [{ shape = "steps", rate = "t", free = true }, { shape = "triangle", rate = "w.", free = true }]
mod = [
  ["env2", "osc2.pitch", 19],
  ["lfo1", "osc2.pitch", 5],
  ["env2", "filter.cutoff", 2.4],
  ["note", "filter.cutoff", 0.6],
  ["lfo2", "filter.cutoff", 0.45],
  ["velocity", "level", 6],
  ["velocity", "filter.cutoff", 0.7],
]

# the gargle: FM with a modulator a fifth up, through a vowel a triangle shakes each 16th, closing to a throat; folded and
# lopsided. Low: E3 to G4, on stacked fourths.
[synths.gar]
osc = [{ wave = "sine", octave = 1, semi = 7, mute = true }, { wave = "triangle", fm = 3, fm_by = 1 }, { wave = "saw", level = -7 }]
filter = { type = "formant", vowel = 3, resonance = 0.82, drive = 6 }
filter2 = { type = "low24", cutoff = 1700, resonance = 0.62 }
shape = { fold = 8, asym = 0.35, mix = 0.65 }
level = -6
env = [{ attack = 0.001, hold = 0.015, decay = 0.08, curve = 2, release = 0.008 }, { decay = 0.06, curve = 3 }]
lfo = [{ shape = "triangle", rate = "s", free = true }, { shape = "smooth", rate = "2w", free = true }]
mod = [
  ["env2", "filter.vowel", -2.2],
  ["env2", "osc2.fm", 7],
  ["env2", "filter2.cutoff", 2.6],
  ["lfo1", "filter.vowel", 1.1],
  ["lfo2", "osc2.fm", 1.5],
  ["velocity", "filter2.cutoff", 1.2],
  ["velocity", "level", 6],
]

# the needle: a thin pulse moved by a sine a tritone and two octaves up, through a narrow ringing bandpass following the
# note. The highest: a pedal on B5 with leaps off it. Very short.
[synths.ndl]
osc = [{ wave = "sine", octave = 2, semi = 6, mute = true }, { wave = "pulse", width = 0.14, fm = 3, fm_by = 1 }, { wave = "noise", level = -24 }]
filter = { type = "band12", cutoff = 1700, resonance = 0.86, drive = 6 }
shape = { fold = 4, mix = 0.5 }
level = 3
env = [{ attack = 0.0005, hold = 0.004, decay = 0.036, curve = 3, release = 0.005 }, { decay = 0.022, curve = 4 }]
lfo = [{ shape = "steps", rate = "s", free = true }, { shape = "saw", rate = "h.", free = true }]
mod = [
  ["env2", "osc2.fm", 8],
  ["env2", "filter.cutoff", 1.6],
  ["note", "filter.cutoff", 1],
  ["lfo1", "osc2.fm", 2],
  ["lfo2", "osc2.width", 0.1],
  ["velocity", "level", 6],
]

# THE CHAIN, this track's own voice. A pulse narrow as a click and a burst of noise strike a comb filter ringing near its
# own feedback. The comb's tuning starts two octaves over the note and falls onto it within each note, so every note is a
# drop falling into pitch. After it a vowel, a new one at each 32nd. It plays one contour: a tritone down, a semitone up,
# again and again, the links of a falling chain. The bus cuts it with a hard 32nd gate and hops it across the field,
# and a tape echo whose time is bent at each phrase's end carries its last links away, sliding in pitch.
[synths.chain]
osc = [{ wave = "pulse", width = 0.06 }, { wave = "noise", level = -6 }, { wave = "sine", octave = 1, semi = 1, level = -18 }]
filter = { type = "comb", cutoff = 262, resonance = 0.88 }
filter2 = { type = "formant", vowel = 1, resonance = 0.55 }
shape = { fold = 3, asym = 0.2, mix = 0.5 }
level = 3
env = [{ attack = 0.0006, hold = 0.012, decay = 0.085, curve = 2, release = 0.01 }, { decay = 0.032, curve = 2.5 }, { decay = 0.006, curve = 3 }]
lfo = [{ shape = "steps", rate = "t", free = true }, { shape = "smooth", rate = "7w", free = true }]
mod = [
  ["note", "filter.cutoff", 1],
  ["env2", "filter.cutoff", 2],
  ["env3", "osc2.level", 8],
  ["lfo1", "filter2.vowel", 1.7],
  ["lfo2", "filter2.vowel", 0.8],
  ["random", "filter.cutoff", 0.01],
  ["velocity", "level", 6],
]

# the chain sung: the same comb and the same falling tuning, held, for the breaks
[synths.sung]
osc = [{ wave = "noise", level = -2 }, { wave = "pulse", width = 0.08, level = -10 }]
filter = { type = "comb", cutoff = 262, resonance = 0.97 }
filter2 = { type = "formant", vowel = 3, resonance = 0.4 }
level = -13
env = [{ attack = 0.03, decay = 0.4, sustain = 0.6, release = 0.5 }, { decay = 0.22, curve = 2 }]
lfo = [{ shape = "smooth", rate = "w.", free = true }, { shape = "sine", rate = 4.6, delay = 0.5, fade = 0.5 }]
mod = [
  ["note", "filter.cutoff", 1],
  ["env2", "filter.cutoff", 1.2],
  ["lfo1", "filter2.vowel", 1.3],
  ["lfo2", "filter.cutoff", 0.01],
]

# --- the parts under the leads ------------------------------------------------------------------------------------------

[synths.pod]
osc = [{ wave = "sine", octave = 2, semi = 1, mute = true }, { wave = "triangle", fm = 1.5, fm_by = 1 }, { wave = "noise", level = -22 }]
filter = { type = "band12", cutoff = 1000, resonance = 0.5 }
filter2 = { type = "formant", vowel = 4, resonance = 0.3 }
shape = { fold = 5, mix = 0.5 }
level = -9
env = [{ attack = 0.002, decay = 0.07, curve = 3, release = 0.01 }, { decay = 0.04, curve = 3 }]
lfo = [{ shape = "smooth", rate = "5w", free = true }]
mod = [["env2", "osc2.fm", 3], ["env2", "filter.cutoff", 1.5], ["lfo1", "filter2.vowel", 1.5], ["velocity", "filter.cutoff", 0.3], ["note", "filter.cutoff", 0.7]]

[synths.stab]
osc = [{ wave = "saw", unison = { voices = 3, detune = 14, spread = 0.7 } }, { wave = "pulse", width = 0.4, octave = -1, level = -6 }]
filter = { type = "low24", cutoff = 500, resonance = 0.6, drive = 14 }
shape = { drive = 8, fold = 3, mix = 0.75 }
level = -24
env = [{ attack = 0.0008, hold = 0.03, decay = 0.1, curve = 3, release = 0.02 }, { decay = 0.06, curve = 3 }]
mod = [["env2", "filter.cutoff", 4], ["velocity", "level", 6]]

# the sky: the large still chord behind the breaks, slow saws through a moving vowel, turned into a cloud on its bus
[synths.sky]
osc = [{ wave = "saw", unison = { voices = 5, detune = 16, spread = 1 } }, { wave = "sine", octave = 1, level = -8, unison = { voices = 3, detune = 8, spread = 1 } }, { wave = "noise", level = -24 }]
filter = { type = "low12", cutoff = 700, resonance = 0.25 }
filter2 = { type = "formant", vowel = 0, resonance = 0.25 }
level = -22
env = [{ attack = 2.2, release = 3.5 }]
lfo = [{ shape = "smooth", rate = "9w", free = true }, { shape = "smooth", rate = "5w", free = true }]
mod = [["lfo1", "filter.cutoff", 0.7], ["lfo2", "filter2.vowel", 1.4]]

[synths.tick]
osc = [{ wave = "pulse", width = 0.3, octave = 1 }, { wave = "noise", level = -8 }]
filter = { type = "band12", cutoff = 3200, resonance = 0.55 }
level = -18
env = [{ attack = 0.0005, decay = 0.022, curve = 3, release = 0.004 }]
mod = [["note", "filter.cutoff", 1], ["random", "filter.cutoff", 0.3], ["velocity", "level", 5]]

[synths.hat]
osc = [
  { wave = "noise", level = -5 },
  { wave = "pulse", width = 0.4, level = -6 },
  { wave = "pulse", width = 0.4, semi = 6, detune = 31, level = -8 },
  { wave = "pulse", width = 0.5, semi = 15, detune = -17, level = -9, fm = 1.5, fm_by = 2 },
]
filter = { type = "high24", cutoff = 7500, resonance = 0.25 }
level = -12
env = [{ attack = 0.0005, decay = 0.05, curve = 4, release = 0.01 }]
mod = [["random", "filter.cutoff", 0.25], ["random", "level", 1.5], ["velocity", "level", 6]]

[synths.ohat]
osc = [
  { wave = "noise", level = -5 },
  { wave = "pulse", width = 0.4, level = -6 },
  { wave = "pulse", width = 0.4, semi = 6, detune = 31, level = -8 },
  { wave = "pulse", width = 0.5, semi = 15, detune = -17, level = -9, fm = 1.5, fm_by = 2 },
]
filter = { type = "high24", cutoff = 6500, resonance = 0.3 }
level = -12
env = [{ attack = 0.002, decay = 0.2, curve = 3, release = 0.02 }]
mod = [["random", "filter.cutoff", 0.2], ["velocity", "level", 6]]

[synths.snare]
osc = [{ wave = "triangle", level = -4, to = "dry" }, { wave = "noise" }]
filter = { type = "band12", cutoff = 3500, resonance = 0.3 }
level = -8
env = [{ attack = 0.0005, decay = 0.13, curve = 4, release = 0.02 }, { decay = 0.025, curve = 4 }]
mod = [["env2", "pitch", 10], ["velocity", "level", 8], ["velocity", "filter.cutoff", 1]]

[synths.wind]
osc = [{ wave = "noise" }]
filter = { type = "band12", cutoff = 650, resonance = 0.75 }
filter2 = { type = "band12", cutoff = 1900, resonance = 0.6 }
filters = "parallel"
level = -14
env = [{ attack = 3, release = 4 }]
lfo = [{ shape = "smooth", rate = "w", free = true }, { shape = "smooth", rate = "h.", free = true }]
mod = [["lfo1", "filter.cutoff", 1.1], ["lfo2", "filter2.cutoff", 1.1], ["lfo1", "pan", 0.7], ["lfo2", "level", 4]]

[synths.air]
osc = [{ wave = "noise" }]
filter = { type = "high12", cutoff = 7000 }
level = -22
env = [{ attack = 2, release = 4 }]
lfo = [{ shape = "smooth", rate = "2w", free = true }]
mod = [["lfo1", "level", 6]]

[synths.riser]
osc = [{ wave = "noise" }, { wave = "saw", octave = -1, level = -10, unison = { voices = 5, detune = 30, spread = 0.8 } }]
filter = { type = "band12", cutoff = 400, resonance = 0.5 }
level = -14
env = [{ attack = "note", attack_curve = -3, release = 0.05 }, { attack = "note", attack_curve = -2 }]
mod = [["env2", "filter.cutoff", 4.5], ["env2", "pitch", 12]]

[synths.fall]
osc = [{ wave = "noise" }, { wave = "saw", level = -12, unison = { voices = 5, detune = 30, spread = 0.8 } }]
filter = { type = "band12", cutoff = 400, resonance = 0.5 }
level = -16
env = [{ decay = "note", curve = 3 }, { decay = "note", curve = 2 }]
mod = [["env2", "filter.cutoff", 4.5], ["env2", "pitch", 12]]

# --- the returns, as in Haustorium (Acid): nothing under 400 Hz, wide --------------------------------------------------

[buses.opp]
delay = { time = 0.152, feedback = 0.25, wet = 1, dry = 0, lowpass = 3500, highpass = 500 }
autopan = { steps = [0.00, 0.05, 0.09, 0.14, 0.18, 0.22, 0.26, 0.30, 0.33, 0.36, 0.39, 0.41, 0.43, 0.44, 0.45, 0.45, 0.45, 0.44, 0.43, 0.42, 0.40, 0.37, 0.35, 0.31, 0.28, 0.24, 0.20, 0.16, 0.11, 0.07, 0.02, -0.02, -0.07, -0.11, -0.16, -0.20, -0.24, -0.28, -0.31, -0.35, -0.37, -0.40, -0.42, -0.43, -0.44, -0.45, -0.45, -0.45, -0.44, -0.43, -0.41, -0.39, -0.36, -0.33, -0.30, -0.26, -0.22, -0.18, -0.14, -0.09, -0.05], step = "s" }
send = { mid = 0.2 }

[buses.mid]
hall = { size = 1.3, decay = 1.8, damp = 0.5, predelay = 0.02, early = 0.65, mod = 0.4, highpass = 420, width = 1, wet = 1, dry = 0 }
stereo = { cross = [500], width = [0.3, 1.4] }
sidechain = { by = "kick", threshold = -16, ratio = 1.5, release = 0.1 }

[buses.echo]
tape = { time = "e.", feedback = 0.32, wow = 0.35, flutter = 0.12, drive = 5, tone = 3200, lowcut = 450, wet = 1, dry = 0 }
stereo = { cross = [500], width = [0.3, 1.4] }
sidechain = { by = "kick", threshold = -14, ratio = 1.5, release = 0.08 }
send = { vast = 0.3 }

[buses.vast]
filter = { highpass = 150 }
hall = { size = 4, decay = 9, damp = 0.32, predelay = 0.06, early = 0.25, mod = 0.6, highpass = 140, shimmer = 0.15, width = 1, wet = 1, dry = 0 }
eq = [{ hz = 2800, gain = -2.5, q = 0.8 }, { type = "highshelf", hz = 6000, gain = -2 }]
stereo = { cross = [300], width = [0.4, 1.4] }
sidechain = { by = "kick", threshold = -18, ratio = 1.6, release = 0.12 }

# --- the low end ----------------------------------------------------------------------------------------------------

[buses.punch]
drive = { type = "tape", gain = 2, level = -2.5 }

[buses.bass]
drive = { type = "tape", gain = 3, level = -5, asym = 0.2 }
width = { steps = [0] }
sidechain = { by = "kick", threshold = -24, ratio = 5, knee = 6, attack = 0.001, release = 0.022 }

[buses.bmove]
filter = { highpass = 230, lowpass = 4200, q = 0 }
drive = { type = "fold", gain = 6, level = -6, asym = 0.2 }
