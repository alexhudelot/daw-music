stereo = { cross = [1000], width = [1.2, 2] }
send = { vast = 0.4 }

[buses.build]
pitch = {}
filter = { highpass = 300 }
send = { vast = 0.35, echo = 0.15 }

# the glitch: slices of the leads, cut from this song's own render and played as notes, each side its pan
[buses.glitch]
transient = { attack = 4, length = 0.003 }
crush = { rate = 16000, bits = 10, wet = 0.3 }
filter = { highpass = 300, lowpass = 11000, q = 0 }
eq = [{ hz = 1800, gain = 2, q = 0.8 }]
sidechain = { by = "kick", threshold = -14, ratio = 1.4, release = 0.05 }
send = { mid = 0.072, echo = 0.16, vast = 0.08 }

[master]
drive = { gain = 2, level = -2 }
eq = [{ hz = 3500, gain = -1.5, q = 0.7 }, { type = "highshelf", hz = 6500, gain = -4 }]
filter = { highpass = 25 }
stereo = { cross = [110], width = [0, 1] }
limiter = { ceiling = -1.5, release = 0.06 }
loudness = -7.5


