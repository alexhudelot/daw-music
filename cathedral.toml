  "r s F#3^600 F#4^2400 G3^1100 r C#4^3600 A#3^900 E4^600 r G4^2400 F#3^1100 F#4^3600 r G3^900 C#4^600 A#3^2400",
  "r s E4^1100 G4^3600 F#3^900 r F#4^600 G3^2400 C#4^1100 r A#3^3600 E4^900 G4^600 r F#3^2400 F#4^1100 G3^3600",
  "r s C#4^900 A#3^600 E4^2400 r G4^1100 F#3^3600 F#4^900 r G3^600 C#4^2400 A#3^1100 r E4^3600 G4^900 F#3^600",
  "r s F#4^2400 G3^1100 C#4^3600 r A#3^900 E4^600 G4^2400 r F#3^1100 F#4^3600 G3^900 r C#4^600 A#3^2400 E4^1100",
  "r s G4^3600 F#3^900 F#4^600 r G3^2400 C#4^1100 A#3^3600 r E4^900 G4^600 F#3^2400 r F#4^1100 G3^3600 C#4^900",
  "r s A#3^600 E4^2400 G4^1100 r F#3^3600 F#4^900 G3^600 r C#4^2400 A#3^1100 E4^3600 r G4^900 F#3^600 F#4^2400",
  "r s G3^1100 C#4^3600 A#3^900 r E4^600 G4^2400 F#3^1100 r F#4^3600 G3^900 C#4^600 r A#3^2400 E4^1100 G4^3600",
