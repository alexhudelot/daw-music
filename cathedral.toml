  "r s F#1 F#1 F#1 r F#1 F#1 F#1 r F#1 F#1 F#1 r F#1 F#2 F#1",
  "r s F#1 F#1 F#1 r F#1 F#1 F#1 r F#1 F#1 F#1 r F#1 F#1 F#1",
