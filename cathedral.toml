# --- acid and FM -----------------------------------------------------------------------------------------

[patterns.acid]                 # low, sliding (~), each note's cutoff (^): F#, G and the tritone; wilder on the 4th time round
acid = [
  "F#3^500 s r F#3^800 F#4~^1600 r G3^700 r F#3^500 A#3~^1200 r F#3^400 r C#4^1900 r G3~^1000 F#3^500",
  "F#3^450 s r F#3^700 E4~^1700 r F#3^500 r G3^800 r F#3^400 A#3^1300 r D4~^2100 C#4~^1600 r F#3^500",
]
"acid@4" = [
  "F#3^500 s r F#3^900 F#4~^2400 r G3^900 r F#3^600 C4~^2600 r F#3^500 r C#4^3000 r G4~^2800 F#4~^1500",
  "F#3^600 s F#3^900 F#4~^2200 E4~^1800 r F#3^700 G3^1200 G4~^3000 r F#3^500 A#3^2000 C#4~^2600 D4~^3200 C#4~^2400 A#3^1400 G3^900",
]

[patterns.metal]                # a cell of seven (F# F# G C# A# E G) on the twelve 16ths between the kicks, the cutoff on a cycle of five
