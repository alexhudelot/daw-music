[synths.drone]
# an FM pair at 1:1 (harmonic, its index low, so the 5th harmonic is some 40 dB down) and a triangle, an octave over the
# written notes and low-passed at 520 Hz: no foreign overtone (G# over E, D# over B) is left. The published one had its
# modulator a ninth up (inharmonic), whose sidebands put C# and F# under the break
osc = [
  { wave = "sine", octave = 1, mute = true },
  { wave = "sine", octave = 1, fm = 0.8, fm_by = 1, unison = { voices = 3, detune = 10, spread = 1 } },
  { wave = "triangle", octave = 1, detune = 6, level = -8 },
  { wave = "noise", level = -30 },
]
