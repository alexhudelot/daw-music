# --- the lines reworked: Lead Answer's voices (songs/lead-answer.toml), unchanged ---------------------------------
# 15e's lead: saturated saws through a talking formant beside a plucked resonant low-pass. The amp now sustains, and
# the note gate (0.74, ties *1, 32nds *0.6, ghosts *0.45) sets each hit's length. The zap's height per hit is an
# 11-step sequence times a random amount of its own; the vowel is moved per hit by a 7-step sequence, a random
# amount, a free LFO and an envelope.
[synths.lead]
osc = [
  { wave = "saw", level = -6, to = "filter", unison = { voices = 3, detune = 12, spread = 1.0 } },
  { wave = "saw", detune = 2, level = -1, to = "filter2" },
  { wave = "saw", detune = -7, level = -5, to = "filter2" },
  { wave = "pulse", width = 0.28, detune = -6, level = -5, to = "filter" },
]
drift = { pitch = 3, rate = 0.35, cutoff = 0.08 }
filter = { type = "formant", vowel = 0.0, resonance = 0.55, drive = 4 }
filter2 = { type = "low24", cutoff = 330, resonance = 0.45, drive = 6 }
shape = { drive = 6, asym = 0.7, pre = true }
level = -8
env = [
  { attack = 0.0012, hold = 0.012, decay = 0.07, sustain = 0.72, release = 0.012, curve = -1 },
  { decay = 0.016, curve = 3 },
  { attack = 0.002, decay = 0.065, curve = 3 },
  { decay = 0.07, curve = 2 },
]
lfo = [
  { shape = "smooth", rate = 0.17, free = true },
  { shape = "sine", rate = 0.29, free = true },
]
seq = [
  { steps = [0, 0.55, 1.0, 0.25, 0.8, 0.1, 0.65], step = "s", free = true },
  { steps = [1, 0.5, 0.8, 0.35, 0.95, 0.6, 0.45, 1, 0.7, 0.4, 0.85], step = "s", free = true },
]
mod = [
  ["env2", "pitch", 15, "seq2"],
  ["env2", "pitch", 10, "random+"],
  ["env2", "level", -10, "seq2"],
  ["env2", "filter2.cutoff", -1.0, "random+"],
  ["env3", "filter2.cutoff", 1.2],
  ["env3", "filter2.resonance", 0.15],
  ["env3", "filter.cutoff", 0.5],
  ["env4", "filter.vowel", 0.6],
  ["seq1", "filter.vowel", 0.3],
  ["random+", "filter.vowel", 0.2],
  ["lfo2", "filter.vowel", 0.4],
  ["lfo1", "filter2.cutoff", 0.35],
  ["lfo1", "filter.cutoff", 0.25],
  ["velocity", "level", 14],
  ["velocity", "filter2.cutoff", 0.2],
  ["velocity", "shape.drive", 5],
  ["random", "pan", 0.1],
]

# the answer: the tutorials' squelch. Two saws and a pulse an octave down, folded and clipped, through a resonant
# band-pass; the zap falls onto each note from a height of its own, the same envelope pulling the band down so it
# opens as the pitch lands; a second envelope sweeps the band as hard as the note is played. Slides between notes.
[synths.zap]
osc = [
  { wave = "saw", level = -3 },
  { wave = "saw", detune = 11, level = -7 },
  { wave = "pulse", width = 0.4, octave = -1, level = -5 },
  { wave = "sine", level = -13, to = "dry" },
]
drift = { pitch = 4, rate = 0.4, cutoff = 0.1 }
filter = { type = "band24", cutoff = 800, resonance = 0.45, drive = 9 }
filter2 = { type = "low12", cutoff = 5200, resonance = 0.1 }
shape = { drive = 7, fold = 2, asym = 0.35 }
level = -9
env = [
  { attack = 0.002, hold = 0.02, decay = 0.14, sustain = 0.62, release = 0.025, curve = 2 },
  { decay = 0.03, curve = 4 },
  { attack = 0.003, decay = 0.08, sustain = 0.15, curve = 3 },
]
lfo = [
  { shape = "triangle", rate = 0.31, free = true },
  { shape = "smooth", rate = 0.13, free = true },
]
mod = [
  ["env2", "pitch", 28, "random+"],
  ["env2", "filter.cutoff", -1.4],
  ["env3", "filter.cutoff", 2.0, "velocity"],
  ["note", "filter.cutoff", 0.7],
  ["velocity", "level", 10],
  ["lfo1", "filter.resonance", 0.12],
  ["lfo2", "filter.cutoff", 0.4],
  ["random", "filter.cutoff", 0.25],
  ["random", "pan", 0.15],
]

# the same squelch with long envelopes, played backwards: it swells into the downbeat after it
[synths.revsq]
osc = [
  { wave = "saw", level = -3 },
  { wave = "saw", detune = 14, level = -6 },
  { wave = "pulse", width = 0.4, octave = -1, level = -6 },
]
filter = { type = "band24", cutoff = 700, resonance = 0.65, drive = 8 }
shape = { drive = 6, fold = 3 }
level = -6
env = [
  { attack = 0.002, decay = 0.6, sustain = 0.0, release = 0.05, curve = 3 },
  { decay = 0.06, curve = 4 },
  { attack = 0.004, decay = 0.7, curve = 2 },
]
mod = [
  ["env2", "pitch", 24],
  ["env3", "filter.cutoff", 2.6],
]


