# "Candour": a homage to "Innocence" by The Misted Muppet, for its form and its way of building lines. Every note is written here, in
# E natural minor over a pedal E (E F# G A B C D); every sound is made here; none of it is taken from the record. Bars 1-272 change where
# its bars change. Kick, bass and percussion follow Deviant Species and Scorb, not it. Written by songs/samples/candour/gen_candour.py.
# The lines reworked (2026-11-05) on Lead Answer's method: its call voice (squelch 15e's), a band-pass squelch that answers with
# the contour inverted (the zap), and a crushed, far, orbiting copy that answers the dry call (the far voice); glitches that reply;
# each section a rhythm of its own, with rolling 16ths one texture among several.
# The kick, the bass and the drums reworked again (2026-11-05, songs/samples/candour/groove.py) to the rolling psytrance of Deviant
# Species and Scorb, by aggregate measures only: a 600-to-50 Hz kick with a click, the bass on the three 16ths after it, ducked
# clean, a growl moving per hit; a groove per section, varied each bar, with a turn every four bars, a fill every eight (hat
# ratchets, snare rolls, falling toms, cut-up buses, gaps), every stop its own fill, and the one-shots placed round the listener.
#
#   1-14     intro: one long note falling a step, three times, and far low thuds; no kick
#   15-30    kick and bass alone, nearly mono: only the bass's timbre moves
#   31-46    the call's voice held, crawling up in slides; the far voice answers each in triplets, the exchange tightening; 47 a stop
#   48-62    hats; the hollow C on the zap, a chain of dotted 8ths across the bar; a sweep at 52; the far voice's small answers; 63 a stop
#   64-77    the riff, 8ths and dotted 8ths held back from the kick, answered by the zap on C; at 72 a 16th roll answered by slides;
#            78-79 no kick, the riff alone, its reply a glitch
#   80-94    open hats, the riff answered an octave up, from two bars down to a beat; 88 8th triplets against dotted quarters; 95 no kick
#   96-108   quarters and dotted quarters beside a long crushed tone, answered in quarter triplets; 104 cells answered by glitches;
#            109 the last kick
#   110-143  break: the theme on a pluck over a pedal, then answered by the far voice, the zap joining; a low E rising from 133;
#            142 nearly nothing; 143 the roll
#   144-159  the theme on the zap, answered by the far voice, the pluck an octave over it; the call answers its gaps over ghosts
#   160-175  thin stabs in triplets and dotted-8th chains, off the beat, answered by slides; the call every four bars
#   176-199  the vowel, across the bar, answered in triplets; 187 a burst; 192 the solo, from quarters to a roll and 32nds
#   200-223  the peak: a riff leaping to the octave and its answers; the theme, the call answering its gaps; E and C swinging; 223 a roll
#   224-247  break: one long high melody, nearly a sine, twice, answered by the far voice; the theme's end returns, stabs, a low rise
#   248-271  the last run: the theme, an octave up on the pluck, the call answering, the long high line; 264 only the riff, thinning
format = "daw-song 1"
title = "Candour"
publish = true
tempo = 149
meter = "4/4"
seed = 149

[instruments]
# long notes first
wash = { synth = "wash", bus = "washb" }
air = { synth = "air", bus = "windb", gain = -3 }
wind = { synth = "wind", bus = "windb" }
drone = { synth = "drone", bus = "padb" }
low = { synth = "low", bus = "lowb" }
# the low end: shapes measured from Deviant Species and Scorb (out/candour/study/kickwave_refs.txt, kb_refs.txt)
kick = { synth = "kick", base = "E1", bus = "punch" }
kclick = { synth = "kclick", base = "E1", bus = "punch" }
bass = { synth = "bass", bus = "bass" }
bgrit = { synth = "bgrit", bus = "bgrit", octave = 1, glide = 0.02 }
# percussion: clap and snare on 2 and 4 with a short tail, ghost snares, hats in 16ths, the open hat placed, the shaker
# late, the ride and the top loop above, and the one-shots placed and moving round the listener
clap = { sound = "clap", gain = -10, bus = "drums" }
sbody = { synth = "sbody", base = "G3", bus = "drums" }
snoise = { synth = "snoise", base = "G3", bus = "drums" }
snap = { synth = "snap", base = "C4", bus = "brk" }
hat = { synth = "hat", base = "E6", bus = "hats", pan = 0.04 }
ohat = { synth = "ohat", base = "E6", bus = "ohb" }
shk = { synth = "shk", base = "C6", bus = "shkb" }
ride = { sound = "ride", gain = -21, bus = "rideb", cut = true, release = 0.25 }
top = { synth = "top", base = "C6", bus = "topb" }
topf = { synth = "top", base = "C6", bus = "topf" }
rim = { synth = "rim", base = "E5", bus = "perc" }
zip = { synth = "zip", base = "E5", bus = "zipb" }
tick = { synth = "tick", base = "C5", bus = "ticks" }
tickf = { synth = "tick", base = "C5", bus = "tickf" }
roller = { synth = "roller", base = "D3", bus = "rollb" }
tomx = { synth = "tomx", bus = "tomb" }
tomf = { synth = "tomx", bus = "farb", gain = -12 }
# the chords under the lines, the strings and the horn that support them, the single squelch hits that answer them
bed = { synth = "bed", bus = "bedb" }
str = { synth = "strings", bus = "strb", glide = 0.3, vibrato = { depth = 0.09, rate = 5.1, delay = 0.7 } }
vln = { synth = "strings", bus = "strb", gain = -3, glide = 0.3, vibrato = { depth = 0.12, rate = 5.6, delay = 0.5 } }
swl = { synth = "swell", bus = "strb" }
horn = { synth = "horn", bus = "brb", glide = 0.12, vibrato = { depth = 0.07, rate = 4.8, delay = 0.35 } }
sqh = { synth = "sqh", bus = "sqb" }
crash = { sound = "crash", gain = -18, bus = "hats" }
rcrash = { sound = "crash", gain = -17, bus = "hats", reverse = true }
impact = { sound = "impact", gain = -14 }
# the lines: Lead Answer's voices. The call (squelch 15e's voice, gated by each note's length), its crushed, far,
# orbiting copy, the band-pass squelch that answers with slides, and that squelch reversed into the entrances
lead = { synth = "lead", bus = "lead", gate = 0.74 }
far = { synth = "lead", bus = "far", gate = 0.74, gain = 6.5 }
zap = { synth = "zap", bus = "zap", gain = 7.5, gate = 0.72, glide = 0.07, glide_curve = 3, overshoot = 0.15 }
rev = { synth = "revsq", bus = "revb", reverse = true, gain = 8 }
# and the published ones kept: the intro's tone, the high line, the swing, the pluck, the pulses, the stabs, the vowel
tone = { synth = "tone", bus = "toneb", glide = 0.5, vibrato = { depth = 0.1, rate = 5.1, delay = 0.6 } }
high = { synth = "high", bus = "highb", glide = 0.16, vibrato = { depth = 0.14, rate = 5.2, delay = 0.4 } }
hollow = { synth = "hollow", bus = "hollowb", glide = 0.02 }
glass = { synth = "glass", bus = "glassb" }
pedal = { synth = "pedal", bus = "pedalb", gain = -1 }
gp = { synth = "gp", bus = "gpb" }
gplow = { synth = "gp", bus = "gpb", gain = -3 }
stab = { synth = "stab", bus = "stabb" }
vowel = { synth = "vowel", bus = "vowelb", glide = 0.08 }
sweep = { synth = "sweep", bus = "build" }
riser = { synth = "riser", bus = "build" }
fall = { synth = "fall", bus = "build" }

# --- the low end. The kick: a sine thrown from about 600 Hz to 160 Hz in 20 ms, through 100 Hz at 40 ms, 60 Hz at 90 ms and
# 54 Hz at 110 ms, level to about 110 ms and gone by 130, where the bass's first 16th has begun: the half-cycle curve of the
# Deviant Species and Scorb kicks measured (aggregates, out/candour/study/kickwave_refs.txt). An even-leaning drive warms it;
# a 7 ms click sits on it, on the same bus
[synths.kick]
osc = [{ wave = "sine", to = "dry" }, { wave = "sine", octave = 1, level = -22, to = "dry" }]
shape = { drive = 5, asym = 0.18 }
level = -1
env = [
  { attack = 0.0004, hold = 0.112, decay = 0.03, curve = 1.5, release = 0.005 },
  { decay = 0.03, curve = 3.5 },
  { decay = 0.2, curve = 2.8 },
]
mod = [["env2", "pitch", 22], ["env3", "pitch", 29], ["velocity", "level", 3], ["random", "pitch", 0.15]]

[synths.kclick]
osc = [{ wave = "noise" }, { wave = "triangle", octave = 3, level = -5 }]
filter = { type = "band12", cutoff = 4200, resonance = 0.3 }
filter2 = { type = "high12", cutoff = 1400 }
env = [{ attack = 0.0002, decay = 0.007, curve = 4, release = 0.002 }]
mod = [["velocity", "level", 6], ["random", "filter.cutoff", 0.25]]
level = -15

# the rolling bass: the three 16ths after each kick, each a pluck of its own. A sine and its octave past the filter (the
# octave 2 dB down: the warm second harmonic the references have, 3 to 5 dB under the fundamental), a saw in phase with
# them through a low-pass that snaps open at each hit, how far a value of its own each time (random+); a 2-semitone knock
# at the start. 4 to 5 dB under the kick, where the references sit
[synths.bass]
osc = [
  { wave = "sine", level = -2, to = "dry" },
  { wave = "sine", octave = 1, level = 0, to = "dry" },
  { wave = "saw", level = -8, phase = 0 },
]
filter = { type = "low24", cutoff = 400, resonance = 0.12 }
level = -4.5
env = [{ attack = 0.002, hold = 0.05, decay = 0.035, curve = 1.5, release = 0.008 }, { decay = 0.032, curve = 3 }]
mod = [["env2", "filter.cutoff", 2.0], ["env2", "filter.cutoff", 1.4, "random+"], ["velocity", "filter.cutoff", 0.8], ["env2", "pitch", 2], ["velocity", "level", 3]]

# the growl, an octave up: FM saw and a pulse, a driven low-pass into a moving vowel, folded. Each hit its own bite (random+
# on the cutoff and the fold, random on the vowel); automated besides on cycles of 5, 7, 9, 11, 13 bars
[synths.bgrit]
osc = [
  { wave = "sine", octave = 1, semi = 7, detune = 31, mute = true },
  { wave = "saw", fm = 1.5, fm_by = 1 },
  { wave = "pulse", width = 0.4, detune = 7, level = -4 },
]
filter = { type = "low24", cutoff = 700, resonance = 0.5, drive = 12 }
filter2 = { type = "formant", vowel = 1.5, resonance = 0.35 }
shape = { drive = 6, fold = 3, asym = 0.25, mix = 0.7 }
level = -17
env = [{ attack = 0.0012, hold = 0.04, decay = 0.03, curve = 1, release = 0.006 }, { decay = 0.03, curve = 3 }]
lfo = [{ shape = "triangle", rate = "q.", free = true }, { shape = "smooth", rate = "3w", free = true }]
mod = [
  ["env2", "filter.cutoff", 2.2],
  ["env2", "filter.cutoff", 1.6, "random+"],
  ["velocity", "filter.cutoff", 1.4],
  ["velocity", "level", 8],
  ["lfo1", "filter2.vowel", 0.6],
  ["random", "filter2.vowel", 0.5],
  ["lfo2", "filter.resonance", 0.12],
  ["env2", "osc2.fm", 2],
  ["random+", "shape.fold", 4],
]

# --- percussion ----------------------------------------------------------------------------------------------------
# the snare under the clap: a triangle body thrown down a fifth and a noise band, its tail on the bus
[synths.sbody]
osc = [{ wave = "triangle", to = "dry" }, { wave = "sine", semi = 7, level = -9, to = "dry" }]
shape = { drive = 5, asym = 0.1 }
env = [{ attack = 0.0003, decay = 0.09, curve = 4, release = 0.01 }, { decay = 0.022, curve = 3 }]
mod = [["env2", "pitch", 8], ["velocity", "level", 7], ["random", "pitch", 0.3]]
level = -16

[synths.snoise]
osc = [{ wave = "noise" }]
filter = { type = "band12", cutoff = 3200, resonance = 0.15 }
filter2 = { type = "high12", cutoff = 900 }
shape = { drive = 4 }
env = [{ attack = 0.0004, decay = 0.17, curve = 4, release = 0.02 }, { decay = 0.04, curve = 3 }]
mod = [["env2", "filter.cutoff", 0.8], ["random", "filter.cutoff", 0.2], ["random", "level", 1], ["velocity", "level", 10]]
level = -13

# the ghost snare: short, its brightness and level following the velocity
[synths.snap]
osc = [{ wave = "noise" }, { wave = "triangle", octave = 1, level = -14, to = "dry" }]
filter = { type = "band12", cutoff = 3600, resonance = 0.2 }
filter2 = { type = "high12", cutoff = 1100 }
env = [{ attack = 0.0008, decay = 0.06, curve = 4, release = 0.01 }, { decay = 0.02 }]
mod = [["env2", "pitch", 5], ["random", "filter.cutoff", 0.35], ["random", "level", 2], ["velocity", "filter.cutoff", 1], ["velocity", "level", 14]]
level = -10

# the closed hat: held a little (sustain), so that each hit's written gate sets its length
[synths.hat]
osc = [
  { wave = "noise", level = -5 },
  { wave = "pulse", width = 0.4, level = -6 },
  { wave = "pulse", width = 0.4, semi = 6, detune = 31, level = -8 },
  { wave = "pulse", width = 0.5, semi = 15, detune = -17, level = -9, fm = 1.5, fm_by = 2 },
]
filter = { type = "high24", cutoff = 7600, resonance = 0.22 }
level = -14
env = [{ attack = 0.0005, decay = 0.022, sustain = 0.28, curve = 4, release = 0.012 }]
mod = [["random", "filter.cutoff", 0.25], ["random", "level", 1.5], ["velocity", "level", 10], ["velocity", "filter.cutoff", -0.4]]

[synths.ohat]
osc = [
  { wave = "noise", level = -5 },
  { wave = "pulse", width = 0.4, level = -6 },
  { wave = "pulse", width = 0.4, semi = 6, detune = 31, level = -8 },
  { wave = "pulse", width = 0.5, semi = 15, detune = -17, level = -9, fm = 1.5, fm_by = 2 },
]
filter = { type = "high24", cutoff = 6400, resonance = 0.3 }
level = -14
env = [{ attack = 0.002, decay = 0.05, sustain = 0.4, curve = 3, release = 0.035 }]
mod = [["random", "filter.cutoff", 0.2], ["random+", "filter.resonance", 0.25], ["velocity", "level", 6]]

[synths.shk]
osc = [{ wave = "noise" }]
filter = { type = "band12", cutoff = 8500, resonance = 0.4 }
level = -18
env = [{ attack = 0.006, attack_curve = -2, decay = 0.03, curve = 3, release = 0.006 }]
mod = [["random", "filter.cutoff", 0.3], ["velocity", "level", 9]]

# the top loop: a ringing band of noise and a high pulse, each hit its own pitch of band and its own ring (random+)
[synths.top]
osc = [{ wave = "noise" }, { wave = "pulse", width = 0.3, octave = 2, level = -14 }]
filter = { type = "band12", cutoff = 9800, resonance = 0.45 }
level = -21
env = [{ attack = 0.0008, decay = 0.018, sustain = 0.12, curve = 3, release = 0.01 }]
mod = [["random", "filter.cutoff", 0.35], ["random+", "filter.resonance", 0.3], ["velocity", "level", 10], ["velocity", "filter.cutoff", 0.4]]

[synths.rim]
osc = [{ wave = "triangle" }, { wave = "pulse", semi = 7, level = -8 }, { wave = "noise", level = -14 }]
filter = { type = "band12", cutoff = 1900, resonance = 0.55 }
level = -15
env = [{ attack = 0.0003, decay = 0.035, curve = 4, release = 0.005 }]
mod = [["random", "filter.cutoff", 0.25], ["random", "level", 3], ["velocity", "level", 8]]

[synths.zip]
osc = [{ wave = "sine", octave = 2, mute = true }, { wave = "triangle", fm = 4, fm_by = 1 }]
filter = { type = "band12", cutoff = 3000, resonance = 0.5 }
level = -18
env = [{ attack = 0.0005, decay = 0.055, curve = 3, release = 0.006 }, { decay = 0.05, curve = 3 }]
mod = [["env2", "pitch", 24], ["env2", "pitch", 12, "random+"], ["env2", "osc2.fm", 5], ["random", "pitch", 3]]

[synths.tick]
osc = [{ wave = "pulse", width = 0.3, octave = 1 }, { wave = "noise", level = -8 }]
filter = { type = "band12", cutoff = 3200, resonance = 0.55 }
level = -19
env = [{ attack = 0.0005, decay = 0.02, curve = 3, release = 0.004 }]
mod = [["note", "filter.cutoff", 1], ["random", "filter.cutoff", 0.3], ["velocity", "level", 5]]

[synths.roller]
osc = [{ wave = "triangle", level = -4, to = "dry" }, { wave = "noise" }]
filter = { type = "band12", cutoff = 3000, resonance = 0.3 }
level = -13
env = [{ attack = 0.0005, decay = 0.09, curve = 4, release = 0.02 }, { decay = 0.025, curve = 4 }]
mod = [["env2", "pitch", 10], ["velocity", "level", 8]]

[synths.tomx]
osc = [{ wave = "sine", to = "dry" }, { wave = "triangle", semi = 7, level = -10 }, { wave = "noise", level = -24 }]
filter = { type = "low12", cutoff = 1800, resonance = 0.2 }
shape = { drive = 5 }
level = -11
env = [{ attack = 0.0008, decay = 0.24, curve = 4, release = 0.02 }, { decay = 0.05, curve = 4 }]
mod = [["env2", "pitch", 16], ["velocity", "level", 6]]

# --- the chords, the strings, the horn, the squelch hits -----------------------------------------------------------
# the bed: soft saws and a pulse, a slow low-pass breathing; high-passed and narrow on its bus, under the leads
[synths.bed]
osc = [
  { wave = "saw", level = -4, unison = { voices = 3, detune = 11, spread = 0.8 } },
  { wave = "pulse", width = 0.35, detune = -6, level = -9 },
  { wave = "triangle", octave = 1, level = -12 },
]
drift = { pitch = 4, rate = 0.3, cutoff = 0.1 }
filter = { type = "low12", cutoff = 1500, resonance = 0.12 }
level = -17
env = [{ attack = 0.35, decay = 0.6, sustain = 0.85, release = 0.9, attack_curve = -1 }]
lfo = [{ shape = "smooth", rate = 0.11, free = true }]
mod = [["lfo1", "filter.cutoff", 0.35], ["velocity", "level", 6]]

# the strings: a bowed ensemble of detuned saws, the bow brightening as it settles, each voice drifting
[synths.strings]
osc = [
  { wave = "saw", level = -3, unison = { voices = 3, detune = 14, spread = 1 } },
  { wave = "saw", detune = 6, level = -8 },
  { wave = "pulse", width = 0.25, detune = -9, level = -12 },
]
drift = { pitch = 6, rate = 0.25, cutoff = 0.08 }
filter = { type = "low12", cutoff = 1900, resonance = 0.08 }
filter2 = { type = "high12", cutoff = 180 }
level = -11
env = [{ attack = 0.55, decay = 0.8, sustain = 0.9, release = 1.4, attack_curve = -1.5 }, { attack = 0.9, decay = 1.5, sustain = 0.6 }]
lfo = [{ shape = "sine", rate = 0.17, free = true }]
mod = [["env2", "filter.cutoff", 0.9], ["lfo1", "filter.cutoff", 0.2], ["velocity", "level", 8], ["velocity", "filter.cutoff", 0.6], ["random", "pan", 0.2]]

# the swell: the same strings rising over the whole note, brightening, cut at the downbeat
[synths.swell]
osc = [
  { wave = "saw", level = -3, unison = { voices = 3, detune = 16, spread = 1 } },
  { wave = "saw", detune = 6, level = -8 },
]
filter = { type = "low12", cutoff = 700, resonance = 0.1 }
filter2 = { type = "high12", cutoff = 180 }
level = -10
env = [{ attack = "note", attack_curve = -3, release = 0.08 }, { attack = "note", attack_curve = -2, release = 0.08 }]
mod = [["env2", "filter.cutoff", 2.4], ["velocity", "level", 6]]

# the horn: two saws and a pulse under them through a low-pass that blares open with the attack, as hard as it is played
[synths.horn]
osc = [{ wave = "saw", level = -3 }, { wave = "saw", detune = 7, level = -5 }, { wave = "pulse", width = 0.45, octave = -1, level = -12 }]
filter = { type = "low24", cutoff = 550, resonance = 0.18, drive = 3 }
shape = { drive = 3, asym = 0.15 }
level = -5
env = [{ attack = 0.045, decay = 0.25, sustain = 0.8, release = 0.3, attack_curve = -1 }, { attack = 0.06, decay = 0.35, sustain = 0.45, curve = 2 }]
mod = [["env2", "filter.cutoff", 1.8, "velocity"], ["velocity", "level", 6], ["note", "filter.cutoff", 0.5]]

# the squelch hit: squelch 15e's saws and the tutorials' zap. Each hit falls onto its note from a height of its own
# through a driven band-pass that opens as it lands, then a formant whose vowel sweeps from a place of its own, up or
# down as far as a value of its own says (random, random+); folded and clipped. One hit, about 200 ms
[synths.sqh]
osc = [
  { wave = "saw", level = -3, unison = { voices = 3, detune = 14, spread = 1 } },
  { wave = "saw", detune = 9, level = -6 },
  { wave = "pulse", width = 0.35, octave = -1, level = -6 },
]
drift = { pitch = 4, rate = 0.4, cutoff = 0.1 }
filter = { type = "band24", cutoff = 900, resonance = 0.4, drive = 8 }
filter2 = { type = "formant", vowel = 1, resonance = 0.6 }
shape = { drive = 7, fold = 2, asym = 0.35 }
level = 8
env = [
  { attack = 0.002, hold = 0.05, decay = 0.16, curve = 2, release = 0.03 },
  { decay = 0.035, curve = 4 },
  { attack = 0.003, decay = 0.2, curve = 1.5 },
  { attack = 0.002, decay = 0.09, curve = 3 },
]
mod = [
  ["env2", "pitch", 14],
  ["env2", "pitch", 14, "random+"],
  ["env2", "filter.cutoff", -1.2],
  ["env4", "filter.cutoff", 2.2, "velocity"],
  ["env3", "filter2.vowel", 2.5, "random"],
  ["random+", "filter2.vowel", 1.5],
  ["note", "filter.cutoff", 0.6],
  ["random", "filter.cutoff", 0.3],
  ["velocity", "level", 8],
  ["random", "pan", 0.3],
]

# --- the lines. A simple source each, the amp held open so that a pitch stays, the brightness moving ---------------------

# the long tone, nearly a sine with a little saw; slow glides; the filter crawls by automation
[synths.tone]
osc = [{ wave = "sine", to = "dry", level = -4 }, { wave = "saw", detune = 5 }, { wave = "pulse", width = 0.42, detune = -5, level = -6 }]
filter = { type = "low12", cutoff = 1300, resonance = 0.25 }
level = -18
env = [{ attack = 0.7, attack_curve = 2, release = 1.0 }]
lfo = [{ shape = "smooth", rate = "3w", free = true }, { shape = "sine", rate = 0.21, free = true }]
mod = [["lfo1", "filter.cutoff", 0.6], ["lfo2", "osc3.width", 0.2], ["note", "filter.cutoff", 0.4]]

# the long high voice: almost a sine, breath at the start, a large hall
[synths.high]
osc = [{ wave = "sine", to = "dry" }, { wave = "triangle", detune = 4, level = -14 }, { wave = "saw", detune = -4, level = -24 }]
filter = { type = "low12", cutoff = 3200, resonance = 0.1 }
level = -16
env = [{ attack = 0.35, attack_curve = 2, release = 1.4 }]
lfo = [{ shape = "smooth", rate = "5w", free = true }]
mod = [["lfo1", "osc3.level", 7], ["note", "filter.cutoff", 0.3]]

# the middle voice: hollow, pulse-led, for the syncopated C and B above the squelch
[synths.hollow]
osc = [{ wave = "pulse", width = 0.44 }, { wave = "saw", level = -8 }]
filter = { type = "low24", cutoff = 760, resonance = 0.2, drive = 2 }
level = -15
env = [{ attack = 0.003, sustain = 1, release = 0.03 }, { attack = 0.02, decay = 0.09, curve = 3 }]
lfo = [{ shape = "smooth", rate = "2w", free = true }]
mod = [["env2", "filter.cutoff", 1.8], ["note", "filter.cutoff", 0.8], ["velocity", "level", 5], ["lfo1", "filter.cutoff", 0.4]]

# glass: the plucked theme; near a sine, ringing over a beat, its echoes carry it
[synths.glass]
osc = [{ wave = "sine", to = "dry" }, { wave = "sine", octave = 2, level = -19, to = "dry" }, { wave = "saw", level = -13 }]
filter = { type = "low24", cutoff = 900 }
level = -13
