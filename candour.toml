# --- the lines reworked: Lead Answer's chains. Its hall is the room here called mid, its throw the tape echo ------------
# the call: 15e's chain (crush, then drive; echoes, then the phaser), a slow orbit close in, reverse-reverb swells into
# the entrances, throws to the tape echo and the grain cloud; its glitch answers are stutters on this bus (below)
[buses.lead]
order = ["crush", "drive", "echoes", "phaser"]
transient = { attack = 1, sustain = 0, length = 0.012 }
crush = { rate = 6800, bits = 8, wet = 0.3 }
drive = { type = "tanh", gain = 4, asym = 0.2, level = -3 }
filter = { highpass = 170, lowpass = 6000, q = 0 }
eq = [{ type = "lowshelf", hz = 450, gain = -2 }, { hz = 1100, gain = 1.5, q = 1 }, { hz = 2400, gain = -2, q = 0.9 }, { type = "highshelf", hz = 7000, gain = -5 }]
echoes = { left = "3s", right = "5s", cross = 0.35, feedback = 0.4, lowpass = 4200, highpass = 450, diffusion = 0.8, depth = 2, rate = 0.3, wet = 0.32, dry = 1 }
flanger = { delay = 0.0025, depth = 0.0018, rate = 0.23, feedback = 0.45, wet = 0.1 }
place = { azimuth = 0, distance = 1.1, orbit = 0.21, radius = 0.2, width = 75, room = 0.1, doppler = 0.3 }
phaser = { rate = 0.27, low = 500, high = 4000, stages = 6, feedback = 0.45, wet = 0.12 }
swell = { size = 2, decay = 3, damp = 0.5, wet = 0 }
sidechain = { by = "kick", threshold = -22, ratio = 2, attack = 0.001, release = 0.05 }
send = { mid = 0.18, cloud = 0.12, shim = 0.15, echo = 0, vast = 0.05 }

# the far copy: crushed to 5 bits, folded, band-limited, flanged hard, echoed, orbiting far behind and above, phased
[buses.far]
order = ["crush", "drive"]
transient = { attack = 5, sustain = -2, length = 0.01 }
crush = { rate = 2400, bits = 5, wet = 0.85 }
drive = { type = "fold", gain = 6, level = -6, mix = 0.6 }
filter = { highpass = 350, lowpass = 5000, q = 2 }
echoes = { left = "3s", right = "4s", cross = 0.5, feedback = 0.4, lowpass = 3500, highpass = 500, diffusion = 0.9, depth = 4, rate = 0.5, wet = 0.35, dry = 1 }
flanger = { delay = 0.004, depth = 0.003, rate = 0.41, feedback = 0.6, wet = 0.5 }
place = { azimuth = 150, elevation = 20, distance = 9, orbit = 0.33, radius = 3, width = 80, room = 1.2, doppler = 0.5 }
phaser = { rate = 0.19, low = 400, high = 3500, stages = 8, feedback = 0.6, wet = 0.35 }
sidechain = { by = "kick", threshold = -22, ratio = 2, attack = 0.001, release = 0.05 }
send = { mid = 0.4, shim = 0.3, cloud = 0.25 }

# the answer: crushed lightly, then driven; a quarter-note ping-pong kept low, a phaser of its own; to one side,
# narrow, counter-orbiting, placed on a new side for each answer
[buses.zap]
order = ["crush", "drive"]
transient = { attack = 3, sustain = -2, length = 0.01 }
crush = { rate = 9000, bits = 7, wet = 0.4 }
drive = { type = "tanh", gain = 6, asym = 0.3, level = -4 }
filter = { highpass = 220, lowpass = 6500, q = 0 }
eq = [{ hz = 480, gain = 3, q = 0.9 }, { hz = 1260, gain = -4, q = 1.6 }, { hz = 2600, gain = -2, q = 1 }, { type = "highshelf", hz = 6500, gain = -5 }]
phaser = { rate = 0.37, low = 600, high = 5000, stages = 4, feedback = 0.5, wet = 0.2 }
place = { azimuth = 40, distance = 1.8, orbit = -0.13, radius = 0.5, width = 20, room = 0.2, doppler = 0.3 }
delay = { time = 0.4027, feedback = 0.3, wet = 0.16, pingpong = true, lowpass = 3200, highpass = 500 }
swell = { size = 2, decay = 3, damp = 0.5, wet = 0 }
sidechain = { by = "kick", threshold = -22, ratio = 2, attack = 0.001, release = 0.05 }
send = { mid = 0.12, cloud = 0.1, shim = 0.12, echo = 0, vast = 0.05 }

[buses.revb]
filter = { highpass = 300, lowpass = 7000, q = 0 }
phaser = { rate = 0.5, low = 500, high = 5000, stages = 6, feedback = 0.6, wet = 0.4 }
place = { azimuth = -160, distance = 3, orbit = 0.25, radius = 1.5, width = 90, room = 0.6, doppler = 0.3 }
send = { shim = 0.3, mid = 0.3 }

# the grain cloud fed from the lines: grains up to 2.5 s back, at times a fifth or an octave away, many backwards,
# fed back into a texture; far behind, turning slowly, out of the lead's band, ducked by it
[buses.cloud]
grains = { size = 0.09, density = 14, spread = 2.5, intervals = [0, 0, 7, 12, -12], pitch = 0.15, pan = 1, reverse = 0.4, feedback = 0.4, wet = 1 }
filter = { highpass = 600, lowpass = 7500, q = 0 }
eq = [{ hz = 1100, gain = -5, q = 0.7 }]
place = { azimuth = 180, distance = 4, orbit = -0.07, radius = 2, width = 140, room = 0.8, doppler = 0.2 }
sidechain = { by = "lead", threshold = -30, ratio = 3, attack = 0.003, release = 0.2 }
send = { shim = 0.25 }

# shimmering diffused echoes: a smeared stereo delay into a hall that rises in octaves
[buses.shim]
filter = { highpass = 800, lowpass = 9000, q = 0 }
echoes = { left = "3e", right = "4e", cross = 0.5, feedback = 0.6, lowpass = 6000, highpass = 700, diffusion = 0.95, depth = 6, rate = 0.2, wet = 1, dry = 0 }
hall = { size = 3, decay = 7, damp = 0.35, predelay = 0.03, early = 0.2, mod = 0.6, highpass = 600, shimmer = 0.2, interval = 12, width = 1, wet = 1, dry = 0 }
eq = [{ hz = 1100, gain = -4, q = 0.7 }]
stereo = { cross = [600], width = [0.6, 1.5] }
sidechain = { by = "lead", threshold = -32, ratio = 3, attack = 0.003, release = 0.25 }

# --- the floor ---------------------------------------------------------------------------------------------------------------
[buses.washb]
filter = { highpass = 300, lowpass = 9000, q = 0 }
stereo = { cross = [800], width = [0.9, 1.6] }
sidechain = { by = "kick", threshold = -20, ratio = 2.2, release = 0.09 }
send = { vast = 0.5 }

[buses.windb]
filter = { highpass = 200 }
stereo = { cross = [1000], width = [1.2, 1.8] }
send = { vast = 0.3 }

[buses.padb]
filter = { highpass = 90, lowpass = 900, q = 0 }
stereo = { cross = [400], width = [0.8, 1.5] }
sidechain = { by = "kick", threshold = -18, ratio = 2, release = 0.12 }
send = { vast = 0.3, mid = 0.1 }

[buses.lowb]
filter = { highpass = 30 }
width = { steps = [0] }

[buses.build]
filter = { highpass = 300 }
send = { vast = 0.25 }

# --- the returns: Haustorium (Acid)'s approved depth: room, middle distance, far hall, tape echo, a reflection on the other side -
# --- the chords, the strings, the horn, the squelch hits -----------------------------------------------------------
# the bed: nothing under 220 Hz, mono under 200, a dip where the leads speak, ducked by the kick
[buses.bedb]
filter = { highpass = 220, lowpass = 6000 }
eq = [{ type = "lowshelf", hz = 400, gain = -2 }, { hz = 2600, gain = -3, q = 0.8 }]
chorus = { delay = 0.018, depth = 0.003, rate = 0.23, wet = 0.35 }
stereo = { cross = [200], width = [0, 1.2] }
sidechain = { by = "kick", threshold = -12, ratio = 1.6, attack = 0.002, release = 0.12 }
send = { mid = 0.15 }

# the strings: in front, set back, wide above 200 Hz, a hall behind them
[buses.strb]
filter = { highpass = 170, lowpass = 9000 }
eq = [{ hz = 800, gain = 1, q = 0.7 }, { hz = 2800, gain = -2.5, q = 0.8 }]
chorus = { delay = 0.022, depth = 0.004, rate = 0.19, wet = 0.3 }
place = { azimuth = 0, elevation = 8, distance = 2.2, width = 100, room = 0.3 }
stereo = { cross = [200], width = [0, 1.25] }
sidechain = { by = "kick", threshold = -12, ratio = 1.6, release = 0.15 }
send = { vast = 0.25, mid = 0.2 }

# the horn, to the left and back
[buses.brb]
filter = { highpass = 150, lowpass = 7000 }
place = { azimuth = -25, elevation = 5, distance = 2.6, width = 20, room = 0.35 }
stereo = { cross = [200], width = [0, 1] }
send = { mid = 0.25, vast = 0.12 }

# the squelch hits: crushed, then driven; close, turning slowly; most of them sent to their echoes
[buses.sqb]
gain = 8
order = ["crush", "drive"]
crush = { rate = 7000, bits = 7, wet = 0.4 }
drive = { type = "tanh", gain = 5, asym = 0.2, level = 1 }
filter = { highpass = 200, lowpass = 6500 }
eq = [{ type = "highshelf", hz = 7000, gain = -4 }]
place = { azimuth = 0, distance = 1, orbit = 0.23, radius = 0.25, width = 40, room = 0.1, doppler = 0.3 }
sidechain = { by = "kick", threshold = -22, ratio = 2, attack = 0.001, release = 0.05 }
send = { sqd = 1.0, mid = 0.08 }

# their echoes, a dotted 8th and a dotted quarter, fed back, then placed: the repeats circle the head
[buses.sqd]
gain = 12
order = ["echoes", "place"]
echoes = { left = "e.", right = "q.", cross = 0.4, feedback = 0.55, lowpass = 3800, highpass = 400, diffusion = 0.35, depth = 2, rate = 0.3, wet = 1, dry = 0 }
place = { azimuth = 0, elevation = 15, distance = 0, orbit = 0.31, radius = 1.6, width = 60, room = 0.25, doppler = 0.5 }
sidechain = { by = "kick", threshold = -16, ratio = 1.6, release = 0.08 }
send = { vast = 0.12 }

[buses.opp]
delay = { time = 0.151, feedback = 0.25, wet = 1, dry = 0, lowpass = 3500, highpass = 500 }
autopan = { steps = [-0.45, -0.3, -0.1, 0.1, 0.3, 0.45, 0.3, 0.1, -0.1, -0.3], step = "h", smooth = 0.1 }
send = { mid = 0.2 }

[buses.mid]
hall = { size = 1.6, decay = 2.2, damp = 0.55, predelay = 0.035, early = 0.4, mod = 0.4, highpass = 450, width = 1, wet = 1, dry = 0 }
stereo = { cross = [500], width = [0.3, 1.4] }
sidechain = { by = "kick", threshold = -22, ratio = 2.5, release = 0.1 }

[buses.room]
hall = { size = 0.6, decay = 0.7, damp = 0.45, predelay = 0.004, early = 0.9, highpass = 400, width = 1, wet = 1, dry = 0 }
stereo = { cross = [500], width = [0.5, 1.2] }

[buses.echo]
tape = { time = "e.", feedback = 0.36, wow = 0.3, flutter = 0.1, drive = 5, tone = 3400, lowcut = 450, wet = 1, dry = 0 }
stereo = { cross = [500], width = [0.3, 1.5] }
sidechain = { by = "kick", threshold = -22, ratio = 3, release = 0.08 }
send = { vast = 0.3 }

[buses.vast]
filter = { highpass = 150 }
hall = { size = 4, decay = 8, damp = 0.32, predelay = 0.06, early = 0.25, mod = 0.6, highpass = 140, shimmer = 0.1, width = 1, wet = 1, dry = 0 }
eq = [{ hz = 2800, gain = -2.5, q = 0.8 }, { type = "highshelf", hz = 6000, gain = -2 }]
stereo = { cross = [300], width = [0.4, 1.4] }
sidechain = { by = "kick", threshold = -24, ratio = 3, release = 0.11 }

[master]
drive = { gain = 1, level = -1 }
eq = [{ hz = 400, gain = -1, q = 0.8 }, { hz = 3000, gain = 1.5, q = 0.6 }, { type = "highshelf", hz = 8000, gain = 1.5 }]
filter = { highpass = 25 }
stereo = { cross = [120], width = [0, 1] }
limiter = { ceiling = -3.4, release = 0.06 }
loudness = -8.8

