filter2 = { type = "low12", cutoff = 3600 }
env = [{ attack = 0.05, attack_curve = -1, decay = 0.5, sustain = 0.85, release = 0.35 }, { attack = 0.004, decay = 0.22, curve = 1 }]
lfo = [{ shape = "sine", rate = 5.3, delay = 0.3, fade = 0.35 }, { shape = "smooth", rate = 0.7 }]
mod = [["env2", "filter.vowel", 2.6], ["lfo1", "pitch", 0.16], ["lfo2", "filter.vowel", 0.25], ["random", "filter.vowel", 0.25], ["velocity", "level", 5]]
level = 0

# a breath before a phrase: noise through an "ah", swelling in
[synths.vbreath]
