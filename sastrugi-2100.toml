env = [{ attack = 0.16, attack_curve = -2, decay = 0.06, sustain = 0, release = 0.04 }]
level = -30

# the vocal's chops: the same voice cut short, a vowel of its own each note
[synths.vchop]
osc = [{ wave = "saw", unison = { voices = 2, detune = 6, spread = 0.3 } }, { wave = "pulse", width = 0.2, level = -8 }]
filter = { type = "formant", vowel = 1.5, resonance = 0.65 }
