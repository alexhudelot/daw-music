# "Sastrugi (2100 Mix)": Sastrugi as racing music for hovercraft in 2100. Drum and bass, 180 BPM, 192 bars, about
# 4:16. The baseline milestone kept whole (one six-note motif developed by rule, the zap's mirrored answer from above,
# eight-bar phrases, the register journey to the C6 crown, segues of fills into glitches), driven, and paced: trance
# stabs answering the lead with the motif backwards, glass runs built from the motif's cells, effects in call and
# answer, engines, fly-bys, whooshes and a pit radio; three mid voices (the keel, a reese pluck; the vox, a formant
# voice; the comps) under the high synths; four tangents that go somewhere else for four bars and veer back.
# v3: the theme stated plainly through the first third and let settle; its variations coming in more and more after
# that, thickest in the last third and the climax. The drums technical by placement, not by more hits (flams, drags,
# backbeats displaced, the kick pushed, triplet ratchets, hats varied bar by bar), lean where each drop starts and
# growing to the climax; never the full 16th grid; every phrase breathes, and the silences are longer, the tails
# shut through them. The growl more present and alive: its vowel turning over two bars, its fold breathing over
# eight and different each hit, the octave scooped now and then; the kick still on top. Now and then the lead's
# tail leaps up a register (never over F6): once in the first third, three times in the middle, nine in the last.
# v4: a harmonic floor under the leads and keys that drive. The field strikes, and a new bed holds, the chords the
# bass loop implies (F minor 9, D flat major 7, B flat minor 7, E flat 9), voiced to move by step in the low mids;
# the epic pad follows them in the breakdown and the climax; an arp rolls their notes in 3-3-2 under the leads,
# growing with the variations. The keys: F minor to 102; F major at 103-104 (G minor's flat 7) lifts drop 2 a
# tone, into G minor (105-136, its tangent in B flat major); zero-g and build 3's first half still in G minor (137-142).
# v5: the second lift on the climax's downbeat: G flat major at 143-144 (A flat minor's flat 7, slid up from G minor's
# F) lands the climax a semitone up, in A flat minor (145-158), its leaps crowned on the third beat with the tonic,
# A flat 6, a fourth over the line; 157-160 D flat minor, E flat 9, and home in F minor at 161. The sub's loop keeps
# its shape and rises with each key; the bed sits back and darker under drop 2, the climax and home.
# v6: a hook, sung. A formant vocal sings the motif's head in 3-3-2, landing on long notes (17 plain and filtered;
# 73 with the piano's chords; its first half in zero-g, 137; whole and full as the climax's answer, 153), chopped in
# the drops (108, 168). The dual tone that ends the song (the glint's hint, A flat up to F, ringing through its echoes
# and the hall) answers earlier too (44, 50, 52, 116, 138, 140, 156). The stops are never dead: the dry buses are cut,
# the halls and echoes ring on, and the pad, the wind and the vocal hold through the long ones. 121-136 THE PIT LANE
# for tangent 3 and its variations: the drums and the bass alone trading with crushed formant voices.
# Every sound is made here; the glitches are its own sounds. Written by songs/samples/sastrugi-2100/make.py.
#
#   1-8      the field alone, dark; wind far off; the pit radio chatters the motif's head at 7
#   9-16     the hint (TRUNCATION), filtered; the break's top, quiet ticks from 13; the radio at 15; a craft far off
#   17-24    half-time; THE HOOK sung plainly, filtered, by the vocal alone; the vox enters, singing the field's middle
#   25-32    the head DISPLACED BY AN 8TH; the held stabs gated and dark; the engine and the runs spin faster and faster
#            round the head; 32 the stutter, then a beat cut, the halls ringing
#   33-48    DROP 1, lean: two-step, 8th hats placed differently each bar, few ghosts, a flam on the backbeat. The motif
#            STATED, the EXTENSION; stated again, the head alone; the stabs answer with the RETROGRADE; the keel's
#            counter-lines. From 41 the drags and a late backbeat; 44 the DUAL TONE; 48 half a bar cut, the halls ringing
#   49-52    TANGENT 1, a lull: no drums but a far kick, D flat major over a pedal; the keel sings the motif plainly, an
#            octave down, then HELD; the piano's chords; the glint answers with the dual tone; 52 the ghosts roll back alone
#   53-64    CALL AND ANSWER (the head twice, the mirror, the runs' CLIMB); the motif as stated, its fourth cell in 8ths;
#            the answers passed round: zap, stabs, keel (flanged), zap; the comps skank; the ride on the off-beats
#   65-72    drop 1's peak, the first variation: the motif's INTERVAL EXPANSION; the keel a third under; broken 16ths;
#            71-72 SEGUE 1, a craft past, lifted, into the breakdown
#   73-80    BREAKDOWN: no drums; THE HOOK, the vocal and the piano's chords; the epic pad on the chords; the radio at 80
#   81-84    TANGENT 2, the dorian lift: B flat 9 and E flat major 7 (D natural); the motif in TRIPLETS, then expanded
#            with the D; the vox sings the colours and veers back reversed
#   85-88    the call and answer augmented; the runs far off
#   89-96    half-time; the zap's hook displaced, the runs' RATCHET; the keel in 3-3-2; from 93 the stabs, gated
#   97-104   BUILD 2: the head once a bar, the sequence's head; the engine and the runs spin up; SEGUE 2, a craft past;
#            103-104 on F major, the lift's setup
#   105-112  DROP 2, a tone up, G MINOR: the SEQUENCE TO C; the zap (106, 110) and the stabs (108, 112) answer in turn; the keel; the vocal chopped (108)
#   113-120  the sequence, its leap EXPANDED to C6, in 8ths; flams on both backbeats, broken 16ths and the ride from 117;
#            the dual tone (116); the runs' CLIMB stuttered, the formant voices' pickup (120)
#   121-136  THE PIT LANE: no leads, no pads but the bed far down; the drums at their most technical and the bass in
#            sequences (16ths and rests, octave jumps, the flat 7 and the fifth), trading with two crushed formant voices
#            in the chords' tones: a bar for a half-bar (121-128), a half for a half (129-132, left and right in turn),
#            beat for beat (133-134), 8th for 8th (135), downsampled harder as it tightens; 136 the fill with both
#            voices, then a drop-out, the runs' CASCADE alone
#   137-140  TANGENT 4, zero-g, still in G MINOR: no drums, no bass; THE HOOK's first half sung, the dual tone answering; the vox and the epic pad;
#            140 the rest cut, the pad, the vocal and the dual tone ringing on
#   141-144  BUILD 3, on C minor then G FLAT MAJOR (143-144, the lift's flat 7): the head, the climax's head; the stabs gated; three craft past, each closer and faster, lifted; the
#            spin at its fastest; the glint sits out 143-144; half a bar cut, the vocal swelling backwards into
#   145-152  THE CLIMAX, a semitone up on its downbeat, in A FLAT MINOR: the SEQUENCE TO E FLAT, DISPLACED and HELD, each crowned on beat 3
#            with the tonic an octave up (A flat 6, as heard), the C6 crown; the zap above it, in TRIPLETS, DISPLACED;
#            the keel in HEMIOLA; the stabs on every off-beat; the most drum technique (tom ghosts, drags, displaced
#            backbeats, ratchets); the air up
#   153-160  THE CLIMAX'S ANSWER: THE HOOK whole, the vocal and the piano's chords for the glint; the zap's RETROGRADE
#            INVERSION, then displaced, between its phrases; the dual tone at 156; 157-160 D flat minor and E flat 9,
#            F minor's flat 7; three beats cut, the vocal's F held into the halls
#   161-168  HOME, F minor again, a step down: the motif, then all it became (ROTATION, TRIPLETS, LIQUIDATION); the zap's mirror,
#            closing, backwards; the piano's chords; the hook's head chopped (168); the tape stop
#   169-184  the drums leave by layers; the hint again, closing; the radio at 176 and 182; a last craft far off
#   185-192  the field alone, softer each time; the wind going far away
format = "daw-song 1"
title = "Sastrugi (2100 Mix)"
publish = true
tempo = 180
meter = "4/4"
seed = 2100
humanise = 1.0

[instruments]
kbody = { synth = "kbody", base = "Ab1", bus = "kick" }
kclick = { synth = "kclick", base = "Ab1", bus = "kick" }
sbody = { synth = "sbody", base = "G3", bus = "snare" }
snoise = { synth = "snoise", base = "G3", bus = "snare" }
ssnap = { synth = "snap", base = "G3", bus = "snare" }
sclap = { sound = "clap", gain = -17, bus = "snare" }
ghost = { synth = "ghost", base = "G3", bus = "brk" }
rim = { synth = "rim", base = "C5", bus = "brk", pan = 0.18 }
hat = { synth = "hat", base = "C6", bus = "hats", pan = -0.15 }
hatl = { synth = "hat", base = "C6", bus = "late", pan = 0.2 }
ohat = { synth = "ohat", base = "C6", bus = "hats", pan = -0.1 }
tick = { synth = "tick", base = "C6", bus = "tops" }
shk = { synth = "shk", base = "C6", bus = "shkb" }
ride = { sound = "ride", gain = -24, pan = 0.25, bus = "hats", cut = true, release = 0.25 }
tom = { sound = "tom", gain = -9, bus = "toms" }
sub = { synth = "sub", bus = "sub", glide = 0.1, glide_curve = 3 }
growl = { synth = "growl", bus = "mid", glide = 0.08, glide_curve = 2 }
field = { synth = "field", bus = "field" }
aurora = { synth = "aurora", bus = "aurora" }
auratop = { synth = "aurora", bus = "aurora", gain = 8, glide = 0.2, glide_curve = 3, legato = true }
wind = { synth = "wind", bus = "atmos" }
riser = { synth = "riser", bus = "rise" }
rcrash = { sound = "crash", gain = -14, bus = "fx", reverse = true, cut = true, release = 0.01 }
crash = { sound = "crash", gain = -17, bus = "fx" }
impact = { sound = "impact", gain = -12, bus = "fx" }
glint = { synth = "glint", bus = "l1", glide = 0.05, glide_curve = 3 }
zap = { synth = "zap", bus = "l2", glide = 0.04, glide_curve = 3 }
stab = { synth = "hyper", bus = "stab", gate = 0.5 }
stabh = { synth = "hyperh", bus = "stabg", gate = 0.9 }
run = { synth = "ion", bus = "runs", gate = 0.7 }
radio = { synth = "radio", bus = "radio", gate = 0.8 }
static = { synth = "static", bus = "radio" }
engine = { synth = "engine", bus = "rise" }
engfly = { synth = "engfly", bus = "eng" }
whoosh = { synth = "whoosh", bus = "wsh" }
chC = { sample = "samples/sastrugi-2100/tailc.flac", base = "C4", bus = "chop", cut = true, release = 0.004, gain = -3 }
chR = { sample = "samples/sastrugi-2100/tail.flac", base = "C4", bus = "chop", reverse = true, cut = true, release = 0.01, gain = -4 }
chF = { sample = "samples/sastrugi-2100/fillb.flac", base = "C4", bus = "chop", cut = true, release = 0.004, gain = -4 }
chP = { sample = "samples/sastrugi-2100/padc.flac", base = "C4", bus = "chop", cut = true, release = 0.006, gain = -4 }
chPr = { sample = "samples/sastrugi-2100/padc.flac", base = "C4", bus = "aurora", reverse = true, cut = true, release = 0.01, gain = -2 }
chS = { sample = "samples/sastrugi-2100/stabc.flac", base = "C4", bus = "chop", cut = true, release = 0.004, gain = -6 }
keel = { synth = "keel", bus = "keel", glide = 0.05, glide_curve = 3 }
vox = { synth = "vox", bus = "vox" }
comp = { synth = "comp", bus = "comp", gate = 0.6 }
bed = { synth = "bed", bus = "bed" }
arp = { synth = "arp", bus = "arp", gate = 0.6 }
chN = { sample = "samples/sastrugi-2100/runc.flac", base = "C4", bus = "chop", reverse = true, cut = true, release = 0.01, gain = -4 }
voc = { synth = "voc", bus = "voc", glide = 0.07, glide_curve = 3 }
vrev = { synth = "voc", bus = "vrev", reverse = true }
vbreath = { synth = "vbreath", bus = "voc" }
vchop = { synth = "vchop", bus = "vch", gate = 0.8 }
pno = { sound = "piano", bus = "pno", gain = -10 }
fmt = { synth = "fmt", bus = "fmtb", gate = 0.85 }
fmx = { synth = "fmt", bus = "fmxb", gate = 0.85 }
fieldn = { synth = "field", bus = "fieldn" }
arpn = { synth = "arp", bus = "arpn", gate = 0.6 }

# --- drums: every hit is two or three layers; tighter than Sastrugi's, for 180 ------------------------------------------

# the kick's body: a sine falling from two and a half octaves up onto A flat 1 in 24 ms, a slower knock under it, held
# 40 ms, gone in 0.21 s: shorter than Sastrugi's, so the 16ths between kicks stay clear
[synths.kbody]
osc = [{ wave = "sine", to = "dry" }, { wave = "sine", octave = 1, level = -20, to = "dry" }]
shape = { drive = 5, asym = 0.1 }
env = [{ attack = 0.0005, hold = 0.042, decay = 0.185, curve = 2.5, release = 0.01 }, { decay = 0.024, curve = 5 }, { decay = 0.09, curve = 2 }]
mod = [["env2", "pitch", 31], ["env3", "pitch", 9], ["velocity", "level", 4], ["random", "pitch", 0.2]]
level = -1

# its click: noise and a high triangle through a band-pass, 12 ms, louder
[synths.kclick]
osc = [{ wave = "noise" }, { wave = "triangle", octave = 3, level = -6 }]
filter = { type = "band12", cutoff = 4000, resonance = 0.3 }
filter2 = { type = "high12", cutoff = 1300 }
env = [{ attack = 0.0002, decay = 0.012, curve = 4, release = 0.003 }]
mod = [["velocity", "level", 6], ["random", "filter.cutoff", 0.2]]
level = -11

[synths.sbody]
osc = [{ wave = "triangle", to = "dry" }, { wave = "sine", semi = 7, level = -9, to = "dry" }]
shape = { drive = 6, asym = 0.1 }
env = [{ attack = 0.0003, decay = 0.1, curve = 4, release = 0.01 }, { decay = 0.022, curve = 3 }]
mod = [["env2", "pitch", 10], ["velocity", "level", 6], ["random", "pitch", 0.3]]
level = -13

[synths.snoise]
osc = [{ wave = "noise" }]
filter = { type = "band12", cutoff = 3200, resonance = 0.12 }
filter2 = { type = "high12", cutoff = 850 }
shape = { drive = 5 }
env = [{ attack = 0.0004, decay = 0.17, curve = 4, release = 0.02 }, { decay = 0.035, curve = 3 }]
mod = [["env2", "filter.cutoff", 0.8], ["random", "filter.cutoff", 0.2], ["random", "level", 1], ["velocity", "level", 8]]
level = -12

# the snap: a 35 ms burst of noise high up, on the backbeats only: the snare's front
[synths.snap]
osc = [{ wave = "noise" }, { wave = "pulse", width = 0.2, octave = 3, level = -10 }]
filter = { type = "band12", cutoff = 5200, resonance = 0.25 }
filter2 = { type = "high12", cutoff = 2400 }
env = [{ attack = 0.0002, decay = 0.035, curve = 4, release = 0.004 }]
mod = [["velocity", "level", 8], ["random", "filter.cutoff", 0.15]]
level = -12

[synths.ghost]
osc = [{ wave = "noise" }, { wave = "triangle", octave = 1, level = -14, to = "dry" }]
filter = { type = "band12", cutoff = 3400, resonance = 0.2 }
filter2 = { type = "high12", cutoff = 1000 }
env = [{ attack = 0.0008, decay = 0.06, curve = 4, release = 0.01 }, { decay = 0.02 }]
mod = [["env2", "pitch", 5], ["random", "filter.cutoff", 0.35], ["random", "level", 2], ["velocity", "filter.cutoff", 1], ["velocity", "level", 14]]
level = -8

[synths.rim]
osc = [{ wave = "triangle" }, { wave = "pulse", semi = 7, level = -8 }]
filter = { type = "band12", cutoff = 1800, resonance = 0.55 }
env = [{ attack = 0.0003, decay = 0.035, curve = 4, release = 0.005 }]
mod = [["random", "filter.cutoff", 0.15], ["random", "level", 3], ["velocity", "level", 8]]
level = -14

[synths.hat]
osc = [{ wave = "noise", level = -5 }, { wave = "pulse", width = 0.4, level = -6 }, { wave = "pulse", width = 0.4, semi = 6, detune = 31, level = -8 }, { wave = "pulse", width = 0.5, semi = 15, detune = -17, level = -9, fm = 1.5, fm_by = 2 }]
filter = { type = "high24", cutoff = 7600, resonance = 0.22 }
env = [{ attack = 0.0005, decay = 0.036, curve = 4, release = 0.01 }]
mod = [["random", "filter.cutoff", 0.25], ["random", "level", 1.5], ["velocity", "level", 9], ["velocity", "filter.cutoff", -0.4]]
level = -14

[synths.ohat]
osc = [{ wave = "noise", level = -5 }, { wave = "pulse", width = 0.4, level = -6 }, { wave = "pulse", width = 0.4, semi = 6, detune = 31, level = -8 }, { wave = "pulse", width = 0.5, semi = 15, detune = -17, level = -9, fm = 1.5, fm_by = 2 }]
filter = { type = "high24", cutoff = 6300, resonance = 0.28 }
env = [{ attack = 0.002, decay = 0.17, curve = 3, release = 0.02 }]
mod = [["random", "filter.cutoff", 0.2], ["velocity", "level", 6]]
level = -17

# the tick: a 16 ms click of noise and a square at the top, in 16ths, the drive under the hats
[synths.tick]
osc = [{ wave = "noise" }, { wave = "pulse", width = 0.3, octave = 3, semi = 5, level = -9 }]
filter = { type = "high24", cutoff = 9000, resonance = 0.3 }
env = [{ attack = 0.0003, decay = 0.016, curve = 4, release = 0.004 }]
mod = [["random", "filter.cutoff", 0.2], ["velocity", "level", 10]]
level = -28

[synths.shk]
osc = [{ wave = "noise" }]
filter = { type = "band12", cutoff = 8500, resonance = 0.4 }
env = [{ attack = 0.006, attack_curve = -2, decay = 0.03, curve = 3, release = 0.006 }]
mod = [["random", "filter.cutoff", 0.3], ["velocity", "level", 9]]
level = -19


# --- the low end ------------------------------------------------------------------------------------------------------

[synths.sub]
osc = [{ wave = "sine" }, { wave = "sine", octave = 1, level = -18 }]
shape = { drive = 3, asym = 0.1 }
env = [{ attack = 0.004, release = 0.04 }]
level = -4

# the growl, with more bite than Sastrugi's: a deeper pluck, its depth a height of its own each note (`random+`), the
# steps opening further, more resonance and fold. Stepped as before: seq1 the cutoff, seq2 the vowel, every 16th.
# v3, more character: the vowel turning slowly over two bars (lfo1) and a little differently each hit (random), the
# fold breathing over eight bars (lfo2) and as hard as each hit's own (random+), so no two hits and no two phrases
# growl alike
[synths.growl]
osc = [{ wave = "saw", detune = -7 }, { wave = "saw", detune = 7, phase = 0.3 }, { wave = "pulse", width = 0.35, octave = -1, level = -6 }]
drift = { pitch = 5, rate = 0.4, cutoff = 0.12 }
filter = { type = "low24", cutoff = 420, resonance = 0.42, drive = 11 }
filter2 = { type = "formant", vowel = 0.5, resonance = 0.45 }
shape = { drive = 7, fold = 2.5, asym = 0.15, mix = 0.6 }
env = [{ attack = 0.003, release = 0.03 }, { attack = 0.002, decay = 0.11, curve = 3 }]
seq = [{ steps = [0, 0.9, 0.3, 1.2, 0.1, 0.7, 1.4, 0.2, 0.5, 0, 1.0, 0.4, 0.8, 0.2, 1.3, 0.6], step = "s", glide = 0.01, free = true }, { steps = [0, 2.5, 1, 3.5, 0.5, 2, 3, 1.5], step = "s", glide = 0.018, free = true }]
lfo = [{ shape = "smooth", rate = "2w", free = true }, { shape = "sine", rate = "8w", free = true }]
mod = [["env2", "filter.cutoff", 1.5], ["env2", "filter.cutoff", 1.0, "random+"], ["seq1", "filter.cutoff", 1.15], ["seq2", "filter2.vowel", 1], ["velocity", "filter.cutoff", 0.6], ["velocity", "level", 3],
       ["lfo1", "filter2.vowel", 1.1], ["random", "filter2.vowel", 0.6], ["lfo2", "shape.fold", 3], ["random+", "shape.fold", 3], ["lfo2", "filter.cutoff", 0.25]]
level = -7


# --- the field, the epic pad, the wind and the riser, as in Sastrugi -------------------------------------------------------
[synths.field]
osc = [{ wave = "pulse", width = 0.45, unison = { voices = 3, detune = 9, spread = 0.6 } }, { wave = "saw", detune = 6, level = -11 }, { wave = "triangle", octave = -1, level = -9 }]
drift = { pitch = 4, rate = 0.25, cutoff = 0.1 }
filter = { type = "low24", cutoff = 650, resonance = 0.12, drive = 2 }
env = [{ attack = 0.006, decay = 1.6, sustain = 0.28, curve = 2, release = 0.8 }, { attack = 0.01, decay = 0.9, curve = 2 }]
mod = [["env2", "filter.cutoff", 1.1], ["velocity", "filter.cutoff", 0.7], ["velocity", "level", 4]]
level = -17

[synths.aurora]
osc = [{ wave = "pulse", width = 0.38, unison = { voices = 5, detune = 16, spread = 0.8 } }, { wave = "saw", level = -10, unison = { voices = 3, detune = 11, spread = 0.8 } }, { wave = "sine", octave = -1, level = -11 }]
drift = { pitch = 6, rate = 0.2, cutoff = 0.15 }
filter = { type = "low24", cutoff = 3000, resonance = 0.12 }
env = [{ attack = 1.2, attack_curve = -1, decay = 2, sustain = 0.8, release = 2.5 }]
lfo = [{ shape = "smooth", rate = "2w", free = true }]
mod = [["lfo1", "filter.cutoff", 0.35], ["note", "filter.cutoff", 0.3]]
level = -32

[synths.wind]
osc = [{ wave = "noise" }]
filter = { type = "band12", cutoff = 450, resonance = 0.75 }
filter2 = { type = "band12", cutoff = 1500, resonance = 0.6 }
filters = "parallel"
env = [{ attack = 3, release = 4 }]
lfo = [{ shape = "smooth", rate = "w", free = true }, { shape = "smooth", rate = "h.", free = true }]
mod = [["lfo1", "filter.cutoff", 1.3], ["lfo2", "filter2.cutoff", 1.1], ["lfo1", "pan", 0.5], ["lfo2", "level", 4]]
level = -26

[synths.riser]
osc = [{ wave = "noise" }, { wave = "saw", unison = { voices = 3, detune = 20, spread = 0.9 }, level = -16 }]
filter = { type = "band12", cutoff = 400, resonance = 0.45 }
env = [{ attack = "note", attack_curve = -2, release = 0.25 }, { attack = "note", attack_curve = -2 }]
mod = [["env2", "filter.cutoff", 4], ["env2", "pitch", 12]]
level = -22


# --- the leads, as in Sastrugi ------------------------------------------------------------------------------------------
[synths.glint]
osc = [{ wave = "triangle" }, { wave = "pulse", width = 0.3, detune = 5, level = -5, unison = { voices = 3, detune = 8, spread = 0.15 } }, { wave = "sine", level = -6, to = "dry" }]
drift = { pitch = 4, rate = 0.35, cutoff = 0.1 }
filter = { type = "low24", cutoff = 1050, resonance = 0.3, drive = 2 }
env = [{ attack = 0.004, decay = 0.45, sustain = 0.62, release = 0.26 }, { attack = 0.006, decay = 0.05, curve = 3 }]
lfo = [{ shape = "sine", rate = 5.2, delay = 0.25, fade = 0.25 }]
seq = [{ steps = [0.2, 0, 0, 0.7, 0, 0, 0.9, 0, 0.1, 0, 0.3, 0.6, 0.4, 0, 0.1, 0], step = "s", glide = 0.01, free = true }]
mod = [["env2", "filter.cutoff", 0.6], ["env2", "filter.cutoff", 0.8, "velocity"], ["note", "filter.cutoff", 0.8], ["seq1", "filter.cutoff", 0.8], ["velocity", "filter.cutoff", 0.6], ["velocity", "level", 5], ["lfo1", "pitch", 0.12]]
level = -15

[synths.zap]
osc = [{ wave = "saw" }, { wave = "triangle", level = -9, to = "dry" }]
drift = { pitch = 3, rate = 0.3, cutoff = 0.15 }
filter = { type = "band24", cutoff = 1300, resonance = 0.28, drive = 8 }
shape = { drive = 5, asym = 0.12, mix = 0.5 }
env = [{ attack = 0.0015, hold = 0.045, decay = 0.13, sustain = 0.4, curve = 3, release = 0.055 }, { decay = 0.06, curve = 4 }]
seq = [{ steps = [0, 0.5, -0.3, 0.8, 0.2, -0.2, 0.9, 0, 0.4, -0.4, 0.6, 0.1, 0.7, -0.1, 0.3, 0.5], step = "s", glide = 0.008, free = true }, { steps = [0, 0.15, 0.05, 0.22], step = "s", free = true }]
mod = [["env2", "pitch", 9], ["env2", "pitch", 14, "random+"], ["env2", "filter.cutoff", -1.3], ["seq1", "filter.cutoff", 0.7], ["seq2", "filter.resonance", 1], ["random", "filter.cutoff", 0.3], ["note", "filter.cutoff", 0.5], ["velocity", "filter.cutoff", 0.5], ["velocity", "level", 5]]
level = -7.5


# --- new in the 2100 Mix --------------------------------------------------------------------------------------------------

# hyper, the trance stab: seven saws spread wide and detuned 24 cents, three more an octave up, a pulse an octave under;
# a 24 dB low-pass that snaps open at each chord and shuts over 0.3 s, as far as the chord is hard (velocity scales the
# route) and a little further at random (`random+`), so no two stabs open alike. Short: it decays to a third.
[synths.hyper]
osc = [{ wave = "saw", unison = { voices = 7, detune = 24, spread = 0.9 } }, { wave = "saw", octave = 1, level = -11, unison = { voices = 3, detune = 14, spread = 0.8 } }, { wave = "pulse", width = 0.5, octave = -1, level = -13 }]
drift = { pitch = 5, rate = 0.3, cutoff = 0.08 }
filter = { type = "low24", cutoff = 950, resonance = 0.24, drive = 4 }
env = [{ attack = 0.0015, decay = 0.24, sustain = 0.32, curve = 3, release = 0.11 }, { attack = 0.001, decay = 0.3, curve = 3 }]
mod = [["env2", "filter.cutoff", 1.4], ["env2", "filter.cutoff", 2.2, "velocity"], ["env2", "filter.cutoff", 0.8, "random+"], ["note", "filter.cutoff", 0.5], ["velocity", "level", 5]]
level = -23

# the same held, for the builds: it sustains, its filter barely plucked, so the bus's trance gate and its low-pass
# sweep do the moving
[synths.hyperh]
osc = [{ wave = "saw", unison = { voices = 7, detune = 26, spread = 0.95 } }, { wave = "saw", octave = 1, level = -12, unison = { voices = 3, detune = 14, spread = 0.8 } }, { wave = "pulse", width = 0.5, octave = -1, level = -13 }]
drift = { pitch = 6, rate = 0.25, cutoff = 0.08 }
filter = { type = "low24", cutoff = 1400, resonance = 0.26, drive = 3 }
env = [{ attack = 0.004, decay = 0.6, sustain = 0.8, curve = 2, release = 0.2 }, { attack = 0.001, decay = 0.3, curve = 3 }]
mod = [["env2", "filter.cutoff", 0.8], ["note", "filter.cutoff", 0.4], ["velocity", "level", 4]]
level = -25

# ion, the runs' voice: glass. A sine phase-modulated by a sine an octave up (FM), the modulation thrown open at each
# note and closing in 40 ms, as far as velocity and chance say; a thin pulse under it for an edge; keytracked low-pass.
# At 24 notes a second it is a shimmer of struck glass, not a buzz.
[synths.ion]
osc = [{ wave = "sine", octave = 1, mute = true }, { wave = "sine", fm = 0.8, fm_by = 1 }, { wave = "pulse", width = 0.22, detune = 6, level = -12 }]
drift = { pitch = 3, rate = 0.4 }
filter = { type = "low12", cutoff = 2600, resonance = 0.2 }
env = [{ attack = 0.001, decay = 0.11, sustain = 0.3, curve = 3, release = 0.05 }, { decay = 0.04, curve = 4 }]
mod = [["env2", "osc2.fm", 2.4], ["env2", "osc2.fm", 2.0, "random+"], ["env2", "filter.cutoff", 1.2, "velocity"], ["note", "filter.cutoff", 0.7], ["velocity", "level", 6], ["random", "pan", 0.25]]
level = -12

# radio, the pit radio: a saw and a pulse through a formant whose vowel jumps every 16th triplet and at random each
# note (so it chatters), a band-pass, and a hard shaper: a voice made from a synth, heard through a cheap speaker
[synths.radio]
osc = [{ wave = "saw", detune = -5 }, { wave = "pulse", width = 0.3, detune = 5, level = -3 }]
filter = { type = "formant", vowel = 1, resonance = 0.6 }
filter2 = { type = "band12", cutoff = 1700, resonance = 0.4, drive = 10 }
shape = { drive = 12, asym = 0.25, mix = 0.7 }
env = [{ attack = 0.002, decay = 0.07, sustain = 0.55, curve = 3, release = 0.03 }]
seq = [{ steps = [0, 3, 1, 4, 2, 0.5, 3.5, 1.5, 2.5], step = "s3", free = true }]
mod = [["seq1", "filter.vowel", 1], ["random", "filter.vowel", 1.2], ["random", "pitch", 0.3], ["velocity", "level", 6]]
level = -9

# the radio's static: a 50 ms burst of band-passed noise at each end of a transmission
[synths.static]
osc = [{ wave = "noise" }]
filter = { type = "band12", cutoff = 2400, resonance = 0.35 }
env = [{ attack = 0.001, decay = 0.05, curve = 2, release = 0.01 }]
mod = [["random", "filter.cutoff", 0.5], ["velocity", "level", 6]]
level = -15

# engine: a hovercraft revving. Two saws and a pulse an octave down through a driven low-pass, the level throbbing at
# 26 Hz (the engine's beat); over the note the pitch climbs 19 semitones, the throb speeds up an octave and a half and
# the filter opens three octaves: a riser that is an engine
[synths.engine]
osc = [{ wave = "saw", detune = -9 }, { wave = "pulse", width = 0.4, detune = 9, level = -2 }, { wave = "saw", octave = -1, level = -4 }]
filter = { type = "low24", cutoff = 380, resonance = 0.35, drive = 8 }
shape = { drive = 8, asym = 0.2 }
env = [{ attack = 0.5, attack_curve = -2, sustain = 1, release = 0.4 }, { attack = "note", attack_curve = -3 }]
lfo = [{ shape = "saw", rate = 26 }, { shape = "smooth", rate = 3 }]
mod = [["env2", "pitch", 19], ["env2", "filter.cutoff", 3], ["lfo1", "level", 7], ["env2", "lfo1.rate", 1.5], ["lfo2", "pitch", 0.4]]
level = -16

# a craft flying past: the engine at one pitch, the throb fast; its bus carries it from far off, past the head and away,
# and the doppler bends it
[synths.engfly]
osc = [{ wave = "saw", detune = -12 }, { wave = "pulse", width = 0.4, detune = 12, level = -2 }, { wave = "noise", level = -14 }]
filter = { type = "low24", cutoff = 1500, resonance = 0.3, drive = 8 }
shape = { drive = 8, asym = 0.2 }
env = [{ attack = 0.25, attack_curve = -2, sustain = 1, release = 0.35 }]
lfo = [{ shape = "saw", rate = 55 }]
mod = [["lfo1", "level", 5], ["random", "pitch", 2]]
level = -8

# a whoosh: noise and spread saws through a band-pass that opens three and a half octaves and shuts, over 0.7 s
[synths.whoosh]
osc = [{ wave = "noise" }, { wave = "saw", unison = { voices = 5, detune = 40, spread = 1 }, level = -18 }]
filter = { type = "band12", cutoff = 350, resonance = 0.5 }
env = [{ attack = 0.35, attack_curve = -2, decay = 0.4, curve = 2, release = 0.1 }, { attack = 0.33, attack_curve = -2, decay = 0.4, curve = 1 }]
mod = [["env2", "filter.cutoff", 3.5], ["env2", "pitch", 7]]
level = -18

# --- new in v2: the mid voices, 300 Hz to 2 kHz, each in its own band ------------------------------------------------

# keel, the mid lead: two saws a little apart and a pulse through a driven 24 dB low-pass that plucks open at each
# note (as far as it is hard) and settles at 1.1 kHz, so it keeps an edge: a reese with a pluck, played from F3 to C5
[synths.keel]
osc = [{ wave = "saw", detune = -9 }, { wave = "saw", detune = 9, phase = 0.4 }, { wave = "pulse", width = 0.42, level = -12 }]
drift = { pitch = 4, rate = 0.3, cutoff = 0.1 }
filter = { type = "low24", cutoff = 1100, resonance = 0.3, drive = 5 }
shape = { drive = 4, asym = 0.1, mix = 0.4 }
env = [{ attack = 0.003, decay = 0.5, sustain = 0.55, curve = 3, release = 0.14 }, { attack = 0.001, decay = 0.18, curve = 3 }]
lfo = [{ shape = "sine", rate = 4.8, delay = 0.3, fade = 0.3 }]
mod = [["env2", "filter.cutoff", 1.3], ["env2", "filter.cutoff", 1.0, "velocity"], ["note", "filter.cutoff", 0.5], ["velocity", "level", 5], ["lfo1", "pitch", 0.1]]
level = -13

# vox, the formant voice: three saws through a vowel that turns slowly between 'e' and 'o' (and a little at random each
# chord), a vibrato coming in late: held chords sung in the mids
[synths.vox]
osc = [{ wave = "saw", unison = { voices = 3, detune = 12, spread = 0.7 } }, { wave = "pulse", width = 0.3, level = -7 }]
drift = { pitch = 5, rate = 0.25 }
filter = { type = "formant", vowel = 1.8, resonance = 0.55 }
filter2 = { type = "low12", cutoff = 2600 }
env = [{ attack = 0.12, attack_curve = -1, decay = 0.8, sustain = 0.8, release = 0.6 }]
lfo = [{ shape = "smooth", rate = "h.", free = true }, { shape = "sine", rate = 5.2, delay = 0.35, fade = 0.4 }]
mod = [["lfo1", "filter.vowel", 1.1], ["random", "filter.vowel", 0.5], ["lfo2", "pitch", 0.12], ["velocity", "level", 5]]
level = -17

# comp, the chord comps: a pulse and a saw through a low-pass plucked open for 70 ms: short, wooden chords in the mids
# v4, the bed: a warm held pad for the chords under the leads, saws and a pulse, darker as it goes up (the cutoff
# follows the keyboard only a little), breathing over two bars
[synths.bed]
osc = [{ wave = "saw", unison = { voices = 4, detune = 12, spread = 0.5 } }, { wave = "pulse", width = 0.42, detune = -6, level = -5 }, { wave = "triangle", level = -3 }]
drift = { pitch = 4, rate = 0.22, cutoff = 0.12 }
filter = { type = "low24", cutoff = 1300, resonance = 0.1, drive = 1 }
env = [{ attack = 0.3, attack_curve = -1, decay = 2.5, sustain = 0.8, release = 1.1 }]
lfo = [{ shape = "smooth", rate = "2w", free = true }]
mod = [["lfo1", "filter.cutoff", 0.3], ["note", "filter.cutoff", 0.3], ["velocity", "level", 4]]
level = -14

# v4, the arp: a soft round pluck, a pulse and a triangle, its filter snapping shut; each note a little different
[synths.arp]
osc = [{ wave = "pulse", width = 0.35 }, { wave = "triangle", level = -4 }, { wave = "saw", detune = 7, level = -12 }]
filter = { type = "low24", cutoff = 650, resonance = 0.22, drive = 2 }
env = [{ attack = 0.002, decay = 0.2, sustain = 0.05, curve = 3, release = 0.07 }, { attack = 0.001, decay = 0.08, curve = 3 }]
mod = [["env2", "filter.cutoff", 2.0], ["env2", "filter.cutoff", 0.6, "random+"], ["velocity", "filter.cutoff", 0.7], ["velocity", "level", 5]]
level = -8

[synths.comp]
osc = [{ wave = "pulse", width = 0.36, detune = -6 }, { wave = "saw", detune = 6, level = -4 }, { wave = "triangle", octave = 1, level = -12 }]
filter = { type = "low12", cutoff = 800, resonance = 0.28, drive = 3 }
env = [{ attack = 0.001, decay = 0.14, sustain = 0.12, curve = 3, release = 0.06 }, { attack = 0.001, decay = 0.07, curve = 3 }]
mod = [["env2", "filter.cutoff", 1.6], ["env2", "filter.cutoff", 0.6, "random+"], ["velocity", "filter.cutoff", 0.5], ["velocity", "level", 5]]
level = -16


# v6, the vocal: three saws and a narrow pulse through a vowel's formants, each note opening from "oh" to "ah", a
# breath of noise in it, a late vibrato: a voice singing the hook
[synths.voc]
osc = [{ wave = "saw", unison = { voices = 3, detune = 7, spread = 0.35 } }, { wave = "pulse", width = 0.18, level = -9 }, { wave = "noise", level = -26 }]
drift = { pitch = 6, rate = 0.3 }
