env = [{ attack = 0.003, decay = 0.1, sustain = 0.45, curve = 2, release = 0.03 }]
mod = [["random", "filter.vowel", 1.5], ["velocity", "level", 5]]
level = 20

# the pit lane's formant voices: a saw, a pulse and a saw an octave down, shaped, through a vowel stepped every 16th
# and thrown each note; their buses downsample and crush them
[synths.fmt]
osc = [{ wave = "saw", detune = -6 }, { wave = "pulse", width = 0.25, detune = 6, level = -3 }, { wave = "saw", octave = -1, level = -8 }]
filter = { type = "formant", vowel = 1, resonance = 0.7 }
